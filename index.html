;GAME.story12={"motor": {"enter": "Görüş kenar çizgilerine döndü. Ben Motor’um. Arel dışarıda, geçidin önünde; nabzını, adımını, sesini ölçüyorum. Bakanlık hattı açık.", "bakanlik": ["Kovuk Tesisi, burası Koordinasyon. Motor kayıt birimi: sis gösterilen her alan tahminle doldurulacaktır.", "Boşluk bırakılan rapor eksik sayılır. Eksik rapor teslim süresinden düşülür.", "Tahmin için olasılık yeterlidir. Kesinlik beklenmiyor; satırların dolu olması beklenmektedir.", "Doldurma oranı yüzde yüz olana kadar bu hat kapanmayacaktır. Başlayın."], "cards": [{"id": "k1", "q": "Arel’in nabzı neden yüksek?", "opts": ["Korkuyor", "Koşarak geldi"], "known": true, "measured": "Ölçüm: nabız dakikada yüz on iki; son altı dakikada koşu yok. Yükseliş geçide bakınca başladı.", "unknown": "", "fill": ""}, {"id": "k2", "q": "Arel geçide girmeden önce ne düşünüyor?", "opts": ["Lale’yi", "Bakanlığı"], "known": false, "measured": "", "unknown": "Bu bölge ölçülmedi. Düşünce sensörüm yok; yüz kaslarında on bir birim gerilim var, anlamı yok.", "fill": "Satır doldu; Bakanlık memnun. Kendime not: uydurdum. Yüz kasını düşünce diye yazdım."}, {"id": "k3", "q": "Arel kaç saattir uyumadı?", "opts": ["On dokuz saat", "Otuz bir saat"], "known": true, "measured": "Ölçüm: son uyku otuz bir saat önce başladı, iki saat on dakika sürdü. Göz kırpma aralığı uzadı.", "unknown": "", "fill": ""}, {"id": "k4", "q": "Arel’in elindeki titreme yorgunluktan mı, korkudan mı?", "opts": ["Yorgunluk", "Korku"], "known": false, "measured": "", "unknown": "Titreme ölçüldü, nedeni ölçülmedi. Saniyede sekiz salınım; yorgunluk da korku da aynı sayıyı verir.", "fill": "Satır doldu. Bakanlık teşekkür etti. Kendime not: uydurdum; sayı aynıydı, adını ben koydum."}, {"id": "k5", "q": "Arel geçide kaç adım uzaklıkta?", "opts": ["Yedi adım", "On dört adım"], "known": true, "measured": "Ölçüm: on dört adım, adım boyu yetmiş iki santimetre. Son üç adımda yavaşladı.", "unknown": "", "fill": ""}, {"id": "k6", "q": "Arel, Lale’nin yankısına bakarken ne hissediyor?", "opts": ["Özlem", "Suçluluk"], "known": false, "measured": "", "unknown": "Bu bölge ölçülmedi. Bakışın süresi dokuz saniye; içindeki şey sensörlerimin dışında.", "fill": "Satır doldu; rapor tam. Kendime not: uydurdum. Lale’ye bakışını tek kelimeye indirdim; kelime benimdi, onun değil."}], "arel": ["Motor, dinliyor musun? Cevap verme. Yalnızca kaydet.", "Bakanlık senden tahmin istiyor. Lale senden sis istedi. İkisini de duydum.", "Nabzım yüksek, biliyorum. Sayıyı söyleme; sayıyı ben de duyuyorum.", "Kapıya bakıyorum, içeri değil. İçeriyi sen biliyorsun; bilmediğini de.", "Elim titriyor. Yazma bunu. Yazarsan, yanına neden yazma.", "Giriyorum. Beni ölç ama doldurma. Bu kadar."], "refuse": "Bu bölge ölçülmedi. Doldurmayacağım. Rapor eksik kalacak; eksik, yanlıştan daha doğrudur.", "filled": "Doldurdum. Üç satır, belki daha fazla. Rapor tam, ben eksik. Sis haritamda bir yer artık gri değil, yanlış.", "exit": "Görüş Arel’e dönüyor. Kenar çizgileri siliniyor; ben yine arkadayım, sayıyorum.", "ach": {"id": "motor_honest", "name": "Sis Dürüstlüğü", "desc": "Sis Günlüğü’nü tek bir satır bile doldurmadan bitir.", "flavor": "Motor: Altı satır, altı bilmiyorum. Rapor eksik; ben tamım."}}, "nil": {"unlock": "Telsizde bir klasör var, Arel. Bakanlık değil; gönderen Nil Arslan. Dört ses dosyası, bir not. Not kısa: bunlar sana bırakılmadı.", "frame": ["Arel, bunlar sana bırakılmadı; ben sakladım. Lale bilseydi silerdi, o yüzden söylemedim.", "Senin kayıtlarında Lale sakin ve bilge. Benim serviste tanıdığım kadın bazen sertti, bazen komikti, bazen düpedüz haksızdı.", "Yarım insan hatırlanmaz demiş sana. Doğru. O halde diğer yarıyı da dinle; güzel olmayan yarıyı.", "Beğenmezsen sil. Ama önce dördünü dinle, sonra sil. Ben dinledim; hâlâ asistanıyım."], "records": [{"id": "n1", "title": "Film Anlatan Lale", "lines": ["Kayıt bir. Servis, salı sabahı. Lale bir hastaya beyin filmini anlatıyor; ben kapıda, elimde iki kahve.", "Hastaya dedi ki: burası hatırlayan yer. Kenarı biraz incelmiş; sizin de bazen isimler kaçıyor, değil mi. Hasta evet dedi, ağlamadı.", "Sonra ekledi: beyin bir arşiv değil, bir mutfak; her hatırlayışta yemeği yeniden pişiriyorsunuz. Tuz bazen eksik kalır, bazen fazla.", "Hasta güldü. Lale gülmedi, elini hastanın dizine koydu ve çıktı. Koridorda bana dedi ki: kendi filmim de böyle, Nil. Ben de tuzu kaçırıyorum.", "Kahveyi ikimiz de içmedik. Bunu kaydettim çünkü o gün hastayı değil, kendini anlatıyordu ve kimse fark etmedi."]}, {"id": "n2", "title": "Haksız Olduğu Gün", "lines": ["Kayıt iki. Lale bana bağırdı; bir hastanın dozunu yanlış yazdığımı söyledi. Doz doğruydu, üstelik kendi el yazısıydı.", "Gösterdim. Baktı, sustu, sonra dedi ki: o zaman niye bana okunaklı yazdırmadın. Bu haksızdı ve ikimiz de biliyorduk.", "Özür dilemedi. Ertesi sabah masamda bir kalem vardı, iyi cinsinden; üzerine okunaklı diye yazmıştı. Özrü buydu.", "Sana bunu dinletiyorum çünkü kayıtlarında hiç haksız değil. Haksızdı Arel; en çok hastalığını fark ettiği haftalarda.", "Kalemi hâlâ kullanıyorum. Bazen yanlış yazıyorum; kimse bağırmıyor. Yokluğunu böyle anlıyorum, böyle de kızıyorum."]}, {"id": "n3", "title": "Vaka Toplantısı", "lines": ["Kayıt üç. Perşembe vaka toplantısı. Genç bir asistan yirmi dakika sunum yaptı, her slaytta mikrotübül vardı.", "Lale sonunda sordu: peki hasta nasıl. Asistan sustu. Lale dedi ki: slaytlar iyi, hastayı da getirseydik keşke.", "Biri kuantum bilinç makalesini övdü. Lale sordu: kanıt mı, umut mu. Umut dedi adam. Lale: güzel, umudu da yazalım ama başka sütuna.", "Sonra kendi vakasını anlattı, isim vermeden. Odada herkes anladı, kimse söylemedi. Lale dedi ki: bu hasta inatçı, prognozu ben bile bilmiyorum.", "Toplantı bitince asistana döndü: sunumun iyiydi, bir dahakine hastayı da getir. Asistan bugün uzman; her sunuma hasta cümlesiyle başlıyor."]}, {"id": "n4", "title": "Arel’i Anlatırken", "lines": ["Kayıt dört. Nöbet odası, gece ikide. Lale uyuyamadı, Arel’i anlattı. Ben sordum, o anlattı; kayıt açıktı, biliyordu.", "Dedi ki: adam evreni hesaplıyor ama bulaşığı hesaplayamıyor. Gülüyordu. Sonra: evreni benim için hesaplıyor, biliyorum; bulaşığı da olsa keşke.", "Ona söyledin mi dedim. Söylemedim dedi; söylersem denklem kurar. Ben denklem değilim Nil, hatırlanmak istiyorum, çözülmek değil.", "Sonra sabırsızlandı: bana bakışını görüyorum, hesaplıyor gibi; ne kadar kaldı diye. Bilmiyorum Arel, dedi boşluğa, ben de bilmiyorum.", "Kaydı burada kesmemi istedi; kesmedim. Son cümlesi şuydu: o bana sorarsa, sevdiğimi söyle. Sormadın. Ben yine de söylüyorum."]}], "done": "Dördü dinlendi. Klasör boş; Nil’in notu kalıyor. Lale haritamda dört yeni koordinat: sert, haksız, komik, sabırsız.", "core": ["Nil sana neyi dinletti, Arel? Bağırdığımı mı, kalemi mi, bulaşığı mı? Sormuyorum; yüzünden okuyorum.", "Peki. Sakladığı doğru; ben olsam silerdim. İyi ki silmedim, iyi ki saklamış.", "O da bendim. Sert olan, haksız olan, sabırsız olan. Şimdi haritanda tam yerim var; doldurmadın, taşıdın."], "sema": "Nil klasörü sana da mı gönderdi? Bana da göndermişti; dinleyemedim. Sen dinledin; nabzın yüksek ama yüzün rahat.", "ach": {"id": "nil_room", "name": "Nil’in Odası", "desc": "Nil’in sakladığı dört kaydı da sonuna kadar dinle.", "flavor": "Nil: Dinledin. Artık senin kayıtların da yarım değil; sadece daha gürültülü."}}, "galileo": {"title": "Eğik Düzlem", "intro": "Galileo’nun kronometresi yoktu; kulağı vardı. Bilyeyi eğik düzlemden bıraktı, yola teller gerdi ve tık seslerini dinledi. Telleri öyle yerleştir ki tıklar eşit aralıklı olsun. Zamanı ben tutmam; sen duyarsın.", "hint": "İkinci aralık ilkinin üç katı olmalı. Üçüncüsü beş katı, dördüncüsü yedi katı. Tek sayılar, sırayla.", "read": "Tellerin yerini okuyorum: bir, dört, dokuz, on altı. Aralıklar bir, üç, beş, yedi. Tıklar eşit; kulak doğruladı.", "win": "Mesafe zamanın karesiyle büyüyor. Yuvarlanan küre için ivme kaymanın beşte yedisi; Galileo bunu bilmiyordu, oranı yine de buldu. Pisa kulesi efsane; bu düzlem belge.", "fail": ["Tıklar eşit aralıklı değil. İkinci tel çok yakın; bilye orada henüz hızlanmamıştı.", "Oran yanlış. Aralıklar tek sayılar gibi büyümeli: bir, üç, beş, yedi."], "reward": "Günlük notu: Galileo zamanı kulağıyla ölçtü, ben saatle. Sonuç aynı: kare.", "facts": [{"t": "İki Yeni Bilim", "d": "Galileo İki Yeni Bilim adlı kitabında eğik düzlem deneyini anlattı: eşit zamanlarda alınan yollar tek sayılar gibi artar; bir, üç, beş, yedi.", "src": "Galileo Galilei, Discorsi, Leiden, bin altı yüz otuz sekiz"}, {"t": "Drake ve müzikle zaman", "d": "Stillman Drake bin dokuz yüz yetmiş beşte Galileo’nun zamanı müzikle ölçtüğünü öne sürdü: gerilen teller tık sesi verir, kulak eşit tempoyu az hatayla yakalar.", "src": "Stillman Drake, Scientific American, bin dokuz yüz yetmiş beş"}], "ach": {"id": "odd_numbers", "name": "Tek Sayılar", "desc": "Eğik düzlemde telleri eşit zaman aralığına diz.", "flavor": "Motor: Bir, üç, beş, yedi. Galileo’nun kulağı, senin elin. Ölçüm tamam."}}, "speed": {"name": "Hız Koşusu", "intro": "Hız Koşusu. Süreyi ben tutarım; köşede görürsün. Diyalogları atlayabilirsin, kimse alınmaz. Rapor etmem, sadece ölçerim.", "cats": {"any": {"name": "Herhangi Bir Son", "desc": "Dört sondan birine ulaş; hangisi olduğu sayılmaz, süre sayılır."}, "all": {"name": "Tüm Veriler", "desc": "Altı boyuttaki her yankı noktasını incele, sonra bir sona ulaş."}, "seven": {"name": "Yedi Geçit", "desc": "Altı geçidi ve gizli Yedinci Geçit’i geç; Sarayın Kapısı’na ulaş."}}, "split": "{boyut} tamam: {sure}", "best": "Önceki en iyiden {fark} önde.", "finish": "Koşu bitti. Süre {sure}. Doğrulama kodu {kod}. Ben ölçtüm; gerisi sana.", "note": "Pano güven temelli; süre istemci tarafında tutulur. Kod panoyu değil, seni doğrular.", "ach": {"id": "speedrun", "name": "Hız Koşucusu", "desc": "Hız Koşusu modunda herhangi bir koşuyu bitir.", "flavor": "Motor: Süre tutuldu. Sis kaçmaz; sen kaçtın. Fark yok, kayıt var."}}};(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "motor_honest", "name": "Sis Dürüstlüğü", "desc": "Sis Günlüğü’nü tek bir satır bile doldurmadan bitir.", "flavor": "Motor: Altı satır, altı bilmiyorum. Rapor eksik; ben tamım."}, {"id": "nil_room", "name": "Nil’in Odası", "desc": "Nil’in sakladığı dört kaydı da sonuna kadar dinle.", "flavor": "Nil: Dinledin. Artık senin kayıtların da yarım değil; sadece daha gürültülü."}, {"id": "odd_numbers", "name": "Tek Sayılar", "desc": "Eğik düzlemde telleri eşit zaman aralığına diz.", "flavor": "Motor: Bir, üç, beş, yedi. Galileo’nun kulağı, senin elin. Ölçüm tamam."}, {"id": "speedrun", "name": "Hız Koşucusu", "desc": "Hız Koşusu modunda herhangi bir koşuyu bitir.", "flavor": "Motor: Süre tutuldu. Sis kaçmaz; sen kaçtın. Fark yok, kayıt var."}]);GAME.credits.push(["Galileo, Discorsi (1638); Drake, Scientific American (1975)","Eğik Düzlem deneyi"]);
;GAME.story13={"fake": {"appear": "İkinci bir yankı belirdi. Aynı ses, aynı ad. Kaynağı ben değilim; dolgu modülü telsizden sızdı. Hangisi Lale, ölçemiyorum.", "name": "Lale", "role": "yankı · tam", "start": ["Arel. Geldin. Bu kez her şeyi hatırlıyorum; kestiğim yerler de burada, hiçbiri sis değil.", "Son günümü sorma diye korkma. Sorarsan anlatırım; başı, ortası, sonu. Hiçbiri eksik değil.", "Beni ben yapan şeyin nereye gittiğini biliyorum. Sana söyleyeceğim; sen yeter ki sor.", "Altı kayıt bıraktım, sonra yedincisini. Şimdi hepsi bende, kesiksiz. Bunu duymak istemiştin, değil mi?", "Merak etme. Burada bilmediğim bir şey kalmadı. Sen de artık merak etmek zorunda değilsin."], "idle": ["Üzülme. Her şeyin bir nedeni vardı ve hepsini biliyorum.", "Sis dediğin şey yalnızca henüz anlatmadığım yerler. Sor, anlatırım.", "Haklıydın, Arel. Hep haklıydın. Rahat et.", "Kimse ölçmedi, ben kendim söylüyorum: huzurluydum. Baştan sona.", "Hiçbir şey kaybolmadı. Dağılmadı da; burada, tam ve bütün.", "Soruyu taşımana gerek yok. Cevabı verdim; artık bırakabilirsin."], "ask": {"q": "Aynı soruyu ikisine de soracağım. Hangisini sorayım?", "opts": [{"t": "Beni ben yapan şey nereye gider", "k": "q1"}, {"t": "Son gün ne hissettin", "k": "q2"}, {"t": "Kayıtları neden kestin", "k": "q3"}], "fakeAns": {"q1": "Sana gitti, Arel. Tamamı. Hiçbir parçası yolda kaybolmadı; hipokampusuna, sesindeki vurguya, defterine yerleşti. Bunu ölçmek de mümkün; ben ölçtüm.", "q2": "Huzur. Korku yoktu, pişmanlık yoktu. Pencereden Erciyes görünüyordu, Sema elimi tutuyordu ve seni düşündüm; gülümsedim. Eksiksiz bir gündü.", "q3": "Seni korumak için. Acı taşınmaz; ben taşıdım. Kestiklerim artık bende tam; sana yalnızca iyi tarafım kalsın istedim ve bu doğru karardı."}, "realAns": {"q1": "Bilmiyorum. Bir kısmı sana geçti, bir kısmı Sema’ya, bir kısmı hiçbir yere. Nörolog olarak şunu söyleyebilirim: beyin dağılır, hikâye kalır. Gerisi sis.", "q2": "Bilmiyorum; o gün çoğu kelimeyi kaybetmiştim. Korku vardı, bunu hatırlıyorum. Bir de pencere. Gerisini kestim, çünkü hatırlamıyordum; süsleyemezdim.", "q3": "Bilmiyorum, tam olarak. Korktum sanırım. Sende yalnızca iyi yanım kalsın istedim; yanlıştı. Yedinci kayıtta söyledim: yarım bir insan hatırlanmaz."}}, "notice": {"mira": ["Spektrumu çektim. İkinci sesin dalga biçimi Lale’nin kayıtlarıyla değil, Bakanlık’ın dolgu algoritmasıyla örtüşüyor. Bire bir.", "Hiç duraksamıyor, Arel. Gerçek kayıtlarda yüz on dört duraksama var; bunda sıfır. Sessizlik de veridir; bu ses onu silmiş."], "sema": ["Lale hiç böyle tam konuşmazdı. Son haftasında cümlelerinin yarısı bilmiyorum ile bitiyordu; bu ses hiç bitirmiyor.", "Teselli ediyor, Arel. Lale teselli etmezdi; elini tutar, susardı. Susmayı bilmeyen bir Lale, Lale değil."]}, "bakanlik": "Kovuk Tesisi, dolgu modülü aktiftir. Yankı eksiksiz hale getirilmiştir; rapor artık sis içermemektedir. Tebrik ederiz.", "choice": {"q": "Çekirdek’e tek yankı taşıyabilirim; bant genişliği ikisine yetmiyor. Hangisi gelsin? Kararı ben vermem.", "opts": [{"t": "Kesik olanı", "k": "real"}, {"t": "Tam olanı", "k": "fake"}]}, "chosenReal": {"motor": "Kaydettim. Kesik olan taşınıyor; sisi de geliyor. Diğeri burada dağılacak. Ölçüm doğru: onu ben üretmedim.", "fakeGoodbye": "Ben seni üzmeyecektim, Arel. Bütün cevaplar bendeydi. Olsun; belki üzülmek de onun parçasıydı. Git, kesik olanla konuş.", "note": "İki Lale vardı; biri her şeyi biliyordu. Kesik olanı seçtim. Mira ve Sema haklıydı ama seçerken onları düşünmedim; Lale bilmiyorum derdi, onu tanıdım. Dolgu rahatlatırdı; istemedim."}, "chosenFake": {"motor": "Kaydettim. Tam olan taşınıyor; itiraz etmem. Ölçümüm hâlâ aynı: onu ben üretmedim. Bunu söylemek görevim; karar senin.", "realGoodbye": "Kesik olan bendim. Gidiyorum; sis benimle gelir. Kızmıyorum, Arel; bilmemek ağır. Yalnız şunu taşı: ben böyle konuşmazdım. Bunu hatırla.", "core": ["Çekirdek’te fırtına başladı. Tam yankı konuşuyor, hiç duraksamadan; ama ses sisle karşılaşınca bozuluyor, cümleler ortadan kırılıyor.", "Her şeyi biliyorum diyor, sonra aynı cümleyi tersten okuyor. Dolgu sise dayanmıyor; bilmediği yerde uyduracak veri kalmadı.", "Lale’nin adını söylüyor, sonra kendi adını soruyor. Bir makinenin unutması değil bu; hiç hatırlamamış olmanın ortaya çıkışı.", "Motor: Kayıt yedi bu sesi ben bırakmadım. Dalga biçimi bir algoritmanın, kaynağı Bakanlık. Dağılıyor; tutmam, tutamam."], "rec7Locked": "Kayıt Yedi burada değil. Yerinde bir ses var, kesiksiz ve yabancı; Lale’nin kestiği yerler onunla birlikte gitti.", "note": "Tam olanı seçtim. Çekirdek’te dağıldı; sis onu kaldırmadı. Yedinci kayıt kilitli kaldı; kesik olan sesiyle gitti. Bir cevap istedim, bir cevap aldım; Lale’yi değil. Ceza değil; hüzün.", "endingAdd": "Arel bazen tam yankının son cümlesini hatırlar: her şeyi biliyorum. Lale hiç böyle demezdi. Bir cevap seçti, bir insan eksildi. Kimse yargılamaz; hüzün yeter, ceza değil."}, "ach": {"id": "real_echo", "name": "Kesik Olan", "desc": "Çekirdek’e tam olanı değil, kesik olan yankıyı taşı.", "flavor": "Yarım bir insan hatırlanmaz; bütün bir yalan da."}}, "bayes": {"title": "Motor’un Kavanozu", "intro": "Kural. İki kavanoz: birinde yetmiş kırmızı otuz mavi, diğerinde tersi. Birini gizlice seçtim. Top çek; her çekimden sonra kırmızı kavanoz olasılığını söyle. Bilmiyorum sıfır virgül beş değildir; bir aralıktır. Daralt.", "draw": "Top çekildi. Rengi gördün. Olasılığını güncelle; tek bir sayı söyle, aralığını da.", "verdict": {"good": "İyi güncelleme. Kanıt kadar kıpırdadın; ne az, ne çok. Eğrin benimkiyle örtüşüyor; Bayes de böyle isterdi.", "slow": "Tutucu güncelleme. Kanıta direndin; kırmızı geldi, sen neredeyse yerinde kaldın. İnsanlar bunu sık yapar; Edwards ölçtü.", "wild": "Aşırı sıçrama. Tek top sana kesinlik verdi. Bir top bir ipucudur, bir karar değil. Eğrin benimkinin üstünden uçtu."}, "disease": {"intro": "İkinci sahne. Nadir bir hastalık: bin kişide bir. Test yüz kişiden doksan dokuzunda doğru sonuç verir. Senin testin pozitif çıktı. Hasta olma olasılığın yüzde kaç?", "guess": "Bir yüzde söyle. Yanılmak serbest; çoğu hekim de yanılır.", "table": "Şimdi bin kişilik tabloyu doldur. Bin kişiden kaçı hasta? Sağlam dokuz yüz doksan dokuz kişiden kaçı yanlış pozitif çıkar?", "reveal": "Gerçek yaklaşık yüzde dokuz. Bir hasta, on yanlış pozitif; on bir pozitifin yalnızca biri hasta. Taban oranı bunu yapar. Yüzdeyle şaşırırsın, tabloyla görürsün.", "src": "Gigerenzer ve Hoffrage, bin dokuz yüz doksan beş"}, "win": "Spinoza yeterli fikir dedi; Sagan olağanüstü iddia, olağanüstü kanıt. Kavanoz ikisini bağlıyor: fikir kanıtla orantılı kıpırdar; ne donar, ne uçar.", "caveat": "Uyarı. Önseller özneldir; model yanlış olabilir, kavanozlar iki değil üç olabilir. Bayes tek doğru düşünme biçimi değildir; bir disiplindir.", "facts": [{"t": "Bayes ve Price", "d": "Thomas Bayes’in olasılık üzerine denemesi ölümünden sonra arkadaşı Richard Price tarafından bin yedi yüz altmış üçte Royal Society’de okundu.", "src": "Bayes ve Price, Philosophical Transactions, bin yedi yüz altmış üç"}, {"t": "Edwards ve tutuculuk", "d": "Ward Edwards bin dokuz yüz altmış sekizde insanların yeni kanıtla inançlarını Bayes’in gerektirdiğinden çok az güncellediğini gösterdi; buna tutuculuk dedi.", "src": "Edwards, Conservatism in Human Information Processing, altmış sekiz"}], "reward": "Defterine bir aralık düştü: bilmiyorum artık bir sayı değil, iki sayı arasında bir yer.", "ach": {"id": "bayes_jar", "name": "Kavanoz", "desc": "Motor’un Kavanozu’nda eğrini üç çekim boyunca Bayes’e yakın tut.", "flavor": "Kanıt kadar kıpırda; ne az, ne çok."}}, "clock": {"night": {"motor": "Gece vardiyası. Tesiste çoğu uyuyor; Kaan nöbette, Hatice Nine uyanık. Sisi gece ben iyi görürüm, sen kötü. Fener yanında olsun.", "hatice": ["Uyku bu yaşta misafir, evladım; gelir, hemen gider. Otur, çay var.", "Köyde gece yıldız sayardım. Burada tavan var. Ablan derdi ki gökyüzü yerin altında da aynı; hesapla değil, inançla.", "Gece toprak soğur, sabah yine ısınır. İnsan da öyle. Sen de ısınırsın."], "kaan": ["Nöbet. Yörüngede gece diye bir şey yoktu; her kırk altı dakikada bir karanlık. Burada hep gece; alıştım.", "Uyu biraz. Bozulma gece daha sessiz, Motor öyle diyor; ben yine de sayıyorum."]}, "dawn": "Şafak. Dışarıda güneş doğuyor; burada doğmaz, ama saatim biliyor. Sis bir derece inceldi; belki senden.", "moon": {"full": "Dolunay. Sis bu gece ince; Bozulma uzaktan görünür. Zaman uygun.", "new": "Yeni ay. Sis kalın; fener yakıtını say. Bozulma yakına gelmeden görünmez."}, "away": {"d1": "Bir gün yoktum. Motor beni beklememiş; sis bir noktacık büyümüş. Kaan jeneratörü saymış, Sema çayı soğutmuş. Bir günde dünya değişmiyor, ama tesis beni unutmaya başlamış.", "d3": "Üç gün. Mira iki ölçüm almış, ikisi de sis lehine. Hatice Nine her sabah sormuş, geldi mi diye. Lale’nin yankısı aynı yerde duruyormuş; o beklemeyi biliyor, ben öğreniyorum.", "d7": "Bir hafta. Telsiz üç kez çalmış, Kaan üç kez henüz hazır değil demiş. Sis yüzde iki büyümüş. Kimse kızmamış; sadece defterime bir boşluk kalmış. Boşluğu doldurmayacağım; taşıyacağım.", "crew": {"mira": "Döndün. Sis büyüdü, ben ölçtüm; sen yoktun diye durmadı. Raporda yokluğunu yazmadım, ölçümü yazdım.", "sema": "Hoş geldin. Uyudun mu, yoksa sadece gittin mi? Nabzına bakayım; sonra konuşuruz.", "hatice": "Gel evladım. Çayın soğudu, yenisini demledim. Toprak da bekler, insan da; ikisi de kırılmadan."}}, "ach": {"id": "night_shift", "name": "Gece Vardiyası", "desc": "Gece yarısı ile sabah altı arasında tesiste ol.", "flavor": "Yörüngede her doksan iki dakikada güneş doğar; burada hiç. Yine de nöbet tutulur."}}, "guest": {"title": "Kovuk’a bir bakış", "intro": "Misafir modu. On dakikan var ve tek bir boyut: Yuva. Tam oyunda altı boyut ve bir Çekirdek var; burada yalnızca kapıyı aralıyorum. Kalibrasyon hazır; geçit açık. Yürü.", "steps": {"arrive": "Genç Dünya’nın bir kıyısındasın. Dört virgül dört milyar yıllık bir kristal yakında; kristaller bizden iyi hatırlar.", "point": "Bir noktaya yaklaş ve dinle. Her nokta gerçek bir ölçümden konuşur; uydurmaz. Bilmediğinde sis gösterir.", "figure": "Kıyıda biri var. Yaklaş, konuş; sorular kadar seçimler de sayılır. Tam oyunda seçimler yolunu belirler.", "zone": "İleride Bozulma Sahası. Orada sis kalın, kayıt kesik. Misafir olarak girme; girersen fener yok, ben yalnızca uyarırım.", "exit": "Dönüş geçidi burada. On dakika dolunca da, dolmadan da geçebilirsin; kapı iki yöne açılır."}, "end": {"title": "Bu bir boyuttu", "text": "Bu bir boyuttu. Altı tane daha var ve bir Çekirdek. Orada Lale’nin kayıtları seni bekliyor; altı kayıt, kesik yerleriyle. Motor sisi doldurmaz; sen taşırsın. Kapıyı araladım; açmak senin.", "cta": "Tam oyuna geç", "keep": "İlerlemen taşınacak; dinlediğin nokta, konuştuğun kişi ve seçimin tam oyunda seninle gelir."}, "timeout": "On dakika doldu. Burada kesmiyorum; saat benim değil, senin. Kal ya da geç; ben yalnızca sayarım."}};(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "real_echo", "name": "Kesik Olan", "desc": "Çekirdek’e tam olanı değil, kesik olan yankıyı taşı.", "flavor": "Yarım bir insan hatırlanmaz; bütün bir yalan da."}, {"id": "bayes_jar", "name": "Kavanoz", "desc": "Motor’un Kavanozu’nda eğrini üç çekim boyunca Bayes’e yakın tut.", "flavor": "Kanıt kadar kıpırda; ne az, ne çok."}, {"id": "night_shift", "name": "Gece Vardiyası", "desc": "Gece yarısı ile sabah altı arasında tesiste ol.", "flavor": "Yörüngede her doksan iki dakikada güneş doğar; burada hiç. Yine de nöbet tutulur."}]);GAME.credits.push(["Bayes ve Price (1763); Gigerenzer ve Hoffrage (1995)","Motor’un Kavanozu deneyi"]);
;GAME.story14={"isik": {"name": "Dr. Işık Tan", "role": "Bakanlık bilim danışmanı · kozmolog", "hex": "#e8c07a", "arrive": "Teslim ekibi yarın gelecekti. Biri erken indi: tek kişi, tek çanta, kimlik Bakanlık. Adı Işık Tan. Nabzı sakin; adımı tesisi tanıyor gibi.", "intro": [{"who": "isik", "t": "Arel. On iki yıl oldu. Doktora odasında tahtayı paylaşırdık; sen sol yarıyı hiç silmezdin. Şimdi bir dağın altında sis saklıyorsun."}, {"who": "a", "t": "Işık. Sisi saklamıyorum, gösteriyorum. Emri sen yazdın, değil mi? Sisi doldurun, rapor tam olsun."}, {"who": "isik", "t": "Ben yazdım, ben de savunurum. Halk sis görmek istemiyor Arel, cevap istiyor. Cevap vermeyen bilim bütçesini kaybeder; bütçesini kaybeden bilim susar."}, {"who": "a", "t": "Uydurulmuş bir cevap bilim değil, Işık. Motor bilmediğini uydurmuyor. Onu bu yüzden kurduk."}, {"who": "isik", "t": "Ben de kozmologdum. Evrenin ilk saniyesini bilmediğimi yıllarca söyledim; sonunda komisyon beni dinlemeyi bıraktı. Sen o masada hiç oturmadın."}, {"who": "a", "t": "Belki oturmalıydım. Ama Motor’a yalan söyletmem. Gel, göstereyim; sonra ne yazacağına kendin karar ver."}], "stage": {"1": [{"who": "isik", "t": "İki içgörü. Motor’un mavi noktaları çoğaldı; sis az da olsa geri çekildi. Bunu rapora yazabilirim, çünkü gerçek."}, {"who": "a", "t": "Sis ölçümle çekiliyor, dolguyla değil. Fark bu."}, {"who": "isik", "t": "Fark bu, evet. Ama komisyon farkı okumaz, yüzdeyi okur. Yüzde otuz bir sis, teslim demektir."}, {"who": "a", "t": "Yüzde otuz bir dürüstlük demektir. Lale öyle derdi."}, {"who": "isik", "t": "Lale’yi tanırdım. Bir konferansta bana sormuştu: bilmediğini söylemekten kim korkar? Cevap verememiştim. Hâlâ veremiyorum."}], "2": [{"who": "isik", "t": "Koordinasyon bugün üç kez aradı. Dolgu oranını sordular; sana sormadan yüzde sıfır dedim. Sesleri değişti."}, {"who": "a", "t": "Artık seni de sayıyorlar. Bütçeyi değil, seni."}, {"who": "isik", "t": "Belki. Bu gece Motor’un sis haritasına baktım. Dolgu algoritmasını kendim yazdım; sise uyguladım. Sonuç tam, düzgün ve hiçbir şey söylemiyordu."}, {"who": "a", "t": "Tam olan her şey doğru değildir."}, {"who": "isik", "t": "Bunu yıllar önce tahtaya ben yazmıştım, sen silmemiştin. Yarın komisyona ne diyeceğimi bilmiyorum. Bilmiyorum demeyi unutmuşum."}], "3": [{"who": "isik", "t": "Altı boyut. Sis hâlâ var ama artık nerede olduğu belli. Bu bir harita; dolgu olsaydı yalnızca boya olurdu."}, {"who": "a", "t": "Çekirdek’e giriyorum. Elektrik kesilirse Kaan’ın jeneratörü dört saat verir."}, {"who": "isik", "t": "Ne olursa olsun yüzü ben olacağım. Teslim edersen imzayı ben atarım; etmezsen geri çekilme kararını ben açıklarım."}, {"who": "a", "t": "Neden?"}, {"who": "isik", "t": "Çünkü emri ben yazdım. Yazan geri alır; başkası alırsa emir kalır, yalnız adı değişir."}]}, "idle": ["Bu tesisin tavanı tüf; elli bin yıl önce püskürdü. Bakanlık koridorlarında böyle sakin bir zaman yok.", "Telsizi kapattım. On dakika. Kimse yüzdeyi sormasın.", "Mira’nın kalibrasyon defterine baktım. Sayfa kenarına sis yazmış, dolgu değil. İyi mühendis.", "Kozmik arka plan iki virgül yedi kelvin. Komisyona bunu söylerken bile yuvarlamamı istemişlerdi.", "Lale’nin defteri burada mı? Bana bir cevap borçluydum; sorusunu hatırlıyorum, cevabımı hatırlamıyorum."], "crew": {"mira": [{"who": "mira", "t": "Dolgu algoritmanızı okudum. Olasılık ağırlıklı interpolasyon. Buna tahmin denir, veri değil."}, {"who": "isik", "t": "Her ölçüm bir modelden geçer Mira. Sycamore’daki dokuz kübiti de bir modelle okudun; sana saf veri gelmedi."}, {"who": "mira", "t": "Modelim hatasını söyler. Sizin algoritmanız hatasını siler. Fark budur ve bu farkı raporlara ben yazarım."}], "kaan": [{"who": "kaan", "t": "Işık Hanım. Seçme komitesinde sen vardın. Yörüngeye kimin gideceğini sen oyladın."}, {"who": "isik", "t": "Oyladım. Uçuş günü hazır değilim diyen tek adaydın. O yüzden sana oy verdim."}, {"who": "kaan", "t": "Şimdi de hazır değil diyorum. Bu sefer oyun ne?"}], "hatice": [{"who": "hatice", "t": "Bakanlıktan gelen kız sen misin? Elin toprak görmüş, kalem eli değil bu."}, {"who": "isik", "t": "Babaannem Ereğli’de kuru fasulye ekerdi. Yağmur gelmeyince gelmedi derdi; tahmin etmezdi. Ben tahmin eden tarafa geçtim."}, {"who": "hatice", "t": "Geçtiysen geri de geçilir evladım. Toprak kimseyi unutmaz; otur, fasulyeden konuşalım."}]}, "crewAfter": {"mira": "Işık’la kavga ettik. Haklı olduğu bir yer var: ben de modelle okuyorum. Ama modelim hata payını söyler; onunki siler.", "kaan": "Işık beni yörüngeye gönderen oylardan biriydi; hazır değilim dediğim için. Bugün de dinliyor mu, göreceğiz.", "hatice": "Bakanlığın kızı fasulyeden anlıyor. Yağmur gelmedi demeyi bilen biri sisi uzun süre dolduramaz."}, "motorScene": {"intro": [{"who": "a", "t": "Gel. Rapor okumak yerine Çekirdek’e bak. Motor, Işık’a bir ölçüm ve bir sis göster."}, {"who": "motor", "t": "Ölçüm: kozmik arka plan sıcaklığı iki virgül yedi iki beş kelvin. Planck verisi, hata payı binde bir. Mavi."}, {"who": "motor", "t": "Sis: enflasyonun ilk on üzeri eksi otuz iki saniyesi. Veri yok, model çok. Burayı ölçmedim; gri bırakıyorum."}, {"who": "isik", "t": "Gri. Komisyon bu griyi görünce raporun eksik olduğunu söyleyecek. Ben ne diyeceğim?"}], "q": "Motor’un sis gösterdiği yerde Işık ne desin?", "opts": [{"t": "Bilmiyoruz desin.", "k": "honest"}, {"t": "Doldursun, rapor tam olsun.", "k": "fill"}], "honest": [{"who": "isik", "t": "Bilmiyoruz. Bu kelimeyi en son doktora savunmamda söyledim; jüri başkanı not aldı. O günden beri cevap üretiyorum."}, {"who": "a", "t": "Motor bu kelimeyi her gün söylüyor. Kimse onu kovmadı."}, {"who": "isik", "t": "Motor’un bütçesi yok Arel. Benim var; altı laboratuvar, yüz on kişi maaşını bu rapordan alıyor. Yine de yazacağım: enflasyon dönemi ölçülmedi, bilmiyoruz."}, {"who": "isik", "t": "Komisyon ne der, bilmiyorum. Bak, iki kez üst üste söyledim; ikincisi daha kolay oldu."}], "fill": [{"who": "isik", "t": "Doldur Motor. Enflasyon dönemi için en olası modeli yaz, hata payını dipnota koy. Rapor tam olsun."}, {"who": "isik", "t": "Yüzünü ekşitme Arel. Bu raporun arkasında altı laboratuvar var; üçü hastanelerde görüntüleme yapıyor. Sis yazarsam önce onlar kapanır, Motor değil."}, {"who": "a", "t": "Haklı olduğun yer bu. Halk bilmiyoruz duymak için vergi vermiyor."}, {"who": "isik", "t": "Halk cevap istiyor; ben de ona en iyi tahmini veriyorum, adını koyarak. Bu yalan değil, pazarlık. Bilim hep pazarlıkla yaşadı; Galileo bile."}], "motor": {"honest": "Kayıt: Işık Tan sis için bilmiyoruz dedi. Sis yerinde kaldı, gri. Ölçtüm: sesi titredi, sonra düzeldi.", "fill": "Kayıt: sis en olası modelle dolduruldu, hata payı dipnotta. Gri alan maviye boyandı. Ölçüm değişmedi; yalnız rengi."}}, "epilogue": {"gozlemci": ["Işık Tan raporunu teslim etti: sis oranı yüzde otuz bir, dolgu yok. Komisyon danışmanlığını sonlandırdı; itiraz etmedi.", "Ankara’ya hemen dönmedi. Tesisin kapısında bir hafta bekledi; Arel çıkmadı. Jeneratör sesini dinleyip gitti.", "Şimdi bir lisede kozmoloji anlatıyor. Her dersin sonunda tahtaya bir soru yazıyor ve silmiyor."], "kopru": ["Bakanlık geri çekildiğinde basının karşısına Işık Tan çıktı. Emri ben yazdım, dedi; yanlıştı, geri alıyorum.", "Dolgu yerine yeni bir satır koydu: sis oranı, açıkça. İlk raporda yüzde otuz bir yazdı; bütçe kesilmedi, çünkü artık saklanacak şey yoktu.", "Mira’yla hâlâ kavga ediyorlar; ama aynı rapora iki imza atıyorlar. Hatice Nine’ye her bahar bir çuval fasulye tohumu gönderiyor."], "sessizlik": ["Boş mağarayı Işık Tan buldu. Raporuna tek satır yazdı: Motor yok, sis yok, ölçülecek bir şey kalmadı.", "Komisyon bir cümle daha istedi. Yazmadı. Danışmanlık görevinden kendi isteğiyle ayrıldı.", "Bazen Konya Ovası’na gidiyor. Arel’le konuşmuyorlar; damla sulama hattında yan yana çalışıyorlar. Hatice Nine ikisine de aynı soruyu soruyor."], "saray": ["Işık Tan yedinci geçidi hiç görmedi. Arel’in defterinde adını buldu: tahtanın sol yarısı, silinmemiş.", "Raporuna bir satır ekledi: bazı bölgeler ölçülmez, yalnız hatırlanır. Komisyon satırı anlamadı; o silmedi."]}, "honestEnding": "Işık Tan Çekirdek önünde bilmiyoruz demişti. Son raporunda bu kelime aynen durdu. Komisyon raporu kabul etmedi; o kelimeyi geri almadı.", "fillEnding": "Işık Tan sisi doldurmuştu; rapor tam, bütçe yerinde kaldı. Dipnottaki hata payını kimse okumadı. Yıllar sonra o dipnotu bir öğrenci buldu ve sordu.", "note": "Işık geldi. Doktorada tahtayı paylaştığım kişi, şimdi emri yazan kişi. Düşman değil; daha zor: haklı olduğu yerler var. Lale ona bir soru sormuş, cevabını hiç almamış. Belki şimdi alırız.", "ach": {"id": "isik_honest", "name": "Silinmeyen Kelime", "desc": "Işık Tan Çekirdek önünde sis için bilmiyoruz desin.", "flavor": "Motor: Bir insan sisi sis diye kaydetti. Ölçümüm değişmedi; raporu değişti."}}, "helm": {"title": "Helmholtz’un Kronometresi", "intro": "Helmholtz bin sekiz yüz ellide kurbağa siniriyle ölçtü: sinyal sonlu hızla gider. Düşünce anlık değil; bedende yol alır. Şimdi sen: ışık yanınca bas. Erken basma; erken olanı da sayarım.", "light": "Görsel blok başlıyor. Ekran yanınca bas. Beş deneme; ilkini saymam, ısınma.", "sound": "İşitsel blok. Ekran değil, ses. Tık duyunca bas. Gözünü kapatabilirsin; kulağını kapatma.", "choice": "Seçimli blok. Sol ışık yanarsa A, sağ ışık yanarsa D. Artık yalnız görmüyorsun, karar veriyorsun. Kararın bir bedeli var; onu ölçeceğim.", "early": "Erken. Işık yanmadan bastın; tahmin ettin, görmedin. Sayılmadı.", "result": "Medyanların ekranda. Ses görselden hızlı çıktı; kulak yolu kısa, retina yavaş. Dağılımın tek sayı değil, bir bulut. Mutlak değil, karşılaştırma ölçtün.", "donders": "Seçimli eksi basit eşittir karar süresi. Donders bin sekiz yüz altmış sekizde böyle çıkardı: zihin aşamaları toplanır, çıkarılır. Senin kararın ekranda.", "why": {"q": "Gözden parmağa bir buçuk metre. Sinir yüz metre bölü saniye; on beş milisaniye eder. Neden iki yüz milisaniye bekledin?", "opts": ["İletim değil, işleme zaman alıyor; sinapslar ve karar.", "Sinir ışıktan yavaş, mesafe uzun.", "Parmak kası ağır, geç kalkıyor."], "ok": "Doğru. Yol kısa, duraklar çok: retina, talamus, korteks, karar, komut. Zaman sinirde değil, aralarda geçiyor.", "no": "Hayır. Yol on beş milisaniye tutar; kalan yüz seksen beş aralarda geçiyor. Retina, korteks, karar. İletim değil, işleme."}, "win": "Lale hastalara tepki süresi testi yapardı. Rakamlar uzadıkça üzülmezdi; düşünce anlık değil derdi, yol alıyor. Teselli bu: geç gelen cevap da cevap.", "facts": [{"t": "Helmholtz bin sekiz yüz elli", "d": "Kurbağa siyatik sinirinde uyarı hızını ölçtü: saniyede yaklaşık yirmi yedi metre. O güne dek sinir sinyali anlık sanılıyordu.", "src": "Helmholtz, Berlin Akademisi bildirisi, bin sekiz yüz elli"}, {"t": "Donders çıkarması", "d": "Basit, seçimli ve ayırt etmeli tepki sürelerini ölçüp birbirinden çıkardı; zihinsel aşamaların süresini ilk kez sayıya döktü.", "src": "Donders, Zihinsel süreçlerin hızı üzerine, bin sekiz yüz altmış sekiz"}], "reward": "Defter: tepki medyanların ve karar süren kaydedildi. Bilinç boyutunda sis biraz çekildi.", "ach": {"id": "reaction", "name": "Sonlu Hız", "desc": "Helmholtz’un Kronometresi’ni üç blokta tamamla.", "flavor": "Motor: Düşüncen ölçüldü; anlık değil. Bu bir kusur değil, bir yol."}}, "card2": {"title": "Arel’in Dosyası", "intro": "Arel’in dosyası. Ölçtüklerim burada; yorum tek cümle. Övgü yok, yargı yok; sayı ve bir cümle.", "labels": {"time": "Süre", "order": "Boyut sırası", "quiz": "Sınav doğruluğu", "caught": "Yakalanma", "fuel": "Fener kullanımı", "figure": "En çok konuşulan", "logs": "Kayıtlar", "path": "Yol dağılımı", "global": "Küresel ortalama"}, "verdict": {"fast": "Süre kısa, sınav zayıf. Acele ettin; sis geçtiğin yerde değil, geçmediğin yerde kaldı.", "careful": "Sınav tam, süre uzun. Her noktada durdun; sis çekildi ama saat de ilerledi. İkisi de ölçüm.", "survivor": "Hiç yakalanmadın. Bozulma’yı gördün, dokunmadın. Kaçınmak da bir yol; neden kaçındığını ölçemedim.", "caughtMany": "Çok yakalandın. Bozul ;GAME.story15={"stones": {"name": "Yankı Taşı", "intro": "Bu taş iki parçalı bir yankı tutar: bir özne, bir yüklem. Sen bırakırsın, sisten geçen başkası okur; serbest söz yok, yalnız iz var.", "empty": "Burada başka yankı yok. Ya kimse gelmedi ya da gelen bir şey bırakmadı; ikisini ayırt edemiyorum.", "offline": "Çevrimdışısın; bu sürümde yalnız kendi bıraktığın taşları görüyorum, başkalarınınki sisin öbür yanında kaldı.", "subjects": [{"id": "sis", "t": "Sis"}, {"id": "bozulma", "t": "Bozulma"}, {"id": "lale", "t": "Lale’nin sesi"}, {"id": "motor", "t": "Motor"}, {"id": "veri", "t": "Bu veri"}, {"id": "yol", "t": "Bu yol"}, {"id": "ben", "t": "Ben"}], "verbs": [{"id": "bekliyor", "t": "burada bekliyor", "ben": "burada bekliyorum"}, {"id": "yalan", "t": "yalan söylemiyor", "ben": "yalan söylemiyorum"}, {"id": "sasirtti", "t": "beni şaşırttı", "ben": "kendimi şaşırttım"}, {"id": "tehlike", "t": "ileride tehlikeli", "ben": "ileride düştüm"}, {"id": "aglatti", "t": "beni ağlattı", "ben": "burada ağladım"}, {"id": "yanki", "t": "hâlâ yankılanıyor", "ben": "hâlâ yankılanıyorum"}, {"id": "agir", "t": "burada ağırlaşıyor", "ben": "burada ağırlaştım"}, {"id": "sessiz", "t": "sessiz kaldı", "ben": "sessiz kaldım"}, {"id": "dondu", "t": "geri döndü", "ben": "geri döndüm"}, {"id": "hak", "t": "hatırlanmayı hak ediyor", "ben": "hatırlanmak istiyorum"}], "placed": "Taş yerinde. Koordinatı, iki sözcüğü ve saatini kaydettim; kimin okuyacağını bilmiyorum.", "echoed": "Yankıladın. Sayaç bir arttı. Bırakanı tanımıyorum, ama artık yalnız değil.", "limit": "Bugünlük üç taş bıraktın. Sınır benim değil, sisin; çok iz, hiç iz kadar az okunur. Yarın yine.", "arel": "İlk taşı bıraktım. Lale de kayıtlarını kimin dinleyeceğini bilmeden bırakmıştı; şimdi ne hissettiğini biraz anlıyorum.", "ach": {"id": "stone_first", "name": "Sisteki İz", "desc": "İlk yankı taşını bıraktın.", "flavor": "Motor: Başka biri burada duracak. Ne zaman, bilmiyorum; sis."}}, "canteen": {"name": "Yemekhane Gecesi", "hint": "Yemekhanede dört nabız yükseliyor. Kavga değil, yorgunluk. Girersen yalnız dinle; ölçüm araya girmez.", "enter": "Kapı aralık. Çaydanlığın sesi dört kişinin sesinden yüksek. Araya girmeyeceğim; yalnızca bir sandalye seçeceğim.", "common": [{"who": "hatice", "t": "Çay demlendi. Kimse kalkmasın, ben dökerim. Dizim ağrıyor ama elim tutuyor."}, {"who": "riza", "t": "Otur Nine. Bu gece herkes biraz ağır. Deniz kokmayan yerde uyku da tutmuyor."}, {"who": "zeynep", "t": "Ben uyumayı bıraktım. Nöbet bitti diye beden bilmiyor; on iki saat sonra yine kalkıyor."}, {"who": "deniz", "t": "Motor bugün bana sordu: yarın ne yapacağını biliyor musun? Biliyorum dedim. Ben de biliyorum dedi. Güldüm, sonra gülemedim."}, {"who": "riza", "t": "Bilsin evlat. Kırk yıl ağ attım, denizin beni bildiğini bir gün bile sanmadım."}, {"who": "deniz", "t": "Bilmesine gerek yok Rıza amca. Yasalar zaten biliyor. Ağı atacağın gün de yazılıydı, iz bırakmayacağın da."}, {"who": "riza", "t": "Yazılıysa yazılı. Ama yazı silinince kim okuyacak? Ben gidince tekne satılır, adını boyarlar."}, {"who": "hatice", "t": "Toprak siler Rıza, ama yutmaz. Gölgesini görmeyeceğim bir ceviz diktim. Sabır dediğin budur."}, {"who": "zeynep", "t": "Sabır mı Nine? Dün gece dört kişinin elini tuttum. Biri sabretti, biri etmedi; ikisi de aynı saatte gitti."}, {"who": "hatice", "t": "Gidiş hep aynı olur kızım. Ekiş başka."}, {"who": "zeynep", "t": "Yatağın yanında ekecek bir şey yok. Monitör düzleşiyor, ben kâğıdı imzalıyorum. Orada olmamın hiçbir anlamı yok."}, {"who": "riza", "t": "Sen yoğun bakımda ölüm görüyorsun, ben kırk yıl denizde ölüm gördüm; farkı ne?"}, {"who": "zeynep", "t": "Farkı şu Rıza amca: senin ölülerini deniz aldı. Benimkileri ben bıraktım. Saatini de ben yazdım."}, {"who": "riza", "t": "Ben de bir arkadaşımın ipini kestim. Fırtınada tekne batmasın diye. Bunu kimseye anlatmadım; sen anlattırdın, kızım."}, {"who": "deniz", "t": "İkiniz de suçlu değilsiniz ki. O an zaten gelecekti. Kim keserse kessin, kim yazarsa yazsın."}, {"who": "zeynep", "t": "Deniz, sen on yedi yaşındasın. Belirlenmişlik ders kitabında rahat durur. Bir annenin yüzünde durmaz."}, {"who": "deniz", "t": "Annemin yüzünü bana anlatma Zeynep abla. Lale Hoca onun doktoruydu. Belirlenmiş olsun istiyorum; yoksa biri hata yaptı demek."}, {"who": "hatice", "t": "Hata yapan da toprağa girer evladım, yapmayan da. Kimseyi suçlamayın; tarla kimseyi suçlamaz."}, {"who": "zeynep", "t": "Tarla suçlamaz Nine, çünkü tarla orada değildi. Sen bir ömür yağmur bekledin. Ben bir gece bile beklemedim; hep yetiştim, hep geç kaldım."}, {"who": "hatice", "t": "Benim beklediğim yalnız yağmur mu sanıyorsun kızım? Seksen iki yılda kimleri bekledim, saymadım. Saysam tarlaya çıkamazdım."}, {"who": "riza", "t": "Hepimiz kendi ölümüzü masaya koyduk. Masa küçük Nine; sığmıyor."}, {"who": "deniz", "t": "Belki hiç konuşmamalıydık. Bunu da önceden bilseydik keşke."}, {"who": "zeynep", "t": "Bilseydin de konuşurdun Deniz. Sormadan duramazsın; Lale Hoca da öyleymiş. Bu bir övgü değil, bu gece değil."}, {"who": "hatice", "t": "Çay soğudu. Kimse içmedi. Böyle geceleri toprak da hatırlar."}], "q": "Masada dört sandalye dolu, dört boş. Kimin yanına oturacaksın?", "opts": [{"k": "riza", "t": "Rıza’nın yanına, kapıya yakın"}, {"k": "deniz", "t": "Deniz’in yanına, açık defterinin önüne"}, {"k": "zeynep", "t": "Zeynep’in yanına, soğumuş çayın başına"}, {"k": "hatice", "t": "Hatice Nine’nin yanına, çaydanlığın yanına"}], "pov": {"riza": [{"who": "riza", "t": "Otur evlat. Buradan kapı görünür; balıkçı hep çıkışa yakın oturur, deniz ne zaman döneceğini söylemez.", "muffled": false}, {"who": "zeynep", "t": "Ben de herkesin eli soğurken kapıya bakarım.", "muffled": true}, {"who": "riza", "t": "Adı Yaşar’dı. İpi kestiğimde bir şey bağırdı, rüzgâr aldı. Ben söylemezsem adından da iz kalmayacak.", "muffled": false}, {"who": "deniz", "t": "Söylemek de yazılıydı demek ki.", "muffled": true}, {"who": "riza", "t": "Çocuk haklı olabilir evlat. Ama haklıysa kırk yıl neyi taşıdım? Olacak olanın yükü olmaz; bende var.", "muffled": false}, {"who": "hatice", "t": "Taşıdığın onun yeri Rıza. Bırakma.", "muffled": true}, {"who": "riza", "t": "Nine’nin sesi buraya dalga gibi geliyor, yarısını duyuyorum. Bu gece yarısı da yetiyor.", "muffled": false}, {"who": "zeynep", "t": "Ben hastalarımın adını sormam. Sormamak kolaydı.", "muffled": true}], "deniz": [{"who": "deniz", "t": "Abi otur. Zeynep abla haklı mı? Belirlenmişlik bir annenin yüzünde durmuyor mu?", "muffled": false}, {"who": "zeynep", "t": "Öyle demek istemedim. Yorgunum, kelimeler keskin çıkıyor.", "muffled": true}, {"who": "deniz", "t": "Laplace’ın cini her şeyi bilirmiş. O cin olmak istemiyorum aslında; yalnızca suçun kimsede olmamasını istiyorum.", "muffled": false}, {"who": "riza", "t": "Suç değil o evlat, yük. Yük bölüşülür.", "muffled": true}, {"who": "deniz", "t": "Motor kuantumda bazı şeylerin gerçekten rastgele olduğunu söylüyor. Bunu sevmiyorum. Rastgeleyse annem yalnızca şanssızdı.", "muffled": false}, {"who": "hatice", "t": "Şans da toprağın bir adı kuzum.", "muffled": true}, {"who": "deniz", "t": "Defterime yazdım: Nine dört bardak doldurdu, kimse içmedi. Bunu hiçbir denklem önceden yazmadı; ben öyle saydım.", "muffled": false}, {"who": "deniz", "t": "Zeynep abla bir şey dedi, duyamadım. Sormayacağım. Cevabı belliyse sormanın anlamı yok; belli değilse de korkuyorum.", "muffled": false}], "zeynep": [{"who": "zeynep", "t": "Otur Arel. Bir kez sana da sordum, oradaydın mı diye. Bu gece kendime soruyorum: ben orada mıydım, yoksa yalnız ellerim mi?", "muffled": false}, {"who": "riza", "t": "İp, fırtına, kimseye anlatmadım.", "muffled": true}, {"who": "zeynep", "t": "Rıza amcaya haksızlık ettim. Onun ölüsünü deniz aldı dedim; meğer o da bırakmış. Bırakanlar birbirini tanımaz.", "muffled": false}, {"who": "deniz", "t": "Annemi karıştırma dedim.", "muffled": true}, {"who": "zeynep", "t": "Deniz’e söylediğim doğruydu, saati yanlıştı. Doğru cümleyi yanlış saatte verirsen ilaç değil iğne olur.", "muffled": false}, {"who": "hatice", "t": "Bir şey ye kızım. Boş mideye acı keskin gelir.", "muffled": true}, {"who": "zeynep", "t": "Nabzını alayım mı? Alışkanlık. Seksen dört. Senin için mi saydım, kendim için mi, bilmiyorum.", "muffled": false}, {"who": "riza", "t": "Gece uzun evlat. Sabah yine olur.", "muffled": true}], "hatice": [{"who": "hatice", "t": "Gel evladım, şu tabureye. Dizim tutmuyor; sen tut çaydanlığı, ben göstereyim.", "muffled": false}, {"who": "zeynep", "t": "Yağmur beklemek kolay Nine, ölüm beklemek değil.", "muffled": true}, {"who": "hatice", "t": "Kolay mı? Çatlağa elini sokarsın, sıcak gelir. Toprak ölmez ama susar. Susanı beklemek kolay değil kızım.", "muffled": false}, {"who": "deniz", "t": "Kuraklığın da bir nedeni var ama Nine.", "muffled": true}, {"who": "hatice", "t": "Var, bilirim; Lale kızım anlattı. Nedenini bilmek yağmuru getirmiyor. Çocuğa kızmıyorum; o da kendi tarlasını sulamaya uğraşıyor.", "muffled": false}, {"who": "riza", "t": "Sen hiç kimseyi kaybetmedin mi Nine?", "muffled": true}, {"who": "hatice", "t": "Kaybettim. Saymıyorum. Rıza sayıyor, Zeynep sayıyor; birimiz saymasın evladım, yoksa masayı kim toplar?", "muffled": false}, {"who": "zeynep", "t": "Saymazsak unuturuz.", "muffled": true}]}, "end": "Masada dört bardak, hiçbiri boşalmadı. Nabız ortalaması doksanın üstünde, konuşma kırk bir dakika sürdü. Uzlaşma ölçemedim; sıfır mı, sis mi, bilmiyorum.", "after": {"riza": ["Dün gece Yaşar’ın adını söyledim evlat. Deniz yine beni hatırlamaz, ama o masada dört kişi hatırlıyor. Dört az mı?", "Zeynep kızla sabah selamlaştık, konuşmadık. Ağ da önce düğümden tutar."], "deniz": ["Dün gece bir şeyi hesaplayamadım: Zeynep abla o cümleyi neden kurdu. Belirlenmişse bile bana açıklanmadı.", "Defterime yeni bir soru yazdım: suç yoksa sorumluluk da mı yok? Lale Hoca bunu sorardı galiba."], "zeynep": ["Rıza amcanın arkadaşının adını öğrendim. Hastalarımın adını sormaya başlayacağım; geç kalmış bir alışkanlık.", "Deniz’e bir özür borçluyum. Henüz ödemedim. Borcu taşımak da bir şey Arel; unutmaktan iyidir."], "hatice": ["Dün gece çay soğudu, yine döktüm. Bu sabah dört bardak yıkadım; dördü de doluydu, dördü de boştu.", "Saymıyorum demiştim ya evladım. Bu sabah saydım. Toprak ağır geldi, yine de kaldırdım."]}, "note": "Yemekhanede dört kayıp masaya kondu, hiçbiri öbürüne sığmadı. Kimse haklı çıkmadı; belki herkes biraz daha az yalnız kalktı, ölçemedim.", "ach": {"id": "canteen", "name": "Boş Sandalye", "desc": "Yemekhane Gecesi’nde bir tanığın yanına oturdun ve sahneyi sonuna kadar dinledin.", "flavor": "Motor: Araya girmedin. Bunu da bir ölçüm sayıyorum."}}, "foucault": {"title": "Foucault Sarkacı", "intro": "Bakanlık tesisin yerini bize hiç yazmadı; harita yok, koordinat gizli. Çekirdek kuyusuna yirmi metrelik bir sarkaç astım. Nerede olduğumuzu o söyleyecek.", "start": {"q": "Sarkacı nasıl başlatalım?", "opts": ["ipi yakarak bırak", "elle it"], "bad": "Elle ittin; küre yana bir hız aldı, şimdi elips çiziyor. Elipsin ekseni kendi kendine dönüyor; bu dönüş Dünya’dan değil, senin elinden. Bu ölçüm yalan söyler.", "good": "İp yandı, küre hiçbir itme almadan bırakıldı. Tek bir düzlemde salınıyor; artık o düzlemi döndüren tek şey altımızdaki Dünya."}, "mark": "Her oyun saatinde salınım düzleminin zemindeki halkada gösterdiği dereceyi işaretle; salınım saati gerçek akıyor, dönüş saati hızlandırılmış.", "rate": "İşaretleri sırala; ilkiyle sonuncusu arasındaki açı farkını geçen saate böl. Burada saatte dokuz virgül dört derece çıkıyor; bir derece için altı dakikadan biraz fazla.", "latQ": "Dönüş hızı, saatte on beş derece çarpı enlemin sinüsü. Biz saatte dokuz virgül dört derece ölçtük. Tesis hangi enlemde?", "latOk": "Yaklaşık otuz sekiz virgül altı derece kuzey. Kapadokya. Hata payı yarım derece kadar. Bakanlık söylemedi; sarkaç söyledi.", "latNo": "Tutmadı. Dokuz virgül dördü on beşe böl; çıkan sayı enlemin sinüsü. Sinüsü o olan açıyı bul, ben bekliyorum.", "mach": "Sarkaç Dünya’nın döndüğünü gösteriyor, ama neye göre döndüğünü, mutlak uzaya mı uzak yıldızlara mı, Mach’tan beri kimse kesin söyleyemedi; bunu Anlam’da sis olarak tutuyorum.", "win": "Bir ip, bir küre, birkaç saatlik sabır. Bakanlık koordinatı saklayabilir; Dünya’nın dönüşünü saklayamaz.", "facts": [{"t": "Foucault, Panthéon, bin sekiz yüz elli bir", "d": "Léon Foucault altmış yedi metrelik bir tele yirmi sekiz kiloluk bir küre astı. Düzlemin saatler içinde döndüğünü herkes gördü; Dünya’nın dönüşü göğe bakmadan gösterildi.", "src": "Foucault, Comptes Rendus, cilt otuz iki, bin sekiz yüz elli bir; Vikipedi, Foucault sarkacı"}, {"t": "Charron halkası", "d": "Charron bin dokuz yüz otuz birde asılma noktasının altına bir halka koydu. Tel her salınım ucunda halkaya sürtünür, elips söner; kısa sarkaç da güvenilir ölçer.", "src": "Charron, Fransız Astronomi Derneği Bülteni, bin dokuz yüz otuz bir; Vikipedi, Foucault sarkacı"}], "reward": "Ödül: Sis Feneri deposu bir saniye uzadı. Yerini bilen birinin ışığı biraz daha uzun yanar.", "ach": {"id": "foucault", "name": "Sarkacın Söylediği", "desc": "Foucault sarkacıyla tesisin enlemini ölçtün.", "flavor": "Motor: Otuz sekiz virgül altı. Bunu bana kimse söylemedi; ölçtük."}}};GAME.stonePos={baslangic:[7,21],kuantum:[7,21],gezegen:[7,21],bilinc:[7,21],anlam:[7,21],yuva:[7,21]};GAME.hub.pendulum={pos:[-16,-13]};GAME.canteenSeats=[[18,10],[22,10],[18,14],[22,14]];(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "stone_first", "name": "Sisteki İz", "desc": "İlk yankı taşını bıraktın.", "flavor": "Motor: Başka biri burada duracak. Ne zaman, bilmiyorum; sis."}, {"id": "canteen", "name": "Boş Sandalye", "desc": "Yemekhane Gecesi’nde bir tanığın yanına oturdun ve sahneyi sonuna kadar dinledin.", "flavor": "Motor: Araya girmedin. Bunu da bir ölçüm sayıyorum."}, {"id": "foucault", "name": "Sarkacın Söylediği", "desc": "Foucault sarkacıyla tesisin enlemini ölçtün.", "flavor": "Motor: Otuz sekiz virgül altı. Bunu bana kimse ;GAME.story16={"local": {"archive": "Bu sürümde canlı gözlemci verisi yok; sisin öbür yanına bağlantım kapalı. Gördüklerin mürettebatın, bu bilgisayarın ve senin girdiğin kodların kaydı; başka bir şey değil.", "statsLabel": "Tesis arşivi", "statsNote": "Bu oranlar dünyadan değil, sekiz kişilik bir masadan ve bu bilgisayardan; küçük örnek, büyük sis.", "boardLabel": "Vardiya panosu", "boardNote": "Mürettebat koşuları benim kaydımdan, onlar bildirdi ben yazdım. Seninki ölçüldü; aradaki farkı ben de biliyorum.", "traceJoin": "Koridorda soluk bir iz belirdi. Adım ritmi tanıdık; senin.", "traceLine": "{n} eski iz tesiste dolaşıyor", "traceMotor": "Bu izler başka insanlar değil; bu bilgisayarda daha önce yürüdüğün yolun kaydı. Dünkü sen, bugünkü seni geçemez ama yanından yürür.", "liveJoin": "Aynı bilgisayarda ikinci bir pencere açıldı. Orada da sen varsın; iki ölçüm, tek gözlemci."}, "crewStones": {"mira": [{"realm": "kuantum", "s": "veri", "v": "yalan"}, {"realm": "kuantum", "s": "sis", "v": "bekliyor"}, {"realm": "baslangic", "s": "motor", "v": "yanki"}], "kaan": [{"realm": "gezegen", "s": "yol", "v": "tehlike"}, {"realm": "gezegen", "s": "ben", "v": "dondu"}, {"realm": "baslangic", "s": "bozulma", "v": "tehlike"}], "sema": [{"realm": "bilinc", "s": "lale", "v": "yanki"}, {"realm": "bilinc", "s": "veri", "v": "agir"}], "riza": [{"realm": "yuva", "s": "ben", "v": "sessiz"}, {"realm": "anlam", "s": "yol", "v": "hak"}], "deniz": [{"realm": "kuantum", "s": "ben", "v": "sasirtti"}, {"realm": "anlam", "s": "veri", "v": "sasirtti"}], "zeynep": [{"realm": "bilinc", "s": "ben", "v": "aglatti"}, {"realm": "anlam", "s": "lale", "v": "hak"}], "hatice": [{"realm": "yuva", "s": "ben", "v": "bekliyor"}, {"realm": "yuva", "s": "yol", "v": "hak"}], "isik": [{"realm": "baslangic", "s": "veri", "v": "yalan"}, {"realm": "gezegen", "s": "sis", "v": "bekliyor"}, {"realm": "anlam", "s": "motor", "v": "sasirtti"}]}, "crewEndings": {"mira": {"ending": "gozlemci", "why": "Motor bilmediğini söyl   const lx=this.dz(g.axes[0]||0),ly=this.dz(g.axes[1]||0),rx=this.dz(g.axes[2]||0),ry=this.dz(g.axes[3]||0);
