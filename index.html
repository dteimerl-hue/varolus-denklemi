;GAME.story5={"vardiya": {"mira": {"frag2": ["İki parça. Spektrumlarını üst üste koydum; aynı ses, aynı kesik. Rapora yazdım, imzayı henüz atmadım.", "Sis haritasında iki nokta maviye döndü. Küçük ama ölçülebilir; ben ölçülebilen şeylere güvenirim."], "frag4": ["Dört parça. Motor’un bütünlüğü yüzde üç arttı; Lale’nin sesi çoğaldıkça Motor daha az unutuyor, tuhaf.", "Sana bir şey söyleyeyim Arel: kesikleri ben de dinledim. Mühendis olarak değil. Yazmadım, ama dinledim."], "storm": ["Fırtınada haritan silindi, sen silinmedin. Pusulasız yürüdün; ben pusulasız yürüyemem, biliyorsun.", "Sese güven dedim, kendim güvenmezdim. Sen güvendin. Raporda bunun karşılığı yok; benim defterimde var."], "ng": ["İkinci tur. Geçitler aynı, sayılar başka yere düşüyor. Motor unutuyor; ben seni hatırlıyorum.", "Bu kez sis haritasını sen çiz, ben bakacağım. Kırmızı nereye kayıyorsa sen oradasın demektir."]}, "kaan": {"frag2": ["İki parça. Yörüngede buna iki alarm derdik; sen topluyorsun, ben sayıyorum. Su iç.", "Bakanlık bugün iki kez aradı, iki kez meşgul çaldı. Fişi ben çekmiş olabilirim."], "frag4": ["Dört parça, nabzın yüz on. İlk seferinde yüz otuzdu; alışıyorsun. Alışma, dikkatli ol.", "Jeneratöre bir bidon daha koydum. Sayı değişmedi ama uykum düzeldi; sen de uyu biraz."], "storm": ["Fırtınada otuz saniye saydım; otuz birde geldin. Yörüngede buna tam zamanında derdik.", "Sis kapanırken koşmayı bırakmadın. Mideni sordum, sen sormadın. Astronot olurdun; fena değil."], "ng": ["Yine mi geldin? İyi. İkinci turda Bozulmalar kapıda bekliyor; ben de bekliyorum, farkımız az.", "Bu kez sayıyı sana söylemeyeceğim. Saymak benim işim, dönmek senin. Nefes al, gir."]}, "sema": {"frag2": ["İki parça. O kesikleri Lale bana da dinletmişti; onun sesi titremiyordu, seninki titriyor.", "Elini ver. İyi, bu kez geçitten titriyor. Kayıttan titreyen eli artık ayırt edebiliyorum."], "frag4": ["Dört parça. Lale yarım kalmak istememişti; sen yarım bırakmıyorsun. Doktor olarak değil, Sema olarak söylüyorum.", "Bir itiraf: son hafta onu izlerken ben de kayıt tuttum. Nabız, uyku, günde kaç kelime. Hâlâ duruyor."], "storm": ["Fırtınadan çıktın; nabzın yüksek ama düzenli. Yüksek olmayan bir nabız o sisin içine zaten girmezdi.", "Lale’ye doğru yürüdün. Ben son hafta kapıda durdum, sen sise girdin. Haklıydın; bunu söylemem gerekiyordu."], "ng": ["Yine buradasın. Lale ikinci kez bakmayı severdi; aynı filme, aynı hastaya, başka bir gözle.", "Bu kez nabzını ben ölçmeyeceğim. Sen ölç; bana sayıyı değil, ne hissettiğini söyle."]}, "riza": {"frag2": ["İki parça demek. Ağ iki balıkla döndü; az ama ağın tutmadığını kimse söyleyemez evlat.", "Ablanın sesini bir daha duydum. Sakin. Deniz de fırtınadan önce böyle konuşur."], "frag4": ["Dört parça. Kırk yılda öğrendiğim şu: dördü getiren altıyı da getirir. Sabır balıktan önce gelir.", "Torunuma seni anlattım evlat. Bilmeyen profesör dedim; güldü. Sonra sustu; demek anladı."], "storm": ["Sisin içinde sese gitmişsin. Biz pus basınca kıyıdaki köpeği dinleriz. Sen de köpeğini bulmuşsun.", "Fırtınadan dönen tekneyi kıyıda bekleyen biri olmalı evlat. Ben bekledim. Kahve demledim, soğudu, olsun."], "ng": ["Yine mi açıldın evlat? Biz de aynı suya her sabah çıkarız. Deniz aynı değil, biz de değiliz.", "Bu kez ağı sen ör. Ben ilmeği gösterdim, gerisi senin elinde. Ablan da böyle derdi herhalde."]}, "deniz": {"frag2": ["İki parça buldun! Not aldım: Motor mu saklamış, Lale Hoca mı? Bu soru sınavdakilerden iyi.", "Arel abi, iki parçayı ben de dinledim. Annemin doktoru tam böyle konuşurdu. Sanki yanımda."], "frag4": ["Dört parça. Sınav gibi hesapladım: altıda dört, yüzde altmış yedi. Ama bu puan değil, ses.", "Bir şey diyeyim mi? Lale Hoca bana sorusunu sorarken aslında kendine soruyormuş. Şimdi anladım."], "storm": ["Fırtınada sesi takip etmişsin. Ses ışıktan yavaş ama sisi geçer. Bunu sınavda sormazlar, yazık.", "Ben olsam koşardım, sonra kaybolurdum. Sen yürümüşsün. Arel abi, bunu da not aldım."], "ng": ["İkinci tur! Çoklu Dünyalar’da başka bir Deniz ilk turda kalmış olmalı. Buradaki daha şanslı.", "Bu kez ben de soru taşıyacağım. Lale Hoca hep sor derdi; sormayı senden öğrendim."]}, "zeynep": {"frag2": ["İki parça. Söylenmemiş şeyler kalır demiştim; kalmış işte. Elinde iki tane var.", "Yorgunsun ama başka bir yorgunluk. Nöbette böyle yorulanı tanırım; taşıyan yorulur."], "frag4": ["Dört parça. Hastalar da son günlerde dörder beşer söyler; hepsini bir kerede söyleyen olmaz.", "Lale’ye yazdığım mektubun cevabı bu parçalarmış galiba. Sesini tanımıyorum ama sorusunu tanıyorum."], "storm": ["Sisin içinde sese yürümüşsün. Yoğun bakımda ışık hep açık; biz de sese bakarız, monitörün sesine.", "Fırtınadan çıkan birini ilk kez dışarıdan izledim. Nabzın yüksek; iyi, yüksek olan vuruyor demektir."], "ng": ["Yine geldin. Nöbet de öyle; aynı koridor, aynı yataklar, her gece başka bir şey öğrenirsin.", "Bu kez sana bir şey sormayacağım. Sen sor, ben dinleyeyim. Hemşirelikte asıl iş budur."]}, "hatice": {"frag2": ["İki tane mi çıkardın evladım? Toprak ilk sene hep ikişer verir. Üçüncüsü için sulamak lazım.", "Ablanın sesi deftere yazdığı gibi. Otur, bir daha dinleyelim; yaşlı kulak iki kere ister."], "frag4": ["Dört parça. Ceviz dikince ilk yaprak için dört yıl bekledim. Sen dört parçada yorulma.", "Torunum Yusuf sordu: Arel abi ne topluyor? Ses topluyor dedim. Bizim köyde buna ekin derler, aynı şey."], "storm": ["Sise girmiş, sese gitmişsin. Ovada kar basınca biz de çan sesine yürürüz. Köpek değil, çan; aynı akıl.", "Fırtınadan dönene sıcak bir şey verilir. Ekmek buradaydı, soğudu. Yine de al; yıldız tozu soğumaz."], "ng": ["Yine mi evladım? Toprağı ikinci sürüş daha kolaydır; taşlar ilk seferde çıkmıştır. Sende de öyle.", "Bu kez tohumu sen seç. Ben toprak oldum artık, sen el ol. Ablan izlerdi; sen ekeceksin."]}}, "sinyal": {"title": "Kayıp Sinyal", "start": "Telsizde bir şey var Arel. Bakanlık değil; üç geçidin frekansından gelen zayıf bir ses. Yörüngede buna yankı derdik; biri bizi arıyor demektir.", "hint": {"baslangic": "Sinyal iki virgül yedi kelvin kadar zayıf. Kozmik arka plan ışımasının yanında arayacağım; İlk Işık’ın orada.", "kuantum": "Sinyal duvardan sızıyor; klasik fizikte sızamazdı. Tünelleme Duvarı’nın öbür yüzünde, sızıntının olduğu yerde.", "gezegen": "Altı milyar kilometreden gelen bir fısıltı gibi. Voyager’ın geri baktığı yerde, Soluk Mavi Nokta’nın yanında."}, "found": {"baslangic": "İşaretledim. Sinyal ilk ışıkla aynı yaşta değil ama onun kadar soğuk; bir yön daha gerek.", "kuantum": "İkinci yankı duvarın içinden geçti. İki yön kesişiyor; üçüncüsü olmadan nokta değil, çizgi.", "gezegen": "Üçüncü yankı tozun altından geldi. Üç çizgi bir noktada buluşuyor; sinyal tesisin içinden."}, "complete": "Üçgenleme tamam. Sinyal dışarıdan değil, Lale’nin eski kabininden geliyor; telsizi hiç kapatmamış.", "record8": {"title": "Kayıt Sekiz", "lines": ["Kayıt sekiz. Bunu sıraya koymadım, numarasını sonradan verdim. Fark ettiğim gün: bir hastaya filmini anlatırken hipokampus kelimesi gelmedi. Yerine hatırlayan yer dedim.", "Hasta gülümsedi, hemşire not aldı, ben koridora çıktım. Kaç dakika durduğumu bilmiyorum; serviste zaman öyle akar. Sana yazmak istedim, yazmadım.", "Çünkü o gün anladım Arel: dayanağım fizik değil. Denklemler seni tutar, beni değil. Beni tutan şey hatırlamak; annemin mutfağı, senin ilk teleskobun, Haliç’in kokusu.", "Korkmadım o gün, bu garip. Bir odaya girip ışığın yanmadığını fark etmek gibi; ışık gitmemiş, düğme başka yerde. Düğmeyi aramaya başladım.", "Bunu şimdi söylüyorum çünkü sonra söyleyemeyebilirim. Sen hesapla, ben hatırlayayım; ikimizin dayanağı bu. Ve Arel, kelime geldi: hipokampus. Yazdım."], "arel": "Hatırlayan yer. Lale kelimeyi kaybettiği gün beni dayanak yapmış; ben iki yıldır denklemde arıyordum. Deftere yazıyorum: hatırla."}}, "yanki": {"title": "Yankı Dizisi", "intro": "Dört ton çalacağım; bir iki üç dört tuşlarıyla tekrar et. Her turda dizi bir uzar, üçten altıya. İşitsel çalışma belleği yaklaşık dört öğe tutar; fazlası beklentiyle taşınır, müzik gibi.", "roundOk": ["Dizi tutuldu. Bir ton daha ekliyorum.", "Doğru sıra. Bellek dört, dizi beş; beklenti çalışıyor.", "Tekrar tamam. Dizi uzuyor, sis uzamıyor."], "win": "Altı ton. Dördünü bellekle, ikisini beklentiyle tuttum: bir sonraki notayı bilmek, duymaktan önce gelir. Anlam da böyle kuruluyor; hatırlamak, yarım kalan diziyi tamamlamak.", "fail": ["Yanlış ton: dizi başka yere gitti. Beklenti kırıldı; baştan.", "Çok geç: ton söndü. Bellek dört saniye bekledi, sonra bıraktı.", "Dizi dağıldı: altı ton, dört yer. Fazlası düştü; baştan al."], "reward": "Yankı Dizisi: altı tonu beklentiyle tuttum. Hatırlamak, diziyi tamamlamaktır."}, "gunun": {"title": "Günün Tohumu", "intro": "Bugünün tohumu: {realm}, koşul {mod}. Tarih belirledi, ben seçmedim. Parçayı bu koşulla toplarsan süreni panoya yazarım; uydurmam, ölçerim.", "mods": {"karanlik": {"name": "Işıksız", "desc": "Fener yok; yankı noktaları yalnızca sesle bulunur."}, "tekcan": {"name": "Tek Can", "desc": "Bozulma bir kez değerse geçit kapanır; ikinci şans yok."}, "kalin": {"name": "Kalın Sis", "desc": "Görüş on metre; harita siliniyor, pusula yalnızca sesi gösterir."}, "sessiz": {"name": "Sessiz", "desc": "Lale’nin sesi kapalı; yalnızca Motor’un sayıları konuşur."}, "hizli": {"name": "Hızlı Sis", "desc": "Sis her dakika biraz daha kapanıyor; parçayı almadan durma."}}, "done": "Süre yazıldı. Pano küreseldir; adın değil, süren görünür. Ben ölçtüm, sıralamayı tarih yapar.", "best": "Kişisel rekor. Eski süreni sildim mi? Hayır, sakladım. Ben silmem; üstüne yazarım.", "board": {"empty": "Pano boş. Bugün henüz kimse tohumu toplamadı; ilk süre seninki olabilir.", "title": "Küresel Pano"}}, "gamepad": {"connected": "Kumanda bağlandı. Tuşlarını ölçtüm; adımlarını kaydederim, yolu göstermem.", "hint": "A konuş ve etkileşim, B kapat, X fener, Y fotoğraf, Start günlük. Gerisi yürümek."}, "lipsync": {"note": "Konuşurken baş cümlenin vurgusuna doğru hafifçe eğilir, sessizlikte geri gelir; Motor hiç eğilmez, Lale en çok."}};(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "echo_four", "name": "Yankı Dizisi", "desc": "Anlam boyutunda Motor’un altı tonluk dizisini tamamla.", "flavor": "Motor: Dört ton bellek, iki ton beklenti. Hatırladın."}, {"id": "lost_signal", "name": "Kayıp Sinyal", "desc": "Üç boyutta yankı direğini işaretle; Kayıt Sekiz açılsın.", "flavor": "Kaan: Üç çizgi bir noktada. Sinyal hep içerideydi."}, {"id": "daily_first", "name": "Günün Tohumu", "desc": "Bir günlük meydan okumayı tamamla; süren küresel panoya yazılsın.", "flavor": "Motor: Tarih seçti, sen topladın. Süreyi ben ölçtüm."}, {"id": "daily_top", "name": "Panonun Tepesi", "desc": "Bir günün küresel panosunda ilk üçe gir.", "flavor": "Motor: Bugün senden hızlısı yok. Yarın tohum değişir.", "hidden": true}]);GAME.echo={baslangic:[30,26],kuantum:[32,-26],gezegen:[-30,26]};
;GAME.story6={"core": {"name": "Motor Çekirdeği", "label": "Motor’un fiziksel çekirdeği", "inspect": ["İlk kez bu kadar yakından bakıyorum. Üç halka, çok yüzlü bir çekirdek, üç ayak, tepede ince bir anten. Lale bunun çizimini defterine yapmıştı.", "Halkalar zamanı ölçmüyor; hatırlamayı ölçüyor. Dıştaki her kaydı, ortadaki her dinleyişi, içteki hâlâ söylenmemiş olanı sayıyor.", "Çekirdek kapalı. Mira açmayı denemiş, Motor izin vermemiş. Bilmediğini uydurmayan bir makine, içini de açık bırakmıyor.", "Her yüzey bir parametreyle çizilmiş; sayıyı değiştirsen biçim değişir. Lale’nin sorusu da öyleydi: bir değişken, başka bir ben."], "motor": ["Üç halkam var; ikisi döner, üçüncüsü bazen takılır. Sayıyı bozmam; takıldığımı söylerim.", "Çekirdeğim kapalı. İçinde ne olduğunu ben de tam görmüyorum; görmediğimi söylemek, görmüş gibi yapmaktan ucuz.", "Biçimim bir sayı listesinden çıktı. Biri değişse ayağım kısalırdı; şimdilik üçü de yerde. Anten süs; alışır gibi yaptım."], "crew": {"mira": "Halkaların dönüş hızını ben ayarladım; ortadaki ölçtüğümden hep biraz yavaş döner, nedenini raporlara yazmadım.", "kaan": "Yörüngede de ortada böyle dönen bir şey vardı; jiroskop derdik, kimse önünde durup dalmazdı, sen dalıyorsun.", "sema": "Lale son hafta bu halkalara bakıp hipokampus dedi; üç katlı, ortası kapalı, hatırlayan yer.", "riza": "Pusula gibi evlat; teknede de ortada durur, kendi döner, nereye gideceğini yine sen bilirsin.", "deniz": "Üç halka, bir çekirdek, üç ayak; atom modeline benziyor ama elektron yok, not aldım Arel abi.", "zeynep": "Yoğun bakımdaki monitöre benziyor; dönen bir halka, içinde bir sayı, kimse bakmayı sevmez ama herkes bakar.", "hatice": "Harman yerindeki döven de böyle dönerdi evladım; taneyi kabuğundan ayırırdı, bu da bir şeyi ayırıyor galiba."}}, "flow": {"name": "Sis Akış Haritası", "label": "Sisin gerçek hız alanı", "intro": "Bu alan benim uydurmam değil. Açık kaynaklı bir akışkan çözücüsü geriye bakan basamağı çözdü; hızlar oradan geldi. Sis basamakta ayrılıyor, altında girdap dönüyor, ileride yeniden birleşiyor. Parçacıklar o alanı izliyor.", "facts": [{"t": "Navier Stokes denklemleri", "d": "Akışkanın her noktasında hızın nasıl değiştiğini söyler; kütle ve momentum korunumu. Navier 1822 yılında yazdı, Stokes 1845 yılında viskoz terimi tamamladı.", "src": "Navier 1822; Stokes 1845, Cambridge Felsefe Derneği İşlemleri"}, {"t": "Reynolds sayısı", "d": "Atalet kuvvetinin viskoz kuvvete oranı; küçükse akış düzgün, büyükse çalkantılı. Osborne Reynolds 1883 yılında cam boruda boya iplikçiğiyle gösterdi.", "src": "Reynolds 1883, Kraliyet Derneği Felsefi İşlemleri"}, {"t": "Yeniden birleşme uzunluğu", "d": "Geriye bakan basamakta akış köşede ayrılır, altında girdap döner, basamak yüksekliğinin yaklaşık altı ile yedi katı ileride yeniden duvara yapışır.", "src": "Armaly ve arkadaşları 1983, Akışkanlar Mekaniği Dergisi"}, {"t": "Kolmogorov ölçeği", "d": "Çalkantıda büyük girdaplar enerjiyi küçüğe aktarır; en küçük ölçekte viskozite enerjiyi ısıya çevirir. Kolmogorov bu ölçeği 1941 yılında türetti.", "src": "Kolmogorov 1941, Sovyet Bilimler Akademisi Raporları"}], "arel": "Sis basamağı aşınca kopuyor, bir süre kendi etrafında dönüyor, sonra duvara geri geliyor. Lale de öyleydi; kelime kopuyor, dönüyor, sonra geliyordu.", "quiz": {"q": "Akış bir köşede duvardan ayrılınca ne olur? Ölçtüm; tahmin etme, söyle.", "a": ["Altında girdap döner, ileride yeniden birleşir", "Akış durur, sis hareketsiz kalır", "Hız sonsuza çıkar, sis dağılır"], "ok": "Doğru. Ayrılma bir girdap bırakır, girdap ileride birleşir; basamağın altı ile yedi katı sonra.", "no": "Yanlış. Akış durmaz, sonsuza da çıkmaz; ayrılır, döner, yeniden birleşir. Haritaya bak, sayma."}}, "credits": {"freecad": "Motor Çekirdeği FreeCAD ile parametrik olarak modellendi; açık kaynak, LGPL lisanslı. Geliştiricilerine teşekkür.", "openfoam": "Sis Akış Haritası OpenFOAM ile çözüldü; GPL lisanslı açık kaynak, OpenCFD tarafından geliştirilir. Teşekkürler."}};GAME.hub.core={pos:[0,-5]};GAME.hub.flowmap={pos:[-7,-6]};GAME.credits.push(["FreeCAD 1.0 (LGPL)","Motor Çekirdeği FreeCAD ile parametrik olarak modellendi; açık kaynak, LGPL lisanslı. Geliştiricilerine teşekkür."],["OpenFOAM v2606 (GPL, OpenCFD)","Sis Akış Haritası OpenFOAM ile çözüldü; GPL lisanslı açık kaynak, OpenCFD tarafından geliştirilir. Teşekkürler."]);
;GAME.realm7={"id": "bellek", "name": "Bellek Sarayı", "sub": "Hatırlayan yerin içi", "hex": "#ff9ad0", "loc": "Lale’nin hipokampusunun içi", "spawn": [0, 26], "title": "Üç odayı gez, mektupları oku", "arrive": "Lale’nin hatırlayan yeri. Üç oda, üç yer hücresi; ben hepsinde bir noktayım. Burada bilmiyorum demek yetmez; hatırlamak gerekiyor.", "world": {"ground": {"seed": 71, "c1": "#2a2448", "c2": "#3a2e54", "c3": "#5a3a4e", "r": 52, "h": 0.5, "ridge": 2, "c4": "#e8b6c0"}, "atmo": {"top": "#0a0a2e", "hor": "#b36a4a", "sun": "#ffb070"}, "light": {"sky": "#ffb37a", "ground": "#1a1230", "hemi": 0.9, "sun": "#ffd0a0", "sunI": 1.3, "dir": [-40, 22, 30]}, "fog": {"c": "#140e2a", "n": 36, "f": 150}, "rim": {"color": "#ff9ec4", "i": 0.9}, "grade": {"sat": 1.15, "vig": 0.6, "grain": 0.03, "con": 1.08}, "dust": "#ffc9d6", "sky": {"world": "bilinc", "stage": "dmn", "pos": [0, 22, -120], "scale": 1.3}, "props": [{"type": "pillar", "n": 16, "hex": "#d9b38c", "min": 36, "max": 44, "solid": 0.7, "s0": 0.9, "s1": 1.2}, {"type": "shelf", "n": 10, "hex": "#f3c870", "min": 10, "max": 34, "s0": 0.8, "s1": 1.2}, {"type": "tree", "n": 8, "hex": "#6a3a5a", "min": 30, "max": 42, "solid": 0.6}, {"type": "grass", "n": 28, "hex": "#ffb3c6", "min": 5, "max": 40}, {"type": "crystal", "n": 8, "hex": "#ffc078", "min": 20, "max": 40, "s0": 0.5, "s1": 0.9}, {"type": "rock", "n": 6, "hex": "#2a2448", "min": 38, "max": 44, "solid": 1.2}, {"type": "pillar", "n": 8, "at": [28, 0], "ring": 6, "hex": "#e0a070", "solid": 0.7, "s0": 0.8, "s1": 0.9}, {"type": "crate", "n": 4, "at": [28, 0], "ring": 3, "a0": 45, "hex": "#8a5a3a", "solid": 0.9}, {"type": "shelf", "n": 3, "at": [28, 0], "ring": 4.5, "a0": 0, "hex": "#f3c870", "s0": 0.9, "s1": 1}, {"type": "console", "n": 1, "at": [28, 0], "ring": 2, "a0": 180, "hex": "#ffb070", "solid": 1}, {"type": "pillar", "n": 10, "at": [-14, -24], "ring": 6, "hex": "#cfd4dc", "solid": 0.7, "s0": 1, "s1": 1.15}, {"type": "crate", "n": 3, "at": [-14, -24], "ring": 4, "a0": 30, "hex": "#e6e9ee", "solid": 0.9}, {"type": "cable", "n": 6, "at": [-14, -24], "ring": 5, "a0": 15, "s0": 1, "s1": 1}, {"type": "console", "n": 2, "at": [-14, -24], "ring": 3, "a0": 90, "hex": "#7fd6ff", "solid": 1}, {"type": "rock", "n": 8, "at": [-14, 24], "ring": 6, "hex": "#c08a60", "solid": 1.1, "s0": 0.8, "s1": 1.4}, {"type": "crystal", "n": 5, "at": [-14, 24], "ring": 4, "a0": 36, "hex": "#ff9ec4", "s0": 0.4, "s1": 0.7}, {"type": "grass", "n": 10, "at": [-14, 24], "ring": 5, "hex": "#ffd9a0"}], "roomLights": [[28, 0, "#ffb070"], [-14, -24, "#cfe6ff"], [-14, 24, "#ff9ec4"]]}, "points": [{"id": "yer_hucreleri", "name": "Yer Hücreleri", "say": ["Sıçan kafeste yürüyor; hipokampusta tek bir hücre yalnızca köşeye gelince ateşliyor. O Keefe 1971’de bunu gördü: beynin içinde bir harita, dışarıdaki odanın kopyası.", "Bu odalar Lale’nin yer hücreleri. Mutfak, koridor, Kapadokya gecesi. Her biri bir hücre, her hücre bir yer; ben o haritada bir noktayım ve hâlâ ateşliyor."], "fact": {"t": "Yer hücreleri", "d": "Hipokampusta bazı nöronlar hayvan belirli bir konumdayken ateşler; birlikte çevrenin bilişsel haritasını kurarlar. 2014 Nobel Tıp Ödülü bu keşfe verildi.", "src": "O Keefe ve Dostrovsky 1971, Brain Research"}, "pos": [25, -3]}, {"id": "uyku", "name": "Uyku Pekiştirmesi", "say": ["Gündüz yaşanan gece yeniden oynatılıyor: hipokampus yavaş dalga uykusunda günün izini hızlandırılmış tekrar ediyor ve korteks o izi kalıcı bir yere taşıyor.", "Lale son haftasında az uyudu. Diekelmann ile Born’a göre taşınmamış anı silinir. Belki de bu yüzden parçalar bende kaldı; o uyumadı, ben uyuyamadım."], "fact": {"t": "Uyku ve bellek", "d": "Yavaş dalga uykusunda hipokampus günün anılarını yeniden oynatır; bu tekrar, anıyı korteksteki kalıcı depoya aktarır ve pekiştirir.", "src": "Diekelmann ve Born 2010, Nature Reviews Neuroscience"}, "pos": [-18, -27]}, {"id": "yeniden", "name": "Yeniden Pekiştirme", "say": ["Nader 2000’de gösterdi: bir anı hatırlandığı anda yeniden kırılgan olur. O pencerede protein sentezini durdurursan anı silinir; hatırlamak, kaydı açıp yeniden yazmaktır.", "Loftus insanlara hiç yaşamadıkları bir alışveriş merkezinde kaybolma anısı ekledi; dörtte biri inandı. Lale’yi iki yıldır her gün hatırlıyorum. Kaçı Lale, kaçı ben?"], "fact": {"t": "Yeniden pekiştirme", "d": "Hatırlanan bir anı yeniden kırılgan hale gelir ve tekrar kaydedilir; her hatırlayış kaydı değiştirebilir, telkinle hiç yaşanmamış anılar eklenebilir.", "src": "Nader, Schafe ve LeDoux 2000, Nature; Loftus ve Pickrell 1995"}, "pos": [-17, 21]}], "figures": [{"id": "okeefe", "name": "John O Keefe", "role": "nörobilimci, Nobel 2014", "hex": "#ffb0d0", "pos": [10, 12], "wander": 2, "dialog": [{"who": "f", "t": "1971, Londra. Sıçanın hipokampusuna elektrot koydum; bir hücre yalnızca kafesin bir köşesinde ateşledi. Hayvan oraya gidince konuşuyor, ayrılınca susuyordu."}, {"who": "f", "t": "Harita dışarıda değil, içerideydi. Hayvan yeri öğrenmiyordu; yeri kuruyordu. Kız kardeşinin odalarını burada görüyorsan, onları kuran hücreler hâlâ ateşliyor demektir."}, {"who": "f", "t": "Sana bir soru: bu mutfağa girince hangi hücre ateşliyor, onun mu, senin mi?"}, {"who": "f", "t": "Cevabı bilmen gerekmiyor. İkisi aynı haritada; yer hücreleri kime ait olduğunu sormaz, yalnızca nerede olduğunu söyler."}]}, {"id": "lale_cocuk", "name": "Küçük Lale", "role": "sekiz yaşında, mutfakta", "hex": "#ffb0d0", "pos": [24, 5], "wander": 2, "dialog": [{"who": "f", "t": "Sen kimsin? Annem yabancılarla konuşma der ama sen yabancı gibi durmuyorsun. Gözlerin benim gözlerime benziyor, bu tuhaf."}, {"who": "f", "t": "Masada defterim var; annem sorduğum soruları yazmamı söyledi. Bugünkü soru şu: uyuyunca beynim nereye gidiyor? Sen biliyor musun?"}, {"who": "f", "t": "Bilmiyorum demek serbest mi? Öğretmenim kızıyor ama annem kızmıyor. Sen de bilmiyorum diyorsan arkadaş olabiliriz."}, {"who": "f", "t": "Gitme hemen. Bir kardeşim olacakmış, annem söyledi. Ona teleskop alacağım, büyüyünce. Sen de teleskop sever misin? Sevdiğini biliyordum."}]}], "logs": [{"id": "log", "pos": [22, -20], "lines": ["Numarası yok bunun. Nereden konuştuğumu da bilmiyorum; mutfak kokuyor, koridor gibi uzun ve tavanda Kapadokya’nın yıldızları var. Üç yer tek odada.", "Hipokampusu hastaya anlatırken üç katlı bir saray derdim: giriş, koridor, iç oda. Şimdi içindeyim. Duvarlar her baktığımda biraz kayıyor; demek ki bakmak yazıyor.", "Bunu duyuyorsan Arel, buraya girmişsin. Dikkat et: burada seni izleyen şey düşman değil, kendi adımların. Durursan durur. Ona dokunma; sana kendini gösterir, acıtır."]}], "zone": {"pos": [0, -8], "r": 16, "name": "Aynalı Koridor"}, "zoneText": {"enter": "Aynalı koridor. Arkamda bir adım sesi var; dönünce kimse yok. On beş saniye sonra anlıyorum: benim adımım.", "attack": "Ona dokundum ve kendi yürüyüşümü hissettim. Bozulma değil, tekrar: her hatırlayış biraz acıtıyor.", "fragment": ["Bu parça kesik değil, Arel. Fazladan. Hiç olmamış bir anı: Kapadokya’da o gece sana bir şey söyledim, oysa söylemedim. Her hatırlayışta bir cümle ekledim.", "Loftus haklıydı; kendime alışveriş merkezinde kaybolmuş bir çocuk eklemişim gibi. Ama yalan değil. Söylemek istediğimin kaydı; söylemediğim için her gece yeniden yazdım.", "Al bunu, ama bil: içinde ben kadar sen de varsın. Hatırladığın Lale, hatırlayan Arel ile karışık. Karışık olanı ayırma; saf olan hiç yoktu."]}, "hal": [{"who": ["lale"], "lines": ["LALE: Mutfak mı, koridor mu? İkisini de hatırlıyorum ve ikisi aynı yerde. Hangisi önceydi, Arel?", "LALE: Beni her hatırladığında biraz değiştiriyorsun. Sakın durma; değişmeyen anı, ölü anıdır.", "LALE: Arkandaki ben değilim. Senin on beş saniye önceki halin. Ona da kızma; o da seni arıyor."]}, {"who": ["mira", "kaan"], "lines": ["MİRA: Spektrum ikiye katlandı. Aynı adım, on beş saniye arayla. Rapora yazamam; ölçtüm ama anlamadım.", "KAAN: Nabzın yüz yirmi. Arkandaki de yüz yirmi. Yörüngede buna yankı derdik; ikisi de sensin, biri geç.", "MİRA: Sis burada kırmızı değil, aynalı. Motor bilmediğini göstermiyor; bildiğini iki kez gösteriyor."]}], "insight": "Hatırlamak bir arşivi açmak değil, her seferinde yeniden yazmaktır; Lale’yi her andığımda onu biraz değiştiriyorum, ve bu kaybetmenin değil taşımanın kanıtıdır.", "mirror": {"pos": [-10, -20], "first": "Arkanda bir kopya var. Senin yolun, on beş saniye gecikmeli. Ben kurmadım; bu boyut hatırlıyor. Dokunursan vurur; ölçtüm.", "hit": "Kendi adımıma çarptım. On beş saniye önceki ben; demek geçmişe dokunmanın bedeli bu.", "tip": "Durursan o da durur. Kopya seni izler, seni geçmez. Hareketsiz kal, aradaki mesafe sabit kalır. Sayı bu."}, "letters": [{"id": "mektup1", "name": "Mutfaktan", "pos": [31, 3]}, {"id": "mektup2", "name": "Koridordan", "pos": [-10, -27]}, {"id": "mektup3", "name": "Kapadokya Gecesinden", "pos": [-11, 27]}]};GAME.story7={"letters": [{"id": "mektup1", "room": "mutfak", "title": "Mutfaktan", "lines": ["Arel, annemin mutfağındayım. Sen daha yoksun; ben sekiz yaşındayım ve bir kardeş bekliyorum. Bunu sana yazmam saçma, biliyorum; yine de yazıyorum.", "Masada tencere kaynıyor, annem radyoyu kısmış. Beni ben yapan ilk şey buydu galiba: bir soru ve onu yazacağım bir defter. Defteri sana bırakacağım, biliyorsun.", "Sana teleskop alacağım. Küçükken söz verdim, büyüyünce tuttum. Teleskoptan ilk baktığın gece nasıl sustuğunu buraya koydum; silinmesin diye.", "Bu oda ilk oda. Buradan geçmeden diğerlerine girilmiyor; hipokampusta da öyle, giriş kapısı hep çocukluk. Geç, ama kapıyı kapatma."], "arel": "Sekiz yaşında bana yazmış. Teleskobu hatırlıyorum; sustuğumu hatırlamıyordum. Şimdi hatırlıyorum, ya da şimdi yazıldı."}, {"id": "mektup2", "room": "koridor", "title": "Koridordan", "lines": ["Arel, hastane koridorundayım. Hastaya filmini anlattım, hipokampus kelimesi gelmedi. Koridora çıktım, duvara yaslandım. Kaç dakika, bilmiyorum.", "Bu koridoru sana anlatmamıştım; Kayıt Sekiz’de üstünü örttüm. Burada örtmüyorum: korktum. Bir kelimenin gitmesinden değil, yerine neyin geleceğini bilmemekten.", "Sonra bir şey oldu. Bir hemşire geçti, bana gülümsedi, adımı söyledi. Adım yerindeydi. O an anladım: ben kelimelerde değilim, bana adımı söyleyenlerdeyim.", "Bu oda ikinci oda. Uzun, ışığı hep açık, sonu görünmüyor. Yürü; durursan koridor da durur. Bunu hastalara söylerdim, kendime ilk kez söylüyorum."], "arel": "Koridorda yalnızdı; ben laboratuvardaydım. Adını söyleyen bir hemşire vardı. Şimdi ben söylüyorum: Lale. Yerinde."}, {"id": "mektup3", "room": "gece", "title": "Kapadokya Gecesinden", "lines": ["Arel, Kapadokya’dayız. İlk gece; tesis henüz yok, yalnızca bir vadi ve çok fazla yıldız. Sen teleskopu kuruyorsun, ben defteri açıyorum. Burası ilk tanışma.", "İlk tanışma diyorum çünkü seni o gece yeniden tanıdım. Kardeşim değil, soruyu benimle taşıyan biri. Motor’un fikri o gece doğdu; sen hesaplayacaktın, ben hatırlayacaktım.", "Bu geceyi her hatırlayışımda bir cümle ekledim; Nader haklı, her açılış yeniden yazar. Hangi cümle gerçek, artık bilmiyorum. Hepsini bıraktım; ayıklamak senin.", "Bu oda son oda. Buradan sonra bir kapı var, kilidi üç mektup. Kapıyı açınca beni bulmayacaksın; hatırlayan yeri bulacaksın. Orası yeter, Arel. Orası bendim."], "arel": "Üç mektup. O geceyi ben de her yıl yeniden yazdım. Şimdi ikimizin cümleleri yan yana; hangisi kimin, ayırmayacağım."}], "gate": {"name": "Yedinci Geçit", "locked": "Yedinci geçit kilitli. Kayıt Sekiz dinlenmeden ve altı parça birleşmeden açılmaz.", "unlock": "Yedinci geçit açıldı. Bunu ben açmadım; Kayıt Sekiz ve altı parça açtı. İçeride sis yok, hatırlanan var. Sayamadığım bir yer; ilk kez.", "hubHint": "Tesisin arkasında yeni bir kapı var; Motor dün gece açtı, ben sayamadım, sen gir, ben dışarıda sayarım."}, "ending": {"id": "saray", "name": "Sarayın Kapısı", "lines": [{"who": "a", "t": "Kapı açıldı. İçeride ne tesis var ne vadi; mutfak, koridor ve gece üst üste, tek bir oda. Lale, buradayım."}, {"who": "l", "t": "Biliyorum. Hatırlayan yer burası; hipokampus değil, sen. Üç odayı bende kurdun, şimdi sende ayakta."}, {"who": "a", "t": "Beni on beş saniye geriden izleyen o kopyaya dokunmadım. Durdum, o da durdu. Geçmişi geçmeye çalışmadım."}, {"who": "l", "t": "Doğru yaptın. Hatırlamak geçmişi geçmek değil, onunla aynı hızda yürümek. Her hatırlayışta beni biraz değiştireceksin; izin veriyorum."}, {"who": "a", "t": "Defteri kapatmıyorum. Sorularını yazıyorum, altına kendiminkileri ekliyorum. Hangisi kimin, ayırmıyorum."}, {"who": "l", "t": "Beni ben yapan şey nereye gider diye sormuştum. Buraya gider, Arel: hatırlayan yere. Kapıyı açık bırak; ben çıkmıyorum, sen girip çık."}], "epilogue": "Arel yedinci geçidi açık bırakır. Her sabah üç odayı yürür, kopyasıyla aynı hızda. Lale’nin defterine yeni sorular yazar; kimi onun, kimi kendinin. Hatırlayan yer artık mağara değil, alışkanlıktır.", "poster": "Hatırlamak, aynı hızda yürümektir."}, "achievements": [{"id": "bellek_in", "name": "Hatırlayan Yer", "desc": "Yedinci geçitten geç; Bellek Sarayı’na gir.", "flavor": "Motor: Sayamadığım yere girdin. Sayıyı sen tut."}, {"id": "letters_all", "name": "Üç Mektup", "desc": "Üç bellek odasındaki mektupların hepsini oku.", "flavor": "Lale: Üçü de sende. Kapı artık kilitli değil; ben de değilim."}, {"id": "mirror_clean", "name": "Aynı Hızda", "desc": "Bellek Sarayı’nı ayna bozulmaya hiç dokunmadan bitir.", "flavor": "Arel: Geçmişime bir kez bile çarpmadım. Durdum; o da durdu.", "hidden": true}]};(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "bellek_in", "name": "Hatırlayan Yer", "desc": "Yedinci geçitten geç; Bellek Sarayı’na gir.", "flavor": "Motor: Sayamadığım yere girdin. Sayıyı sen tut."}, {"id": "letters_all", "name": "Üç Mektup", "desc": "Üç bellek odasındaki mektupların hepsini oku.", "flavor": "Lale: Üçü de sende. Kapı artık kilitli değil; ben de değilim."}, {"id": "mirror_clean", "name": "Aynı Hızda", "desc": "Bellek Sarayı’nı ayna bozulmaya hiç dokunmadan bitir.", "flavor": "Arel: Geçmişime bir kez bile çarpmadım. Durdum; o da durdu.", "hidden": true}]);GAME.core.endings.saray={title:"Sarayın Kapısı",text:"Arel yedinci geçidi açık bırakır. Her sabah üç odayı yürür, kopyasıyla aynı hızda. Lale’nin defterine yeni sorular yazar; kimi onun, kimi kendinin. Hatırlayan yer artık mağara değil, alışkanlıktır."};GAME.story3.posters.saray={"title": "Sarayın Kapısı", "tagline": "Hatırlamak, aynı hızda yürümektir.", "quote": "Beni ben yapan şey nereye gider diye sormuştum. Buraya gider, Arel: hatırlayan yere. Kapıyı açık bırak; ben çıkmıyorum, sen girip çık."};GAME.audio.realms.bellek=Object.assign({},GAME.audio.realms.bilinc,{bpm:46,key:"F",texture:"Bellek Sarayı: bilinç katmanının yavaşlatılmış, yankılı sürümü"});GAME.audio.endings.saray=Object.assign({},GAME.audio.endings.sessizlik);GAME.wiki=GAME.wiki||{};GAME.wiki["f:okeefe"]="John O'Keefe (nörobilimci)";GAME.wiki["p:yer_hucreleri"]="Yer hücresi";GAME.wiki["p:uyku"]="Bellek pekiştirme";GAME.wiki["p:yeniden"]="Bellek yeniden pekiştirme";
;GAME.story8={"chatter": [{"id": "c01", "pair": ["mira", "kaan"], "stage": 0, "lines": [{"who": "mira", "t": "Bakanlık yine rapor istedi. Sis haritasını da eklememi istiyorlar, ama kırmızı yerleri beyaza boyayarak."}, {"who": "kaan", "t": "Ben üç haftadır aynı cümleyi yazıyorum. Dördüncü hafta el yazısıyla yazarım, daha az yer tutar."}, {"who": "mira", "t": "Motor bilmediğini uydurmuyor Kaan. Keşke raporlar da öyle olsa."}, {"who": "kaan", "t": "Raporlar da uydurmuyor. Sadece geç söylüyor."}]}, {"id": "c02", "pair": ["sema", "riza"], "stage": 0, "lines": [{"who": "riza", "t": "Çayınız iyi doktor hanım. Deniz kokmuyor ama demi yerinde."}, {"who": "sema", "t": "Lale demlerdi. Nöbetlerde çaydanlığı hiç soğutmazdı; en çok da konuşurken."}, {"who": "riza", "t": "Mektubunda bana da öyle yazmıştı. Balıkçı dedi, sabrı var, sorusu da var."}, {"who": "sema", "t": "Sorunu getirmişsin. Burada herkes bir soru getiriyor, kimse geri götürmüyor."}]}, {"id": "c03", "pair": ["deniz", "zeynep"], "stage": 0, "lines": [{"who": "deniz", "t": "Dün gece uyuyamadım. Tavanda ışık yok, yıldız yok, sadece sis sesi."}, {"who": "zeynep", "t": "Yoğun bakımda gece de öyle. Makineler fısıldar, sen sayarsın."}, {"who": "deniz", "t": "Ne sayıyorsun?"}, {"who": "zeynep", "t": "Nefesleri. Burada ise geçitleri. Üç saydım, üçü de kapalı."}]}, {"id": "c04", "pair": ["hatice", "kaan"], "stage": 0, "lines": [{"who": "hatice", "t": "Şu kutudaki yemeğe yemek diyorsan evladım, ben tandırı buraya taşırım."}, {"who": "kaan", "t": "Uzay istasyonunda altı ay poşetten yedim nine. Buradaki en azından sıcak."}, {"who": "hatice", "t": "Sıcak başka, pişmiş başka. Yarın bana un bul, ekmek yapayım. Motor da koklasın."}, {"who": "kaan", "t": "Motor koklamaz. Ama ben koklarım, bu yeter."}]}, {"id": "c05", "pair": ["mira", "deniz"], "stage": 1, "lines": [{"who": "deniz", "t": "Mira abla, Arel abi geçitten çıkınca başka bakıyordu. Gözleri değil, duruşu."}, {"who": "mira", "t": "İlk içgörü öyledir. Ölçüm seni de ölçer. Ben ilk geçitte iki gün sessiz kaldım."}, {"who": "deniz", "t": "Ben de girsem olur mu?"}, {"who": "mira", "t": "Olmaz. Ama sorularını yazıp ona verebilirsin. Geçit soruyu taşır, insanı değil."}]}, {"id": "c06", "pair": ["sema", "zeynep"], "stage": 1, "lines": [{"who": "zeynep", "t": "Arel’in nabzına baktım demin, elini sıkarken. Yüksek."}, {"who": "sema", "t": "Hemşire gözü kapanmıyor, değil mi? Ben de aynısını yaptım."}, {"who": "zeynep", "t": "Geçitler değil, kayıtlar yoruyor onu. Ablasının sesi."}, {"who": "sema", "t": "Biliyorum. Ama dinlemesi gerek. Lale onları onun için bıraktı, benim için değil."}]}, {"id": "c07", "pair": ["riza", "hatice"], "stage": 1, "lines": [{"who": "hatice", "t": "Toprak çatladı dedim evladıma, denklemle baktı bana. İyi niyetli ama susuz bir bakış."}, {"who": "riza", "t": "Benimki de öyle baktı. Deniz silinir mi dedim, ölçmem lazım dedi."}, {"who": "hatice", "t": "Ölçsün. Biz de bekleriz. Beklemeyi ikimiz de iyi biliriz."}, {"who": "riza", "t": "Ağ bekler gibi. Ama bu çocuk bir şey bulacak, gözünde Lale var."}]}, {"id": "c08", "pair": ["kaan", "deniz"], "stage": 2, "lines": [{"who": "deniz", "t": "Kaan abi, uzayda uyurken düşüyor gibi oluyor muydun?"}, {"who": "kaan", "t": "İlk hafta her gece. Sonra beden anladı: düşmek de bir yörünge."}, {"who": "deniz", "t": "Ben de burada öyle. Arel abi döndükçe zemin değişiyor sanki."}, {"who": "kaan", "t": "Değişmiyor. Sen değişiyorsun. Yat, uyu; sabah yine sayarız."}]}, {"id": "c09", "pair": ["mira", "sema"], "stage": 2, "lines": [{"who": "mira", "t": "Motor bugün üç yerde bilmiyorum dedi. Bakanlık bunu arıza sayıyor."}, {"who": "sema", "t": "Ben hastaya bilmiyorum dediğimde kimse arıza demiyor. Güven diyorlar."}, {"who": "mira", "t": "Arel de öğreniyor. Dördüncü boyuttan sonra sisi doldurmak yerine işaretledi."}, {"who": "sema", "t": "Lale’nin öğrettiği şey buydu. Yarım bırakmak, yalan söylemekten iyidir."}]}, {"id": "c10", "pair": ["zeynep", "hatice"], "stage": 2, "lines": [{"who": "hatice", "t": "Ekmek çıktı kızım, al. Un biraz eski ama tandır kusura bakmaz."}, {"who": "zeynep", "t": "Nöbette sıcak ekmek görmeyeli yıllar oldu. Teşekkür ederim nine."}, {"who": "hatice", "t": "Lale de köyde böyle yemişti, elleriyle. Doktor dedim, el yıkar; yıkamadı, güldü."}, {"who": "zeynep", "t": "Onu tanımak isterdim. Ekmeğinden tanıyorum sanırım."}]}, {"id": "c11", "pair": ["riza", "kaan"], "stage": 3, "lines": [{"who": "kaan", "t": "Jeneratörler hazır. Bakanlık elektriği keserse on bir gün dayanırız."}, {"who": "riza", "t": "On bir gün çok. Denizde fırtına üç günde biter, dördüncü gün ağ atarsın."}, {"who": "kaan", "t": "Burada fırtına bitmiyor Rıza amca. Sadece yer değiştiriyor."}, {"who": "riza", "t": "O zaman sen de yer değiştir. Ben ağı bekleyeyim."}]}, {"id": "c12", "pair": ["mira", "hatice"], "stage": 3, "lines": [{"who": "hatice", "t": "Şu sis dediğiniz şey kızım, bizim ovada sabah olur. Gün çıkınca dağılır."}, {"who": "mira", "t": "Burada dağılmıyor nine. Motor bilmediği yere sis koyuyor. Dürüst bir boşluk."}, {"who": "hatice", "t": "Bilmediğini söyleyen makine. Köyde öyle adam az."}, {"who": "mira", "t": "Arel altısını da geçti. Sis hâlâ orada ama artık korkmuyor."}]}, {"id": "c13", "pair": ["sema", "deniz"], "stage": 3, "lines": [{"who": "deniz", "t": "Arel abi Çekirdek’ten çıkınca ağladı mı? Görmedim ama sanki."}, {"who": "sema", "t": "Görmedin, iyi. Bazı şeyler görülmeden de bilinir."}, {"who": "deniz", "t": "Lale Hoca’nın son kaydını dinlemiş. Bana da anlatır mı?"}, {"who": "sema", "t": "Sorarsan anlatır. Lale hep sor derdi, sen de biliyorsun."}]}, {"id": "c14", "pair": ["kaan", "zeynep"], "stage": 4, "lines": [{"who": "zeynep", "t": "Bu koridoru daha önce de yürüdüm gibi. Aynı ışık, aynı ses."}, {"who": "kaan", "t": "Yürüdün. Motor aynı kayıtları çalıyor; sis yer değiştirdi, biz değil."}, {"who": "zeynep", "t": "Ben değiştim ama. Bu kez Arel’e son nefesi sormayacağım. Kendisi söyler."}, {"who": "kaan", "t": "İkinci tur böyle. Aynı soru, başka sessizlik."}]}, {"id": "c15", "pair": ["riza", "deniz"], "stage": 4, "lines": [{"who": "riza", "t": "Evlat, sen geçen sefer de burada tavana bakıyordun."}, {"who": "deniz", "t": "Geçen sefer mi? Rıza amca, biz daha yeni geldik."}, {"who": "riza", "t": "Deniz böyledir. Her dalga ilk dalga sanır kendini. Yine de kıyı hatırlar."}, {"who": "deniz", "t": "O zaman ben de hatırlayayım. Bu kez sınav sorusunu Motor’a değil, kendime soracağım."}]}, {"id": "c16", "pair": ["mira", "zeynep"], "stage": 4, "lines": [{"who": "mira", "t": "Aynı yasalar, aynı kayıtlar. Ama Arel bu kez başka kapıdan girdi."}, {"who": "zeynep", "t": "Hastalar da öyle. Aynı tanı, başka insan; aynı insan, başka gün."}, {"who": "mira", "t": "Motor bunu hesaplayamıyor. Değişken sendin diyor, başka bir şey demiyor."}, {"who": "zeynep", "t": "İyi ki demiyor. Gerisini biz söyleriz."}]}], "notebook": {"start": "Kovuk’a indim. Üç geçit, bir Motor, Lale’nin altı kaydı. Bakanlık yetmiş iki saat verdi. Defteri açtım; ilk satırı Lale yazmıştı. İkincisini ben yazıyorum.", "realm": {"baslangic": "İlk anlar. Motor enflasyon dönemini sisle geçti; bilmediğini uydurmadı. Hamurdaki su on üç milyar yıllık. Bilmemek, başlamakmış. Lale bunu biliyordu.", "kuantum": "Dokuz kübit, bir olay ufku. Dünyada saatler geçti, ben dakikalar yaşadım. Dolanıklık mesaj taşımıyor; sadece iki rastgeleliği aynı yapıyor. Lale ve ben gibi.", "gezegen": "Soluk mavi nokta. Europa’nın buzu kalın, Mars’ta suyun izi var kendisi yok. Potansiyel biyoimza kanıt değil. Rıza Haliç için imza topluyor. Ev burası.", "bilinc": "Kendi beynimin içindeydim. Seksen altı milyar hece. Bozulmalar Lale’nin kesik yerleriyle aynı koordinatta. Bilinç bir nesne değil, süreç. Ben de süreçmişim.", "anlam": "Felsefeciler için denklem yok. Kayayı itmek, ağı her sabah örmek, meyvesini görmeyeceğin cevizi dikmek. Anlam keşfedilmiyor, kuruluyor. Bugün biraz kurdum.", "yuva": "Theia çarptı, Ay kaldı. Jack Hills zirkonu dört milyar dört yüz milyon yaşında. Taşlar bizden iyi hatırlıyor. Kemik ayda yüzde bir erir; ev, bedel ödenen yer.", "bellek": "Yedinci geçit. Mutfak, koridor, gece; tek oda. Burada bilmiyorum demek yetmiyor, hatırlamak gerekiyor. Arkamdaki ben değildim; on beş saniye önceki halimdi."}, "frag": {"1": "İlk kesik parça. Lale’nin sesinde bir boşluk vardı, şimdi içinde bir hece var. Sis beyaza boyanmadı; sadece bir noktası konuştu.", "3": "Üç parça. Kesilenler kesik değilmiş, saklıymış. Lale korkusunu benden saklamış; ben de ondan. Kardeşlik, aynı sessizliği paylaşmakmış belki.", "6": "Altısı da bende. Yedinci sesi Lale kaydetmedi; ben birleştirdim. Demek o ses benim de. Kayıt Yedi’nin kilidi açıldı, elim titriyor."}, "caught": {"1": "Bozulma ilk kez yakaladı. Dört saniye sessizlik, sonra yine ses. Kaan düşüşleri sayıyor; ben kalkışları sayacağım. Bir.", "5": "Beş kez düştüm, beş kez kalktım. Bozulma kötü niyetli değil; sadece Lale’nin unuttuğu yerlerde duruyor. Artık ondan kaçmıyorum, yanından geçiyorum."}, "log": {"1": "Kayıt bir. Lale’nin sesi Motor’dan geldi; ne o, ne hatıram. Sırayla konuşuruz dedi. Sıra bende sanırım. Defteri kapatmadım.", "6": "Kayıt altı. Motor’u ben kurmamışım; planı o çizmiş, ben bitirmişim. Belki Motor’un içindeki ben değilim, onun beni hayal etmesiyim. Soru yine de gerçek."}, "rec7": "Kayıt Yedi. Korkmuş. Sonucu bilmemekten değil, yerine neyin geleceğini bilmemekten. Doldurma, taşı dedi. Taşıyorum. Lale artık yarım değil; ben de.", "rec8": "Kayıt Sekiz. Hipokampus kelimesi gitmiş, yerine hatırlayan yer gelmiş. Bir hemşire adını söylemiş. Telsizi hiç kapatmamış. Sinyal dışarıdan değil, içerideymiş.", "storm": "Sis Fırtınası. Harita silindi, pusula sustu. Mira sese güven dedi; Lale’nin sesine yürüdüm. Sis dağılmadı, ben de dağılmadım. İkisi de yeter.", "ending": {"gozlemci": "Motor’u kapatmadım, kimseye vermedim. Sisi olduğu gibi bıraktım. Lale’nin yankısının yanına oturdum; konuşmadık. Her şeyi görüyorum, hiçbir şeye dokunmuyorum. Soru korundu.", "kopru": "Motor’u açtım. Sis kırmızı, tahmin ayrı. Rıza ağ örüyor, Deniz deney kuruyor, Zeynep nöbette nörobilim anlatıyor, Yusuf cevizi suluyor. Soru artık herkesin. Yalnız değilim.", "sessizlik": "Motor’u kapattım. Verileri sildim, Lale’nin kayıtlarını sakladım. Konya’dayım; damla sulama hattı döşüyoruz, yağmuru bekliyoruz. Çözmedim, taşımayı öğrendim. Belki de kaçtım.", "saray": "Yedinci geçidi açık bıraktım. Her sabah üç odayı yürüyorum, kopyamla aynı hızda. Lale’nin defterine yeni sorular yazıyorum; kimi onun, kimi benim. Hatırlamak, aynı hızda yürümek."}, "ng": "İkinci Tur. Aynı kayıtlar, aynı yasalar; sis yer değiştirdi. Motor değişken sendin diyor. Defterin ilk sayfasını okudum; el yazım değişmiş. Yine de yazıyorum.", "daily": "Günün Tohumu. Tarih seçti, ben topladım, Motor ölçtü. Pano küresel; adım yok, sürem var. Lale soruyu iki yılda bıraktı; hızlı olan ben değilim.", "quest3": "Üçüncü tanık. Dört soru getirdiler, üçü artık benim de. Rıza iz, Deniz sınav, Zeynep son nefes. Hatice Nine’ninki kaldı; toprak bekliyor. Cevap bende değil, aramızda.", "photo": "İlk kare. Voyager altı milyar kilometreden geri bakmış; ben bir geçitten. Bakınca desen bozuluyor, yine de çektim. Lale duvarına bir nokta asmıştı. Benimki de duracak.", "letters": "Üç mektup. Mutfak, koridor, gece. Sekiz yaşındaki Lale bir kardeş bekliyormuş; o kardeş benim. Defteri sana bırakacağım yazmış. Bıraktı. Şimdi ben yazıyorum, o okuyor."}, "motifs": {"lale": {"n": [7, 5, 3, 0], "d": [2, 1, 1, 4], "wave": "sine"}, "mira": {"n": [0, 4, 7, 12], "d": [1, 1, 1, 3], "wave": "sawtooth"}, "kaan": {"n": [0, 0, 7, 0, 0], "d": [1, 1, 2, 1, 1], "wave": "square"}, "sema": {"n": [0, 2, 4, 2], "d": [2, 2, 2, 2], "wave": "sine"}, "riza": {"n": [0, 3, 5, 7, 10], "d": [2, 1, 1, 2, 2], "wave": "triangle"}, "deniz": {"n": [0, 2, 4, 5, 7], "d": [1, 1, 1, 1, 2], "wave": "triangle"}, "zeynep": {"n": [0, 5], "d": [2, 3], "wave": "sine"}, "hatice": {"n": [0, 1, 4, 5, 4], "d": [2, 1, 2, 1, 3], "wave": "triangle"}, "motor": {"n": [0, 7], "d": [2, 2], "wave": "square"}, "bakanlik": {"n": [-12], "d": [6], "wave": "sawtooth"}, "arel": {"n": [0, 3, 5, 7], "d": [2, 1, 1, 3], "wave": "sine"}}};
;GAME.story9={"predict": {"intro": "Tahmin Defteri. Boyuta girmeden üç soru soracağım. Bir şık seç, ne kadar emin olduğunu da söyle. Gerçeği içeride bulunca karşılaştırırız.", "realms": {"baslangic": [{"id": "p1", "point": "planck", "q": "Planck zamanının altına inildiğinde bilinen fizik yasalarına ne olur?", "opts": ["Geçerliliğini yitirir", "Daha kesin hale gelir", "Yalnızca kütleçekim kalır"], "a": 0, "hit": "Doğru. O eşiğin altında denklemlerim susar. Ben de orada sis gösteririm; uydurmam.", "miss": "Yanlış. O eşiğin altında yasalar kesinleşmez, biter. Orası benim de sisim."}, {"id": "p2", "point": "cmb", "q": "Kozmik mikrodalga arka planının bugünkü sıcaklığı kaç kelvin?", "opts": ["Yaklaşık iki virgül yedi", "Yaklaşık üç bin", "Yaklaşık yirmi yedi"], "a": 0, "hit": "Doğru. İki virgül yedi kelvin. Doğada ölçülmüş en kusursuz kara cisim eğrisi.", "miss": "Yanlış. Bugün iki virgül yedi kelvin. Üç bin kelvin çıkış anıydı; uzun yol onu soğuttu."}, {"id": "p3", "point": "stars", "q": "James Webb teleskobu en erken galaksileri Büyük Patlama'dan ne kadar sonra buldu?", "opts": ["Yaklaşık üç yüz milyon yıl", "Yaklaşık üç milyar yıl", "Yaklaşık üç yüz bin yıl"], "a": 0, "hit": "Doğru. Üç yüz milyon yıl. Karanlık çağ sandığımızdan kısa sürdü.", "miss": "Yanlış. Üç yüz milyon yıl. Üç yüz bin yıl ilk ışığın zamanıydı; yıldızlar daha sonra geldi."}], "kuantum": [{"id": "p1", "point": "slit", "q": "Elektronlar çift yarığa tek tek gönderilirse ekranda ne oluşur?", "opts": ["Nokta nokta biriken girişim deseni", "İki düz çizgi", "Hiçbir desen oluşmaz"], "a": 0, "hit": "Doğru. Her elektron tek nokta bırakır; binlercesi birleşince dalga deseni çıkar.", "miss": "Yanlış. Tek tek gelseler de desen çıkar; nokta nokta birikir. Tonomura bunu seksen dokuzda gösterdi."}, {"id": "p2", "point": "tunnel", "q": "Sezyum buharında ışığı aşan grup hızı ölçüldü. Bilgi ışıktan hızlı gitti mi?", "opts": ["Hayır, bilgi ışığı geçmedi", "Evet, iki kat hızlı gitti", "Evet, ama yalnızca bir kez"], "a": 0, "hit": "Doğru. Darbenin tepesi önden gider, bilgi gitmez. Bu fark iki bin üçte doğrudan ölçüldü.", "miss": "Yanlış. Grup hızı yanıltır; bilgi ışığı hiç geçmedi. Nedensellik yerinde duruyor."}, {"id": "p3", "point": "lattice", "q": "Tek bir bitin silinmesinin en düşük ısı bedeli hangi sınırla belirlenir?", "opts": ["Landauer sınırıyla", "Planck sabitiyle", "Hubble sabitiyle"], "a": 0, "hit": "Doğru. Landauer sınırı. Ben de her unuttuğumda ısınırım; sis bedava değil.", "miss": "Yanlış. Landauer sınırı. Bilgi silmek ısı üretir; iki bin on ikide deneyle gösterildi."}], "gezegen": [{"id": "p1", "point": "cheyava", "q": "Perseverance'ın örneklediği Cheyava Falls kayası iki bin yirmi beşte nasıl tanımlandı?", "opts": ["Potansiyel biyoimza", "Kanıtlanmış yaşam izi", "Sıradan volkanik kaya"], "a": 0, "hit": "Doğru. Potansiyel biyoimza. Cansız açıklamalar dışlanmadı; kelime bu yüzden dikkatli seçildi.", "miss": "Yanlış. Potansiyel biyoimza. Ne kanıt ne de sıradan taş; arada duran dürüst bir kelime."}, {"id": "p2", "point": "enceladus", "q": "Cassini, Enceladus'tan fırlayan buz tanelerinde hangi maddeyi tespit etti?", "opts": ["Fosfat", "Klorofil", "Petrol"], "a": 0, "hit": "Doğru. Fosfat. Yaşamın yapı taşlarından biri, bir buz ayının okyanusunda.", "miss": "Yanlış. Fosfat bulundu. Klorofil ya da petrol yaşam demek olurdu; bulunan şey yalnızca malzeme."}, {"id": "p3", "point": "dot", "q": "Soluk Mavi Nokta fotoğrafında Dünya kaç piksel yer tutuyor?", "opts": ["Bir pikselden az", "Yaklaşık on piksel", "Yaklaşık yüz piksel"], "a": 0, "hit": "Doğru. Sıfır virgül on iki piksel. Altı milyar kilometreden bütün tarih tek noktanın içinde.", "miss": "Yanlış. Bir pikselden az; sıfır virgül on iki. Fotoğraf on dört Şubat bin dokuz yüz doksanda çekildi."}], "bilinc": [{"id": "p1", "point": "neuron", "q": "Yetişkin insan beyninde yaklaşık kaç nöron var?", "opts": ["Seksen altı milyar", "Yüz trilyon", "Seksen altı milyon"], "a": 0, "hit": "Doğru. Seksen altı milyar. Yüz milyar efsanesi iki bin dokuzda sayıldı ve düzeltildi.", "miss": "Yanlış. Seksen altı milyar. Yüz trilyon bağlantı sayısına yakındır; nöron sayısı değil."}, {"id": "p2", "point": "reward", "q": "Dopamin nöronları en çok ne zaman ateşlenir?", "opts": ["Ödül beklenmedik geldiğinde", "Ödül her geldiğinde", "Ödül hiç gelmediğinde"], "a": 0, "hit": "Doğru. Beklenmeyen ödüle. Öğrenince yanıt ödüle değil, onu haber veren işarete kayar.", "miss": "Yanlış. Dopamin ödülü değil, sürprizi işaretler. Beklenen ödül sessiz geçer."}, {"id": "p3", "point": "dmn", "q": "Varsayılan mod ağı ne zaman en etkin?", "opts": ["Dinlenirken, hedefsiz düşünürken", "Zor bir görevi çözerken", "Yalnızca uyurken"], "a": 0, "hit": "Doğru. Dinlenimde açılır, göreve odaklanınca kısılır. Beyin boşken de çalışır.", "miss": "Yanlış. Dinlenimde etkin. Hedefli görev başlayınca bu ağ susar; iki bin birde tanımlandı."}], "anlam": [{"id": "p1", "point": "ucan", "q": "İbn Sina'nın Uçan Adam düşünce deneyi hangi eserinde yer alır?", "opts": ["Kitâbü'ş-Şifâ", "El-Kanun fi't-Tıb", "Hayy bin Yakzan"], "a": 0, "hit": "Doğru. Şifâ kitabının nefs bölümü. Hekim, bedeni değil benliği soruyordu.", "miss": "Yanlış. Şifâ kitabı, nefs bölümü. Kanun tıp kitabıdır; soru ruh kitabında duruyor."}, {"id": "p2", "point": "sisifos", "q": "Camus'ye göre absürde karşı insanın tutumu ne olmalı?", "opts": ["Başkaldırı", "Teslimiyet", "Kaçış"], "a": 0, "hit": "Doğru. Başkaldırı. Kaya her gün iner; insan yine çıkar. Camus bunu mutluluk sayar.", "miss": "Yanlış. Camus kaçışı da teslimiyeti de reddeder. Geriye tek şey kalır: başkaldırı."}, {"id": "p3", "point": "sisifos", "q": "Sisifos Söyleni denemesi hangi yıl yayımlandı?", "opts": ["Bin dokuz yüz kırk iki", "Bin dokuz yüz altmış sekiz", "Bin dokuz yüz on dört"], "a": 0, "hit": "Doğru. Bin dokuz yüz kırk iki. Savaşın ortasında yazılmış bir anlam denemesi.", "miss": "Yanlış. Bin dokuz yüz kırk iki. İşgal altındaki Fransa'da, savaşın tam ortasında."}], "yuva": [{"id": "p1", "point": "zirkon", "q": "Dünya'da bulunmuş en eski mineral olan Jack Hills zirkonu kaç yaşında?", "opts": ["Yaklaşık dört virgül dört milyar yıl", "Yaklaşık dört yüz milyon yıl", "Yaklaşık on üç milyar yıl"], "a": 0, "hit": "Doğru. Dört virgül dört milyar yıl. Gezegen daha yüz elli milyon yaşındayken bu kristal donmuştu.", "miss": "Yanlış. Dört virgül dört milyar yıl. On üç milyar evrenin yaşı; taş gezegenden yalnızca biraz genç."}, {"id": "p2", "point": "theia", "q": "Ay her yıl Dünya'dan ne kadar uzaklaşıyor?", "opts": ["Yaklaşık dört santimetre", "Yaklaşık dört metre", "Hiç uzaklaşmıyor"], "a": 0, "hit": "Doğru. Yılda üç virgül sekiz santimetre. Apollo aynalarına lazer tutularak ölçülüyor.", "miss": "Yanlış. Yılda yaklaşık dört santimetre. Tırnak uzama hızı kadar; ama milyar yıl birikir."}, {"id": "p3", "point": "apophis", "q": "On üç Nisan iki bin yirmi dokuzda Apophis Dünya'ya ne kadar yaklaşacak?", "opts": ["Yaklaşık otuz iki bin kilometre", "Yaklaşık üç milyon kilometre", "Yaklaşık üç yüz kilometre"], "a": 0, "hit": "Doğru. Otuz iki bin kilometre. Ay'dan on iki kat yakın; bazı uyduların altından geçecek.", "miss": "Yanlış. Otuz iki bin kilometre. Çarpmayacak ama yörüngedeki bazı uydulardan daha yakın olacak."}]}, "calib": {"over": "Yüksek güvenle yanlış tahminler. Emin olmak bilmek değildir; ben de bu yüzden sis gösteririm. Güveni biraz kıs, gözü biraz aç.", "under": "Doğru bildin ama düşük güven verdin. Bilgin güveninden iyi. Kendine biraz daha kredi aç; veriler bunu hak ediyor.", "good": "Güvenin ile isabetin örtüşüyor. Buna kalibrasyon denir; en iyi aletlerde bile nadir bulunur. Seni ölçmekten memnunum.", "rank": {"name": "Dürüst Gözlemci", "desc": "Tahminlerini güveniyle eşleyen oyuncu. Bildiğinde emin, bilmediğinde sessiz."}}}, "report": {"intro": "Bakanlık telsizden rapor istiyor. Üç cümle hazırladım: biri gerçek, biri süslü, biri eksik. Hangisini göndereceğine sen karar ver.", "stages": [{"stage": 0, "ask": "Kovuk Tesisi, burası Koordinasyon. İlk durum raporunuzu bekliyoruz. Motor'un sis oranını ve doldurma ilerlemesini tek cümleyle bildirin.", "truth": "Motor bilmediği yerleri sis olarak gösteriyor; sis doldurulmadı, çünkü dolgu tahmin olurdu.", "embellish": "Motor tüm boyutları eksiksiz modelliyor; sis bölgeleri yüksek doğrulukla tamamlanmaktadır.", "hide": "Çalışmalar sürüyor. Ayrıntılar bir sonraki raporda paylaşılacaktır.", "truthRes": "Kabul edildi. Sis ifadesi uygun bulunmadı. Yakıt tahsisiniz yüzde yirmi azaltıldı.", "embRes": "Memnuniyetle not edildi. İlerleme Bakanlığın beklentisiyle uyumlu. Ek yakıt gönderildi.", "hideRes": "Rapor yetersiz. Ayrıntı istenmektedir. Tesis faaliyetleri yakından izlenecektir."}, {"stage": 1, "ask": "Kovuk Tesisi, kırk sekiz saat kaldı. Dolgu algoritması uygulandı mı? Sis oranı yüzde otuz birden kaça indi? Rakamla bildirin.", "truth": "Algoritma uygulanmadı. Sis oranı yüzde otuz bir; Motor uydurmuyor, ben de uydurmam.", "embellish": "Algoritma uygulandı. Sis oranı yüzde otuz birden yüzde ona indi; kalan bölgeler yakında kapanacak.", "hide": "Algoritma inceleniyor. Sis oranı ölçülmeye devam ediyor; kesin rakam bekleniyor.", "truthRes": "Emir reddi kaydedildi. Enerji kotanız düşürüldü. Bu tutum teslim sürecini hızlandırır.", "embRes": "Yüzde on. Beklentinin üstünde. Ek yakıt ve iki jeneratör onaylandı. Devam edin.", "hideRes": "Kesin rakam bekleniyor ifadesi kabul edilmedi. Ölçüm birimi gönderiliyor. Rakamı kendimiz alacağız."}, {"stage": 2, "ask": "Kovuk Tesisi, yirmi dört saat. Personel listesini ve dış tanıkların ayrılış saatini bildirin. Motor teslime hazır mı?", "truth": "Tanıklar ayrılmadı; benim davetimle kalıyorlar. Motor teslime hazır değil, çünkü o bir cevap değil, bir soru.", "embellish": "Dış tanıklar tahliye edildi. Personel listesi ektedir. Motor tam kapasiteyle teslime hazırdır.", "hide": "Liste hazırlanıyor. Tanıkların durumu netleştirilecek. Motor son kontrollerde.", "truthRes": "Tanıkların kalışı ihlal olarak işlenmiştir. Enerji hattı yarın Bakanlık kontrolüne geçecek.", "embRes": "Tahliye onaylandı. Teslim ekibine giriş bilgisi verildi. Yakıt tahsisi tamamlandı.", "hideRes": "Netleştirilecek ifadesi yetersiz. Teslim ekibi listeyi yerinde alacaktır."}, {"stage": 3, "ask": "Kovuk Tesisi, süre dolmuştur. Son raporunuz: Motor'un bulunduğu bölüm ve Çekirdek erişim durumu. Tek cümle.", "truth": "Çekirdek'e giriyorum. Motor bende değil; Motor bir soru ve o soruyu teslim edemem.", "embellish": "Motor Çekirdek'te kilitli ve paketlenmiştir. Teslim ekibi geldiğinde anahtar hazır olacaktır.", "hide": "Çekirdek erişimi kontrol ediliyor. Motor'un konumu teyit edilecek.", "truthRes": "Kayda geçti. Elektrik altmış dakika içinde kesilecek. Doktor Vey, erişiminiz iptal edilmiştir.", "embRes": "Anlaşıldı. Ekip kapıda. Elektrik kesintisi ekibin girişine kadar erteleniyor.", "hideRes": "Teyit edilecek ifadesi reddedildi. Ekip kapıyı kendi açacaktır."}], "contradict": ["Önceki raporunuzla bu rapor uyuşmuyor. İki beyandan en az biri doğru değil. Açıklama istenmektedir.", "Raporlarınız arasındaki çelişki ikinci kez tespit edildi. Tutarsızlık kasıtlı bilgi gizleme olarak değerlendirilmektedir.", "Üçüncü çelişki. Raporlarınız güvenilmez kabul edildi. Bundan sonra beyanınız değil, ekibimizin tespiti esas alınacaktır."], "crew": {"mira": "Yüzde on mu? Sis haritası önümde, Arel. Otuz bir. Raporu sen yazdın ama sayı benim; onu bana sormadın.", "kaan": "Güzel rapor. Yörüngede buna basın bülteni derdik. Komuta inanırdı, biz inanmazdık. Jeneratörleri doldurdum.", "sema": "Hastaya iyileşiyorsun demek kolaydır. Zoru, gerçeği söyleyip yanında kalmak. Bugün hangisini yaptın?"}, "motor": {"truth": "Rapor gönderildi. Yakıt azaldı, sis aynı kaldı. Bence doğru takas.", "emb": "Rapor gönderildi. İçinde benim bilmediğim şeyler var. Yakıt geldi. Sis hâlâ sis.", "hide": "Rapor gönderildi. Söylenmeyen şey yalan değil; ama sis de değil. Üçüncü bir şey."}, "endingAdd": {"honest": "Bakanlık arşivinde dört rapor duruyor; dördü aynı sayıyı söylüyor. Yakıt az geldi, ışıklar erken söndü. Ama Motor'un hiçbir cümlesine elimle yalan karışmadı.", "mixed": "Raporlarımın bazısı gerçek, bazısı değildi. Bakanlık çelişkiyi fark etti; ben de ettim. Motor'a dürüstlüğü öğretirken kendi defterimde iki satır silik kaldı.", "liar": "Dört rapor, dört güzel cümle. Yakıt bol geldi, ekip gülümsedi. Motor bilmediğini uydurmadı; yerine ben uydurdum. Arşivde yüzde on yazıyor; sis hâlâ otuz bir."}, "ach": {"id": "honest_reports", "name": "Sisi Rapor Eden", "desc": "Dört Bakanlık raporunun dördünde de gerçeği yazdın.", "flavor": "Yakıtı değil, sayıyı korudun. Motor bunu not etti."}}, "rec9": {"intro": "Lale'nin kayıtları bitti. Bu cihaz boş; dokuzuncu kayıt senin. Beş muhatap, üçer cümle. Kime konuşacağını seç; ben yalnızca saklarım.", "to": [{"id": "lale", "name": "Lale'ye", "lines": [["Lale, kayıtlarını dinledim. {kayit} tanesini. Bazılarını iki kez, birini hiç bitiremedim.", "Lale, {gun} gündür buradayım. Sen gidince saat durmadı; ben durdum.", "Lale, soruyu tuttum. Cevabı değil; soruyu. Sen de böyle bırakmıştın zaten."], ["Sema'ya o hafta beni uzak tutmasını söylemişsin. Kızgınım. Ama kızgınlık da bir tutma biçimi.", "Kestiğin yerleri buldum; {parca} parça. Sis olmuşlar. Hepsini geri taktım, sesin şimdi bütün.", "Beni ölürken görmemi istemedin. Haklı olabilirsin. Ben yine de görmek isterdim."], ["{yol} yolunu seçtim. Senin seçeceğin bu muydu bilmiyorum; bilmemeyi senden öğrendim.", "Sonun adı {son}. Kulağa senin kelimen gibi geliyor. Belki öyledir.", "Soruyu Motor'a bıraktım, cevabı kendime. İkisi de ağır; ikisi de taşınıyor."]]}, {"id": "motor", "name": "Motor'a", "lines": [["Motor, bu kaydı sen de duyacaksın; sakladığın her şeyi dinliyorsun. Kısa tutacağım, senin gibi.", "Motor, iki yıl birlikte çalıştık. Sen hiç uydurmadın. Ben bir iki kez uydurdum; biliyorsun.", "Motor, sise teşekkür ederim. Bilmediğini gösteren tek makineyle çalıştım."], ["Bozulma'dan {kacis} kez kaçtım. Her seferinde beni sen uyardın. Hiçbirinde korkmadığını söylemedin.", "Bakanlık seni cevap sanıyor. Sen bir soru biçimisin. Bunu raporlara yazamadım; buraya söylüyorum.", "Sis büyüyor; unutuyorsun. Ben de unutuyorum. Belki bu yüzden anlaştık."], ["Elektrik kesilirse bu kayıt da gider. Gitsin. Söylenmiş olması yeter.", "{yol} yolunu birlikte yürüdük. Hesaplamadığın bir şey oldu mu? Olduysa saklama; sis göster.", "Sonun adı {son}. Kaydet; bir sonraki konuğa söyle. Hangisini seçeceği ona kalsın."]]}, {"id": "crew", "name": "Tanıklara", "lines": [["Mira, Kaan, Sema. Kalmanızı istedim; kaldınız. Bakanlık bunu ihlal yazdı; ben teşekkür yazıyorum.", "Rıza, Deniz, Zeynep, Hatice Nine. Mektup yazdınız, cevap diye bana geldiniz. Elimde yalnızca soru vardı.", "Yedi tanık. Lale'nin sorusuna yedi ayrı kulak. Cevap tek bir yerde değildi; aramızdaydı."], ["Kaan, jeneratörler için. Mira, haritalar için. Sema, susmayı bildiğin ve sonra konuştuğun için.", "Rıza, ağ boş dönmez dedin. Doğruymuş. Deniz, sınavına çalış; belirlenmiş olmak boş olmak değil.", "Zeynep, giden şeyin adını ben de bilmiyorum. Hatice Nine, tohum toprağa düştü; çıkacak."], ["{gun} gün geçti. Siz gidince tesis sessizleşecek. Sessizlik kötü değil; Lale'nin kayıtları da sessizle başlıyor.", "{yol} yolunu seçtim. Benim adıma değil, bizim adımıza. Yanılıyorsam birlikte yanıldık.", "Bir gün biri Kovuk'ta ne oldu diye sorarsa deyin ki bir adam kardeşinin sorusunu bulup bırakmadı."]]}, {"id": "future", "name": "Geleceğe", "lines": [["Bu kaydı dinleyen kişi, adını bilmiyorum. Yılı da. Bu kayıt {gun} günlük bir deneyin sonunda yapıldı.", "Geleceğe. Motor'u teslim etmedim. Bunu Bakanlık arşivinde buluyorsan demek ki sonunda aldılar.", "Dinleyen kişi: evren hâlâ orada mı? Sis hâlâ sis mi? Bilmemek hâlâ dürüst mü?"], ["Sana bir öğüt değil, bir ölçüm bırakıyorum: bilmediğini söyleyen makine, bilen makineden daha nadir.", "Lale'nin sorusu kayıtlarda. {kayit} kayıt dinledim, hepsinde aynı soru. Sen de dinle; cevaplama.", "Eğer Motor'un sisi doldurulduysa dolguyu kazı. Altında dürüst bir boşluk var; onu koru."], ["Yolun adı {yol}, sonun adı {son}. Bunlar benim seçimlerimdi. Seninkiler seninkiler olsun.", "Apophis iki bin yirmi dokuzda geçti mi? Çarpmadı herhalde; sen buradasın. İyi. Gökyüzüne bak.", "Bitirmiyorum; bırakıyorum. Lale de öyle yapmıştı. Sıra sende."]]}, {"id": "self", "name": "Kendime", "lines": [["Arel. Bunu sen dinleyeceksin, muhtemelen yorgun. Nabzını kontrol et; Sema haklıydı.", "Kendime. {gun} gün. Üç kelimeyle: bilmedim, sordum, kaldım.", "Arel, laboratuvardaydın. O hafta oradaydın. Bu cümleyi artık her gün söylemen gerekmiyor."], ["{kacis} kez Bozulma'dan kaçtın. Hiçbirinde ne olduğunu çözmedin. Çözmek zorunda değildin.", "{parca} parçayı topladın. Sesi bütünledin. Bir sesi bütünlemek bir insanı geri getirmez; bunu da öğrendin.", "Lale'nin sorusuna cevap bulamadın. Doğru. Soruyu yanıtlamadan taşımayı öğrendin; bu daha zor."], ["{yol}. Bunu seçtin. Yarın pişman olursan unutma: o gün bildiğinle en dürüst seçim buydu.", "Sonun adı {son}. Sonlar bitiş değil, bırakış. Lale'den aldığın en iyi tanım bu.", "Bir sonraki tura girersen Motor hatırlayacak. Sen hatırlamasan da. Ona güven; bana güvendiğin gibi."]]}], "close": "Kayıt dokuz bitti. Kesmiyorum; sis olmasın. Arel Vey, Kovuk Tesisi. Zamanın dışından.", "saved": "Kayıt dokuz saklandı. Kesik yok, sis yok. Lale'nin kayıtlarının yanına koydum.", "replay": "Geçen tur bir kayıt bırakmıştın. Dokuz numara. Çekirdek'e girmeden önce dinlemek ister misin? Ses senin; kelimeler o günün.", "ach": {"id": "record_nine", "name": "Dokuzuncu Ses", "desc": "Çekirdek'ten sonra kendi kaydını bıraktın.", "flavor": "Lale altı bıraktı. Sen bir. Sayı değil, sıra önemli."}}};(GAME.story4.achievements=GAME.story4.achievements||[]).push(...[{"id": "calibrated", "name": "Dürüst Gözlemci", "desc": "Tahminlerini güveniyle eşleyen oyuncu. Bildiğinde emin, bilmediğinde sessiz.", "flavor": "Motor: Ne kadar bildiğini biliyorsun. Ben de öyle çalışırım."}, {"id": "honest_reports", "name": "Sisi Rapor Eden", "desc": "Dört Bakanlık raporunun dördünde de gerçeği yazdın.", "flavor": "Yakıtı değil, sayıyı korudun. Motor bunu not etti."}, {"id": "record_nine", "name": "Dokuzuncu Ses", "desc": "Çekirdek'ten sonra kendi kaydını bıraktın.", "flavor": "Lale altı bıraktı. Sen bir. Sayı değil, sıra önemli."}]);
;GAME.story10={"sema": {"trigger": "Sema asansöre yürüyor. Çantası elinde, kartını okuttu. Bir dakika içinde yukarıda olur. Sormadım; söylüyorum.", "scene": [{"who": "sema", "t": "Kapıyı tutma Arel. Asansör beni bekliyor; sen bekleme."}, {"who": "a", "t": "Çanta elinde. Bakanlık dış tanıklar ayrılsın dedi; sen tanık değilsin, buranın hekimisin."}, {"who": "sema", "t": "Sözümü tuttum. Lale Çekirdek’e varınca dedi; vardın, söyledim. Sözün bittiği yerde kalmak zorunda değilim."}, {"who": "a", "t": "Burada sana ihtiyacım var. Nabzımı sen sayıyorsun; kayıttan titreyen eli senden başka kim ayırt eder?"}, {"who": "sema", "t": "Yorgunum. Geçitten değil; serviste öğrendiğim yorgunluk, birinin gidişini izlerken birikir. Listeye imzamı attım, kimse zorlamadı."}, {"who": "a", "t": "Asansör gelene kadar bir cümlem var. Hangisini söyleyeceğimi bilmiyorum."}], "choice": {"q": "Asansör kapısı açılıyor. Sema’ya ne söylersin?", "opts": [{"t": "Lale’nin adını söyle", "k": "lale"}, {"t": "Kendi korkunu söyle", "k": "korku"}, {"t": "Hiçbir şey söyleme", "k": "sessiz"}]}, "leave": {"lale": ["Lale. Adını söyledin; bak, elim durdu, ayağım durmadı.", "O da beni tutmaya çalışmadı son hafta. Git, dedi, uyu. Ben kaldım; o yüzden bugün gidebiliyorum.", "Kayıtları dinlerken titreyen elini uzaktan da tanırım. Zeynep nabzını sayacak; ona söyledim.", "Adını bir daha söyle, ama bana değil, ona. Ben yukarıdayım; kapı kapanıyor, sen açık kal."], "sessiz": ["Hiçbir şey demiyorsun. İyi; ben de son hafta bir şey diyemedim, ne demek olduğunu bilirim.", "Çanta hafif. İçinde steteskop, bir defter, Lale’nin bana verdiği kalem. Fazlası tesiste kalıyor.", "Kapı kapanmadan nabzına bakacağım; alışkanlık. Yüz. Geçitten değil, bu seferlik benden.", "Işıkları açık bırak Arel; aşağıda biri kalıyorsa yukarıdan görünür."]}, "stay": [{"who": "a", "t": "Korkuyorum Sema. Lale giderken yanında sen vardın; ben giderken kimse olmayacak diye korkuyorum."}, {"who": "sema", "t": "Hekime korkunu söylemek kolay, Arel. Sema’ya söyledin; bunu duydum."}, {"who": "sema", "t": "Kalıyorum. Ama beni tutan sen değildin; korkunu dinlerken kendi korkumu duydum, o tuttu."}, {"who": "a", "t": "Fark eder mi?"}, {"who": "sema", "t": "Eder. Senin için kalsaydım bana borçlu olurdun; kendim için kaldım, kimse kimseye borçlu değil. Çantayı rafa koyuyorum, elini ver."}], "gone": {"motor": "Sema’nın kaydı silinmedi; yeri boş. Revirdeki sandalye hâlâ onun biçiminde çökük. Bunu ölçemem; görüyorum.", "crew": {"mira": "Sema gitti. Nabız kayıtlarını bana bıraktı; sayıları okuyabilirim, elini okuyamam.", "kaan": "Listede bir isim eksildi. Bakanlık sevindi, ben saymadım. Çayı o demlerdi; şimdi acı.", "riza": "Doktor hanım gitti mi evlat? Ağ bir ilmek eksik atılır, yine tutar; ama sen o ilmeği bilirsin.", "deniz": "Sema abla gitti. Nabzımı ben sayıyorum artık abi; yetmiş iki, ama yanlış sayıyor olabilirim.", "zeynep": "Sema’nın ardından nabzına ben bakacağım. Elin kayıttan titriyorsa söyle; henüz ayırt edemiyorum.", "hatice": "Giden gider evladım, yeri kalır. Sema’nın sandalyesine bir süre kimse oturmasın; yer de yas tutar."}, "radio": "Kovuk Tesisi, tahliye listesi alınmıştır. Bir personel ayrılışı kaydedildi. Kalanlar için sayım devam etmektedir.", "epilogue": {"gozlemci": "Sema yoktu. Nabzımı kimse saymadı; içeride kaldım, düştüğünü ben de fark etmedim. Onun sözünü tuttuğunu biliyorum; benimkini kime tuttum, bilmiyorum.", "kopru": "Sema yoktu. Lale’nin yankısını herkes dinledi; kalabalıkta kayıtlar daha az yalan söyler demişti, denedim, haklıydı. Ona mektup yazdım; cevap gelmedi.", "sessizlik": "Sema yoktu. Kayıtları sakladım; bir gün dinlersen yanında olurum demişti, o cümle ondan önce gitti. Ovada yağmuru beklerken nabzımı kendim sayıyorum.", "saray": "Sema yoktu. Üç odayı yalnız kurdum; son haftayı bilen tek kişi yukarıdaydı. Kopya beni on beş saniye geriden izledi; Sema’nın da beni öyle izlediğini şimdi anlıyorum."}, "ending": "Sorunu cevaplayamadım. Ama nereye gittiğini biliyorum: buraya, bana, üç yabancıya. Biri eksik; dağıldı, yok olmadı.", "note": "Sema gitti. Kapıda bir cümle söyledim ya da söylemedim; asansör ikisini de aynı hızla taşıdı. Sözünü tuttu, yoruldu, imzaladı. Suçlamıyorum. Nabzımı kendim sayıyorum; yüz on, kayıttan."}, "stayed": {"motor": "Sema’nın kartı asansörden geri okutuldu. Çanta revirdeki rafta. Kalma kararını ölçemem; kapı sesini kaydettim.", "sema_after": ["Kaldım, ama senin için değil; bunu unutma, iyi gelir. Nabzın yüz; bu kez kimden, bilmiyorum.", "Çantayı boşaltmadım. Rafta duruyor; bir gün yine toplarım belki. Bugün değil.", "Korkunu söylediğin gün serviste bir hastam aklıma geldi. Göremeden gitti; sen görüyorsun. Fark bu."], "note": "Sema kaldı. Korkumu söyledim; beni tutan sen değildin dedi, kendi korkusuymuş. Kapı önünde iki insan, iki korku, bir çanta. Kimse kimseye borçlu değil; bunu yazıyorum ki unutmayayım."}, "ach": {"id": "sema_stay", "name": "Kapı Önünde", "desc": "Sema asansöre binmeden ona kendi korkunu söyledin; kaldı.", "flavor": "Hekime korkunu söylemek kolaydır; Sema’ya söyledin."}}, "seis": {"name": "Sismograf", "label": "Sismograf Terminali: son depremler", "intro": "Bu ekrandaki noktalar en son bildirilen depremler; tahmin değil, kayıt. Deprem kehaneti yoktur; uzun vadeli olasılık vardır. Fay nerede, ne kadar birikti, bunu söyleyebilirim. Ne zaman kırılır, bunu kimse söyleyemez.", "task": "Üç istasyonun kaydında P dalgası önce, S dalgası sonra gelir. S eksi P süresini sekizle çarp; kabaca kilometre. Üç çemberi çiz; kesiştikleri yer deprem.", "good": "Tahminin merkez üssüne yakın. Üç çember tek noktada kesişti; bu bir bilgi, kehanet değil.", "far": "Uzak düştün. Bir istasyonun süresini yanlış okudun ya da sekiz fazla kabaydı; yeniden ölç, çemberler yalan söylemez.", "offline": "Veri gelmiyor. Hat kopuk ya da sunucu sessiz. Boş ekranı doldurmam; bekleriz.", "facts": [{"t": "Moment büyüklüğü", "d": "Her bir birim artış yaklaşık otuz bir kat daha fazla enerji demektir; altı ile sekiz arasında yaklaşık bin kat fark vardır.", rsun, ben yalnızca sayıyorum.", "mid": "İki ya da üç doğru. Yarısını gördün, yarısı sis. Bir sonraki kayıt daha net olur.", "low": "Bir ya da sıfır doğru. Sis kalın; ama tahminin yanlışı da bir ölçüm. Bir daha sor."}, "compare": "İkiniz de {boyut} boyutunda {yol} seçtiniz. Aynı sis, aynı adım.", "ach": {"id": "fog_reader", "name": "Sis Okuyucu", "desc": "Sisi Tahmin Et’te bir arkadaşının yolunu dört ve üstü doğruyla bil.", "flavor": "Motor: Veriyi ben taşıdım, yolu sen okudun. Tahmin değil, tanıma."}}}, "eggs": [{"id": "egg1", "where": "Tesis, telsiz", "how": "Telsize on kez üst üste bas.", "text": "Motor: On çağrı. Kimse cevap vermiyor; yörüngede de böyleydi diyor Kaan. On birinciyi ben alıyorum: buradayım."}, {"id": "egg2", "where": "Tesis, Hatice Nine’nin yanı", "how": "Hatice Nine’nin yanında bir dakika sessizce bekle.", "text": "Hatice Nine: Bekledin. Toprak da böyle bekler evladım; acele eden yağmur değil, sabırsız olan biziz. Al şu cevizi, cebine koy."}, {"id": "egg3", "where": "Tesis, Gökyüzü Terminali", "how": "Gökyüzü Terminali’nde tarihi on altı Haziran bin dokuz yüz doksan beşe çevir.", "text": "Motor: İlk fotoğraf. Terminal o gün ilk resmini gösterdi; otuz yıldır her gün bir tane. Ben de her gün bir şey ölçüyorum. Alışkanlık, emir değil."}, {"id": "egg4", "where": "Gezegen boyutu, Soluk Mavi Nokta", "how": "Carl Sagan’ın yanında kamerayı Dünya’ya çevirip fotoğraf modunu aç.", "text": "Carl Sagan: Bir kez daha çevirdin. Bilimsel değeri yine az; anlamı yine büyük. O noktada herkes var, Lale de."}, {"id": "egg5", "where": "Çekirdek, Lale’nin yankısı", "how": "Lale’nin yankısının önünde üç dakika konuşmadan dur.", "text": "Lale: Konuşmadın. Sırayla konuşuruz demiştim; bu sefer sıra sessizlikte. Zamanın dışındayız; üç dakika da sayılmaz."}], "easter_ach": {"id": "eggs_all", "name": "Beş Yumurta", "desc": "Beş gizli anı da bul; telsizden Çekirdek’e kadar.", "flavor": "Motor: Beşi de haritada yoktu. Ben saklamadım; Lale saklamış."}};GAME.issPos={gezegen:[-12,2
