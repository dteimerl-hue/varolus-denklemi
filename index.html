  idle:["Üç gün. Sonra iki. Sayıyorum.", "Geçide girmeden nefes al. İlk sefer mideyi bozar."]},
 sema:{name:"Dr. Sema Kaya",role:"anesteziyolog · tesis hekimi",hex:"#c9abff",look:{hair:0x1a1210,hairStyle:'long',skin:0xcfa08a,glasses:true,top:{style:'coat',color:'#cdd1da',accent:'#c9abff',collar:'#2a3a5a'},pants:0x2a3a5a},
  start:["Lale’yi son haftalarında ben izledim. Hafızası parça parça giderken bile sorusu netti.", "O hafta sana söylenmeyen bir şey var. Lale ‘Çekirdek’e varınca’ dedi. Sözümü tutuyorum.", {"c": "Lale’nin yankısını Motor’da tutman etik mi?", "ch": [{"t": "O bir kayıt, bir insan değil. Tutacağım.", "res": "“Kayıtlar da yalan söyler, Arel. Hele kesilmişlerse.”", "path": "gozlemci"}, {"t": "Belki bırakmalıyım.", "res": "“Bırakmak da bir cevap. Ama önce altısını da dinle.”", "path": "sessizlik"}]}],
  after:{bilinc:["Nil’le konuşmuşsun. Mikrotübül çalışması ilginç ama kuantum bilinci kanıtlamıyor; iyi ki abartmadın."],anlam:["Uçan Adam’ı bana da anlattı Lale, bir gece nöbette. Bin yıllık soru hâlâ serviste dolaşıyor."],baslangic:["Bilmemek, başlamaktır. Lale MR’ına ilk baktığı gün tam bu cümleyi kurdu."],kuantum:["Dekoherans tek sonucu açıklamıyor demişsin. Anestezi de öyle: nerede kapandığını biliyoruz, neden kapandığını değil."],gezegen:["Potansiyel biyoimza ile kanıt arasındaki fark, tıpta semptom ile tanı arasındaki fark. Aynı disiplin."],yuva:["Theia çarpışmasından Ay doğmuş. Kayıptan doğan şeyler de ışık verir, Lale öyle derdi."]},
  idle:["Nabzın yüksek. Geçitler değil, kayıtlar yoruyor seni.", "Lale onları senin için bıraktı. Sırayla dinle."]},
 riza:{name:"Rıza",role:"61 · Karaköy'de balıkçı",hex:"#6fb6ff",look:{hair:0x8a8a8a,hairStyle:'short',beard:0x9a9a9a,skin:0xb98f72,cap:'#1a2a3a',top:{style:'vest',color:'#2a4a6a',accent:'#17283a'},pants:0x3a3a44},
  start:["Hoş geldin evlat. Mektup geldi, ‘ablam sizi sormuş’ diyordu. Deniz kokmayan bir yere ilk kez indim.", "Kırk yıl ağ attım. Deniz beni hiç hatırlamayacak. Bir ömür iz bırakmadan silinir mi sence?", {"c": "Cevabı sen de bilmiyor musun, evlat?", "ch": [{"t": "Bilmiyorum. Ama beraber bakabiliriz.", "res": "“Bilmeyen bir profesör. Sevdim.”", "path": "kopru"}, {"t": "Önce ölçmem gerek.", "res": "“Balık da ölçülür ama tadı başka. Git ölç.”", "path": "gozlemci"}]}],
  after:{baslangic:["Demek hamurdaki su, evrenin ilk dakikalarından kalma. Bu sabah ağ çekerken suya başka baktım."],kuantum:["Teknedeki GPS her gün Einstein'ın hesabıyla düzeltiliyormuş. Bilim dediğin yanı başımdaymış meğer."],gezegen:["Şu Soluk Mavi Nokta fotoğrafı var ya… Europa'da su arıyoruz, Haliç'i kirletiyoruz. Kahvede imza toplamaya başladım."],bilinc:["Anılar her hatırlayışta yeniden kuruluyormuş. Babamın sesini hatırlamaya çalışırken belki ben de onu yeniden yazıyorum."],anlam:["Anlam keşfedilmiyor, kuruluyor dedin. Ben de ağımı her sabah yeniden örüyorum. Belki iz dediğin budur."],yuva:["Şafaktan önce ISS geçti üstümden, sessiz bir yıldız gibi. 2029'da Apophis'i görmek için torunlarla açığa çıkacağız."]},
  idle:["Dalgalar kaç milyar yıldır kıyıya vuruyor, hesapladın mı?", "Sen gez evlat, ben buradayım. Ağ bekler gibi."]},
 deniz:{name:"Deniz",role:"17 · Kadıköy'de lise öğrencisi",hex:"#93e3a0",look:{hair:0x2a1a12,hairStyle:'curly',skin:0xd9b39a,top:{style:'jacket',color:'#1f4a3a',accent:'#93e3a0',collar:'#153a2c'},pants:0x2a2a44,shoes:0xdddddd},
  start:["Selam. Lale Hoca annemin doktoruydu; bana bir soru sormuştu, cevabını hâlâ bulamadım.", "Fizikte her şey yasalarla belirleniyorsa sınava çalışmanın ne anlamı var? Zaten olacak olan olacak.", {"c": "Sen de belirlenmiş misin, Arel abi?", "ch": [{"t": "Belki. Ama belirlenmiş olmak, anlamsız olmak değil.", "res": "“Not aldım. Sınav sorusu gibi.”", "path": "kopru"}, {"t": "Motor’a soralım.", "res": "“Motor beni tahmin edebiliyorsa onu şaşırtmak istiyorum.”", "path": "gozlemci"}]}],
  after:{baslangic:["En iyi kozmologlar bile Planck zamanı için 'bilmiyoruz' diyor. Ezberlemeyi bıraktım, soru sormaya başladım."],kuantum:["Simülasyonda mıyız diye uyuyamıyordum. Bostrom'unki kanıt değil, bir üçlemmiş. Kaygı gitti, merak geldi."],gezegen:["Transit derinliğini hesapladım: 84 ppm. Dünya kadar bir gezegen bir yıldızı bu kadar karartıyormuş."],bilinc:["İradem zayıf diye kendimi suçluyordum. Alışkanlık 66 günde oturuyormuş; telefonu başka odaya koydum."],anlam:["Kierkegaard sıçramak gerek diyor, sen harita çıkar diyorsun. İkisini de yapacağım galiba."],yuva:["ISS günde 16 gün doğumu görüyor. Ben bir tanesini bile kaçırmamalıyım."]},
  idle:["Çoklu Dünyalar’da başka bir Deniz sınavı kazandı mı?", "Bir soru daha sorsam? Lale Hoca hep ‘sor’ derdi."]},
 zeynep:{name:"Zeynep",role:"34 · Ankara'da yoğun bakım hemşiresi",hex:"#ff7cb9",look:{hair:0x1a1210,hairStyle:'bun',skin:0xcfa08a,top:{style:'scrubs',color:'#5a2a4a',accent:'#ff7cb9',sleeves:'short'},pants:0x5a2a4a},
  start:["Merhaba, ben Zeynep. Yoğun bakım hemşiresiyim. Ablanı tanımadım; ona bir mektup yazmıştım, cevabı seninle gelmiş.", "Hastalar son nefesini verirken bir şeyin gittiğini hissediyorum. Kimse bana o şeyin ne olduğunu söyleyemiyor.", {"c": "Sen oradaydın mı, Arel? Son nefesinde?", "ch": [{"t": "Hayır. Laboratuvardaydım.", "res": "Zeynep başını eğiyor: “Çoğu kardeş orada olamaz. Her gün görüyorum.”", "path": "sessizlik"}, {"t": "Bunu konuşmak istemiyorum.", "res": "“Tamam. Ama o soru da sisin içinde kalır.”", "path": "gozlemci"}]}],
  after:{baslangic:["Bu ışık 13,8 milyar yıldır yoldaymış. Nöbette pencereden bakınca artık başka görüyorum."],kuantum:["Bilgi fizikselmiş. Belki giden şey yok olmuyor, dağılıyor."],gezegen:["'Potansiyel biyoimza' ile 'yaşam bulundu' arasındaki farkı öğrendim. Sağlık haberlerini de öyle okuyorum artık: kim, nasıl doğruladı?"],bilinc:["Nöbet öncesi hızlanan kalbimi felaket sanırdım. Algı bir tahminmiş; şimdi 'hazırlanıyorum' diyorum."],anlam:["Bir hastanın elini tutarken anladım: anlam orada, iki insanın arasında kuruluyor."],yuva:["Uzayda kemik ayda yüzde bir eriyormuş. Beden hep bedel hesaplıyor; yatan hastalarımda da öyle."]},
  idle:["Sen de yorgun görünüyorsun Arel.", "Lale’yi tanımak isterdim. Belki kayıtlardan tanırım."]},
 hatice:{name:"Hatice Nine",role:"82 · Konya Ovası'nda çiftçi",hex:"#f3c870",look:{hair:false,scarf:0xcfc4ae,skin:0xb98f72,top:{style:'coat',color:'#5a4a2a',accent:'#f3c870',collar:'#4a3a1a',lapel:'#6a5a3a'},pants:0x3a3028,cane:true},
  start:["Gel bakayım evladım. Toprak çatladı, yağmur gelmedi. Ablan bir yaz köye gelmişti; sorularımı deftere yazdı.", "Bunca emeğin, torunlara kalacak dünyanın bir değeri var mı hâlâ?", {"c": "Sen hiç tohum ektin mi, evladım?", "ch": [{"t": "Hayır. Hep denklem.", "res": "“Denklem de tohumdur. Ama sulamak lazım.”", "path": "kopru"}, {"t": "Lale ekerdi; ben izlerdim.", "res": "“İzlemek de iştir. Ama bir gün elini toprağa sok.”", "path": "sessizlik"}]}],
  after:{baslangic:["Unun karbonu ölmüş yıldızlardanmış. Tandırdan ekmeği çıkarırken torunuma dedim: bu somun 13,8 milyar yaşında."],kuantum:["Zaman her yerde kendi hızında akarmış. Benim ovada da öyle, şehirde de."],gezegen:["Mars'ta suyun izi var, kendisi yok. Toprağın kıymetini bilen biz olduk demek."],bilinc:["Beyin bir hikâye anlatırmış kendine. Benim hikâyem toprakla başladı, toprakla biter."],anlam:["Meyvesini göremeyeceğim bir ceviz diktim. Anlam, toprağa verilen sözmüş."],yuva:["Mars'ta çuval hafifler ama suyu yok, perklorat var. Köyde damla sulama için ilk imzayı ben attım."]},
  idle:["Otur biraz, yorulma.", "Bu ışıklı taşlar ne evladım? Ablanın mı?"]},
 lale:{name:"Lale",role:"Yankı · 42 · nörolog",hex:"#ffffff",look:{hair:0x2a1a22,hairStyle:'long',skin:0xd9b39a,top:{style:'coat',color:'#b9aee0',accent:'#e0d8ff',collar:'#c9abff',lapel:'#d0c8e8'},pants:0x3a2a5a},
  start:["Arel. Beni Motor’da yeniden kurdun, biliyorum. Ya da ben seni. Sırayla konuşuruz.", "Baktığının ben mi, hatıran mı olduğunu bilemezsin. Ben de bilemem. Yine de geldiğine sevindim.", "Altı kayıt bıraktım. Bazı yerleri kestim; kestiklerim sis oldu. Sonuncusunu Çekirdek’te dinle."],
  idle:["Sisten korkma. Orası benim unuttuğum yerler.", "Acele etme. Zamanın dışındayız."]}
},

 points:[
  {id:"planck",name:"Planck Eşiği",stage:"foam",pos:[-22,6],say:["Burada uzunluklar 10⁻³⁵ metrenin altına iniyor ve geometri köpürüyor. Genel görelilik ile kuantum mekaniği aynı masaya oturamıyor; iki yıldır ben de oturamıyorum.", "Bir bilim insanının kurabileceği en dürüst cümle: bilmiyorum. Lale bunu MR’ına bakarken söyledi; ben hâlâ öğreniyorum."],fact:{t:"Planck zamanı",d:"t ≈ 5,4×10⁻⁴⁴ s; bu eşiğin altında bilinen fizik yasaları geçerliliğini yitirir.",src:"CODATA 2018"}},
  {id:"cmb",name:"İlk Işık",stage:"cmb",pos:[20,-4],say:["380 bin yaşındaki evren. Sıcaklık 3000 kelvine düştü, elektronlar protonlara yerleşti ve ışık ilk kez serbest kaldı.", "O ışık 13,8 milyar yıldır yolda; bugün 2,7 kelvinlik mikrodalga olarak ulaşıyor. Gökyüzünün bebeklik fotoğrafı: giden hiçbir şey tamamen gitmiyor, soğuyor."],fact:{t:"Kozmik termometre",d:"CMB sıcaklığı 2,7255 ± 0,0006 K; doğada ölçülmüş en kusursuz kara cisim eğrilerinden biri.",src:"NASA COBE/FIRAS (Fixsen 2009)"}},
  {id:"stars",name:"Karanlık Çağın Sonu",stage:"stars",pos:[-4,-26],say:["Karanlık madde görünmez kuyular kazdı, gaz içine düştü, sıkıştı ve tutuştu. İlk yıldızlar karanlığın içinden doğdu.", "JWST, Büyük Patlama’dan yalnızca 300 milyon yıl sonra parlayan galaksileri doğruladı. Beklediğimizden erken, beklediğimizden parlak. Karanlık, boş demek değil."],fact:{t:"En erken galaksiler",d:"JWST z ≈ 14'te, Büyük Patlama'dan ~300 milyon yıl sonra parlayan galaksileri spektroskopik olarak doğruladı.",src:"NASA/ESA/CSA JWST (JADES, MoM)"}}],
 figures:[
  {id:"lemaitre",name:"Georges Lemaître",role:"1894–1966 · rahip ve kozmolog",hex:"#ffd36b",pos:[12,14],wander:3,look:{hair:0x9a9a9a,hairStyle:'bald',glasses:true,skin:0xe0c0a8,top:{style:'coat',color:'#1a1a1a',accent:'#ffd36b',collar:'#cfcfcf',lapel:'#2a2a2a'},pants:0x1a1a1a},stage:"inflation",
   dialog:[{"who": "f", "t": "1927’de denklemler bana galaksilerin uzaklaştığını söyledi. Genişleyen bir evren geçmişte daha küçüktü; başlangıcı olan bir evren."},{"who": "a", "t": "Siz ‘ilkel atom’ dediniz; biz Büyük Patlama diyoruz ve enflasyon dönemi için 60 e-katlanma hesaplıyoruz. Motor o dönemi sis gösteriyor."},{"who": "f", "t": "Fizik nereden geldiğimizi söyler, neden geldiğimizi değil. İkisini karıştırmamaya ömrümü verdim."},{"who": "a", "t": "Ben karıştırdım sanırım. Kız kardeşimin ‘neden’ini bir denklemde arıyorum."}]},
  {id:"hubble",name:"Edwin Hubble",role:"1889–1953 · astronom",hex:"#7fd6ff",pos:[-14,-12],wander:3,look:{hair:0x3a2a22,hairStyle:'short',skin:0xd9b39a,top:{style:'jacket',color:'#2a2a3a',accent:'#7fd6ff',collar:'#1a1a2a'},pants:0x2a2a3a},stage:"andromeda",
   dialog:[{"who": "f", "t": "1923, Mount Wilson. Andromeda plakasında nova sandığım nokta bir Sefeid değişeniydi; üstüne ‘VAR!’ yazdım."},{"who": "a", "t": "Leavitt’in periyot-parlaklık ilişkisi onu bir mezuraya çevirdi. Andromeda’nın Samanyolu’nun dışında olduğunu böyle kanıtladınız."},{"who": "f", "t": "Sarmal bulutsular birer ada evrenmiş. Evren bir gecede yüz kat büyüdü; ben küçüldüm."},{"who": "a", "t": "Bugün uzaklığını 2,5 milyon ışık yılı ölçüyoruz. Bize yaklaşıyor; ama 2025’teki bir analiz 10 milyar yılda çarpışma olasılığını yalnızca yüzde 50 buldu. Kesin sandığımız kayıplar bile belki.", "src": "Sawala vd., Nature Astronomy (2025)"}]}],
 logs:[{id:"log",pos:[-26,-14],lines:["Kayıt bir. Arel, bunu dinliyorsan Motor çalışıyor demektir. Ya da ben hâlâ hayal kuruyorum; ikisi de olur.", "Bugün hafızamdan bir parça daha gitti. Hangi parça, bilmiyorum. Bir defter açtım: unutmadan önce insanların bana sorduğu soruları yazıyorum."]}],
 glitches:[[-30,24],[28,-26]],
 question:{q:"CMB bugün 2,7255 K. Işığın serbest kaldığı z ≈ 1089 anında sıcaklık neydi? (T = T₀(1+z))",opts:["≈ 2970 K","≈ 1089 K","≈ 300 K"],a:0,exp:"2,7255 × 1090 ≈ 2971 K. Genişleme dalga boyunu 1+z kat uzatır."},
 title:"İlk ışığı dinle",arrive:"İlk ışıktan önce. Lale, buradan başlıyorum; en başından.",glitchThought:"Sis. Motor burada bilmiyor; ben de bilmiyorum. İlk kez aynı cümleyi kuruyoruz.",
 insight:"Evren bir anda verilmiş bir hediye değil; yüz binde birlik bir titreşimin 13,8 milyar yılda bu soruyu soran bir beyne dönüşmesidir, ve bilmemek o yolun ilk adımıdır."},

{id:"kuantum",name:"Kuantum Geçidi",sub:"Dalgalar, dolanıklık, solucan delikleri",hex:"#7fd6ff",loc:"olasılık genliklerinin ülkesi",spawn:[0,26],
 world:{ground:{seed:21,c1:"#1a3a58",c2:"#224a6e",c3:"#2e5e86",r:52,h:.6,water:-1.2,waterC:0x0f3a5a,ridge:3,c4:"#dfe9f6",rough:.55},atmo:{top:"#02060e",hor:"#0c2a44",sun:"#bfe0ff"},light:{sky:"#6fc0ee",ground:"#06101c",hemi:1,sun:"#d8ecff",sunI:1.2,dir:[35,30,-45]},fog:{c:"#050b14",n:40,f:160},rim:{color:"#c9abff",i:.8},grade:{sat:1.1,vig:.6,grain:.025,con:1.1},dust:"#bfe9ff",
  sky:{world:"kuantum",stage:"slit",pos:[0,18,-120],scale:1.3},props:[{type:"ice",n:18,min:8,max:44,solid:1.1},{type:"crystal",n:14,hex:"#7fd6ff",min:8,max:42,s0:.5,s1:1.2},{type:"grass",n:20,hex:"#bfe9ff",min:5,max:40}]},
 points:[
  {id:"slit",name:"Çift Yarık",stage:"slit",pos:[-20,8],say:["Elektronlar tek tek geliyor; her biri ekranda tek bir nokta. Binlercesi birikince saçaklar beliriyor: tek başına anlamsız, birlikte desen.", "Hangi yarıktan geçtiğini öğrenmek için dedektör koyarsam desen siliniyor. Lale’ye bakmanın bedeli de bu: baktıkça onu değiştiriyorum."],fact:{t:"Tek elektron girişimi",d:"Elektronlar tek tek gönderildiğinde girişim deseni nokta nokta oluşur.",src:"Tonomura vd., Am. J. Phys. (1989)"}},
  {id:"tunnel",name:"Tünelleme Duvarı",stage:"tunnel",pos:[18,10],say:["Dalga paketi duvara çarpıyor; klasik fizikte geri dönerdi. Küçük bir kısmı öbür tarafta beliriyor. Güneş bu sayede yanıyor; aşılmaz duvarların da sızıntısı var.", "Sezyum deneyinde ışık darbesi ‘erken’ çıkmış gibi göründü. Bilgi ışıktan hızlı gitmedi; darbenin şekli yeniden biçimlendi. Hatıralar da öyle: erken gelmiş gibi görünür, aslında yeniden biçimlenmiştir."],fact:{t:"Hızlı ışık, yavaş bilgi",d:"Sezyum buharında grup hızı negatif görünen darbe ölçüldü; bilginin ışıktan hızlı gitmediği 2003'te doğrudan gösterildi.",src:"Wang vd., Nature (2000); Stenner vd., Nature (2003)"}},
  {id:"lattice",name:"Simülasyon Kafesi",stage:"lattice",pos:[22,-16],say:["Gökyüzü bir devre kartı gibi. Bostrom’un üçlemi: ya uygarlıklar simülasyona ulaşamadan yok oluyor, ya ilgi duymuyor, ya da biz içindeyiz. Kanıt değil, olasılık ağacı; Deniz bunu duyunca rahat uyudu.", "Bekenstein’a göre bir bölgenin taşıyabileceği bilgi sonludur ve yüzeyiyle büyür. Bilgi fiziksel; demek ki Lale’nin silinen anıları da bir yere gitti, hiçliğe değil."],fact:{t:"Bilginin enerji bedeli",d:"Tek bir bitin silinmesinde harcanan ısının Landauer sınırına (kT ln2) yaklaştığı deneysel olarak gösterildi.",src:"Bérut vd., Nature 483, 187 (2012)"}},
  {id:"bh",name:"Olay Ufku",stage:"blackhole",pos:[0,-24],dilate:true,say:["Yığılma diski ufkun çevresinde dönüyor. Uzaktan bakan için benim her saniyem uzuyor. Burada bir saat, tesiste yedi yıl: Lale’nin son haftası bana böyle geçti, uzaktan.", "Cebimdeki telefon da aynı denklemi kullanıyor: GPS saatleri günde 38 mikrosaniye ileri gider. Büyük ve küçük, aynı yasa; kayıp da öyle."],fact:{t:"Kara delik gölgeleri",d:"EHT, M87*'i (2019) ve Sgr A*'yı (2022) görüntüledi.",src:"EHT Collaboration, ApJL (2019, 2022)"}}],
 figures:[
  {id:"wheeler",name:"John Wheeler",role:"1911–2008 · fizikçi",hex:"#c9abff",pos:[14,-10],wander:3,look:{hair:0x9a9a9a,hairStyle:'short',glasses:true,skin:0xe0c0a8,top:{style:'jacket',color:'#3a3a4a',accent:'#c9abff',collar:'#2a2a3a'},pants:0x2a2a34},stage:"superpos",
   dialog:[{"who": "f", "t": "Gecikmeli seçim deneyini düşün: fotonun hangi yoldan geçtiğine, o çoktan geçtikten sonra karar veriyoruz."},{"who": "a", "t": "2007’de yapıldı; sonuç standart kuantum mekaniğiyle tam uyumlu. Geçmiş değişmedi, yalnızca neyi sorduğumuz değişti. Lale’nin geçmişine de böyle bakıyorum.", "src": "Jacques vd., Science (2007)"},{"who": "f", "t": "Her ‘şey’ bir evet-hayır sorusunun cevabından doğar; buna ‘it from bit’ demiştim. Soru sormak, evreni kurmanın parçası."},{"who": "a", "t": "Landauer da bir biti silmenin enerji bedeli olduğunu gösterdi. Bilgi fiziksel. Silinen kayıtların bedelini şimdi ödüyorum."}]},
  {id:"kerem",name:"Dr. Kerem Aydın",role:"holografi fizikçisi",hex:"#ff7cb9",pos:[-12,-14],wander:4,look:{hair:0x3a2a22,hairStyle:'short',beard:true,skin:0xd9b39a,top:{style:'jacket',color:'#3a2a5a',accent:'#ff7cb9',collar:'#2a1a4a'},pants:0x1a1a2a},stage:"flamm",
   dialog:[{"who": "f", "t": "Mira’nın kopyaladığı deney benim alanım: Sycamore işlemcisinde 9 kübitle iki dolanık sistem kuruldu; holografiye göre bu, bir solucan deliğiyle bağlı iki kara delik."},{"who": "a", "t": "Soldan giren kübit, iki taraf negatif enerjili bir darbeyle bağlanınca sağdan doğru anda çıktı. Pozitif darbede çıkmadı.", "src": "Jafferis vd., Nature 612, 51 (2022)"},{"who": "f", "t": "Uzayda bir tünel açılmadı; bu holografik bir provaydı. Eleştirmenler modelin tam bir solucan deliği gibi davranmadığını söylüyor."},{"who": "a", "t": "Yine de Motor’un kapıları bu fikirden doğdu. Kalibrasyon planı Lale’nin el yazısıyla geldi; ben yalnızca elimi sürdüm. Motor o eli hatırlıyor."}]}],
 logs:[{id:"log",pos:[-24,-20],lines:["Kayıt iki. Tümörün MR’ına baktım: beynimde bir karanlık bölge. Doktorlar ‘sis’ diyor. Motor’a kuralını buradan koydum: bilmediğin yerde uydurma, sis göster.", "Dolanıklık fikri hoşuma gidiyor: ölçülmeden önce iki şey birbirine bağlı. Biz de öyleydik. Ölçüm yaklaşıyor, Arel; sonuçlardan birinde ben olmayacağım."]}],
 glitches:[[-36,-16],[30,24]],
 question:{q:"Dolanık fotonlarla ışıktan hızlı mesaj gönderilebilir mi?",opts:["Evet, ölçüm anında iletilir","Hayır; sonuçlar tek başına rastgeledir, korelasyon klasik kanalla görülür","Evet, ama tek bit"],a:1,exp:"Sinyal göndermeme teoremi. Kuantum ışınlanmada bile ışık hızıyla sınırlı klasik bir kanal gerekir."},
 title:"Bakmadan önce ölç",arrive:"Olasılıkların ülkesi. Ölçmeden önce her şey hâlâ mümkün; ölçeceğim.",glitchThought:"Sisin kenarında bir ses kırıntısı: Lale’nin kaydından kesilmiş bir hece. Motor uydurmadı; sakladı.",
 insight:"Gerçeklik, ne bildiğimizle ve nerede durduğumuzla örülüdür: bilgi fizikseldir, zaman her yerde kendi hızında akar, hiçbir geçit ışık hızını aşamaz ve bakmak, bakılanı değiştirir."},

{id:"gezegen",name:"Gezegenler",sub:"Yaşam nerede başlayabilir?",hex:"#93e3a0",loc:"Jezero Krateri'nin bir kopyası",spawn:[0,26],
 world:{ground:{seed:31,c1:"#5a2a1a",c2:"#7a3c22",c3:"#9a5230",r:52,h:1.1,ridge:6,c4:"#b57a56"},atmo:{top:"#22100a",hor:"#9a5a34",sun:"#ffe0b0"},light:{sky:"#e0a070",ground:"#3a1a0c",hemi:.9,sun:"#fff0d8",sunI:1.4,dir:[60,26,10]},fog:{c:"#3a1a10",n:28,f:135},rim:{color:"#7fd6ff",i:1},grade:{sat:1.25,vig:.6,grain:.03,con:1.1},dust:"#ffc9a0",
  sky:{world:"gezegen",stage:"mars",pos:[0,26,-115],scale:1.5},props:[{type:"rock",n:34,hex:"#6a3222",min:7,max:44,solid:1.1},{type:"dome",n:3,hex:"#ffd59a",min:14,max:18,solid:1.6,s0:1,s1:1.2}]},
 points:[
  {id:"cheyava",name:"Cheyava Falls Kayası",stage:"mars",pos:[-18,4],say:["Kayada açık renkli leopar lekeleri var; kenarlarında demir fosfat ve demir sülfür. Dünya’da bu ikili çoğu zaman mikropların yemek artığıdır.", "Ama sıcaklık, kimya ve zaman da üretebilir. ‘Potansiyel biyoimza’ bir cevap değil, daha iyi sorulmuş bir soru. Lale’nin kayıtları da öyle: iz var, kanıt yok."],fact:{t:"Cheyava Falls",d:"Perseverance'ın 2024'te örneklediği kaya, 2025'te 'potansiyel biyoimza' olarak tanımlandı; cansız açıklamalar dışlanmadı.",src:"NASA/JPL; Hurowitz vd., Nature (2025)"}},
  {id:"enceladus",name:"Enceladus Sorguçları",stage:"enceladus",pos:[18,-2],say:["Çapı 500 kilometrelik bir uydu güney kutbundan uzaya su püskürtüyor. Cassini içinden geçti ve tattı: tuz, organikler, hidrojen, fosfat.", "Su, enerji, temel elementler. Tarif tamam. Ama bir tarif yemek değildir; 86 milyar nöron da bir insan değildir."],fact:{t:"Enceladus'ta fosfat",d:"Cassini'nin toz analizörü, Enceladus kaynaklı buz tanelerinde fosfat tespit etti.",src:"Postberg vd., Nature (2023)"}},
  {id:"dot",name:"Soluk Mavi Nokta",stage:"dot",pos:[2,-26],say:["Voyager 1, 1990, altı milyar kilometre. Işık huzmesinin içinde bir pikselden küçük bir nokta: Dünya. Lale bunu duvarına asmıştı.", "Mars’ın kayalarını, Enceladus’un suyunu gördüm; hiçbirinde bana el sallayan olmadı. Bu noktada milyarlarca el sallanıyor; biri artık sallamıyor ve nokta hâlâ mavi."],fact:{t:"Soluk Mavi Nokta",d:"14 Şubat 1990'da ~6 milyar km'den çekilen fotoğrafta Dünya ~0,12 piksel.",src:"NASA/JPL"}}],
 figures:[
  {id:"sagan",name:"Carl Sagan",role:"1934–1996 · gezegen bilimci",hex:"#f3c870",pos:[12,14],wander:3,look:{hair:0x3a2a22,hairStyle:'short',skin:0xd9b39a,top:{style:'jacket',color:'#5a3a2a',accent:'#f3c870',collar:'#e8d8c0'},pants:0x2a2a34},stage:"dot",
   dialog:[{"who": "f", "t": "Voyager’ın kamerasını Dünya’ya çevirmelerini ben istedim. Bilimsel değeri azdı; anlamı büyüktü."},{"who": "a", "t": "O fotoğrafta sınır görünmüyor. Bugün 6 binden fazla ötegezegen biliyoruz, ama yaşamın kanıtlanmış tek örneği hâlâ o nokta."},{"who": "f", "t": "Olağanüstü iddialar olağanüstü kanıt ister. K2-18b’deki manşetleri de öyle oku; umudu ve titizliği aynı masada tut."},{"who": "a", "t": "Bağımsız analizler DMS sinyalinin güçlü olmadığını gösterdi. Umut ile titizlik arasında bu kez titizliği dinliyorum; Lale için de öyle yapmalıyım.", "src": "JWST; bağımsız yeniden analizler (2024–2025)"}]},
  {id:"ayse",name:"Ayşe Demir",role:"Europa Clipper görev mühendisi",hex:"#7fd6ff",pos:[-12,-14],wander:4,look:{hair:0x1a1210,hairStyle:'bun',skin:0xcfa08a,top:{style:'overall',color:'#1a3a5a',accent:'#7fd6ff',collar:'#122a44'},pants:0x1a3a5a},stage:"europa",
   dialog:[{"who": "f", "t": "Clipper Nisan 2030’da Jüpiter’e varıyor; Europa’nın yakınından 49 kez geçecek. Buzun altında Dünya’nın tüm okyanuslarından fazla su olabilir.", "src": "NASA Europa Clipper"},{"who": "a", "t": "Güneş ışığı oraya hiç ulaşmadı. Enerji nereden geliyor?"},{"who": "f", "t": "Jüpiter’in gelgiti uyduyu her 3,5 günde bir esnetiyor; sürtünme ısıya dönüşüyor. Ama Clipper yaşam aramayacak, yaşanabilirliği ölçecek."},{"who": "a", "t": "Bu ayrımı unutmamak, bilim insanı olmanın yarısı. Diğer yarısı, yine de aramaya devam etmek."}]}],
 logs:[{id:"log",pos:[22,18],lines:["Kayıt üç. Sagan’ın noktasını duvara astım. Bir pikselden küçük bir yer için bunca kavga; benim için de bir hastane odası.", "Yaşamın tek kanıtlı örneği bu nokta; bilinç için de aynı: içeriden yaşayan biri. Defterde dört soru birikti: bir balıkçı, bir öğrenci, bir hemşire, bir çiftçi. Onları sana bırakıyorum."]}],
 glitches:[[32,26],[-30,-24]],
 question:{q:"Mars 225 milyon km uzaktayken rover'a gönderilen komut kaç dakikada ulaşır? (c ≈ 300.000 km/s)",opts:["~1,25 dk","~12,5 dk","~45 dk"],a:1,exp:"225.000.000 / 300.000 = 750 s ≈ 12,5 dk. Rover bu yüzden özerk sürer."},
 title:"Tek örneği bul",arrive:"Kızıl bir kıyı. Yaşam için tarif tamam, yemek yok. Burada tek bir örnek arıyorum.",glitchThought:"Jezero’nun ortasında bir boşluk; bir hastane odası kadar. Oraya bakmıyorum.",
 insight:"Yaşamın malzemeleri her yere saçılmış, ama kanıtlanmış tek örneği bu soluk mavi nokta; ‘belki’ ile ‘biliyoruz’ arasındaki farkı korumak, tek dünyamızı ve tek kardeşimizi daha değerli kılar."},

{id:"bilinc",name:"Bilinç",sub:"Nörondan benliğe",hex:"#ff7cb9",loc:"Arel'in kendi beyninin içi",spawn:[0,26],
 world:{ground:{seed:41,c1:"#4e1c46",c2:"#64285a",c3:"#7a346e",r:52,h:.7,ridge:3},atmo:{top:"#040107",hor:"#2a0d24",sun:"#ff8cc8"},light:{sky:"#c868a8",ground:"#0e0314",hemi:.9,sun:"#ffc8e0",sunI:1.1,dir:[-30,45,20]},fog:{c:"#14060f",n:26,f:115},rim:{color:"#7fd6ff",i:.6},grade:{sat:.9,vig:.68,grain:.035,con:1.1},dust:"#ff9fd0",
  sky:{world:"bilinc",stage:"neuron",pos:[0,22,-105],scale:1.3},props:[{type:"neuron",n:22,hex:"#ff7cb9",min:9,max:44,solid:.5},{type:"grass",n:30,hex:"#ffb4d8",min:5,max:42},{type:"rock",n:10,hex:"#3a1a30",min:8,max:40,solid:1}]},
 points:[
  {id:"neuron",name:"Tek Bir Nöron",stage:"neuron",pos:[-20,6],say:["Zarın içi dışına göre −70 milivolt. Gelen sinyaller toplanıyor; eşik aşılınca sodyum içeri hücum ediyor ve zar bir milisaniyede pozitife fırlıyor.", "Hepsi ya da hiç. Bu bir düşünce değil, bir hece. Düşünce, 86 milyar hecenin şiiri; Lale’nin şiirinden heceler eksildi, şiir yine de sonuna kadar okundu."],fact:{t:"Nöron sayısı",d:"Yetişkin insan beyninde yaklaşık 86 milyar nöron bulunur.",src:"Azevedo vd., J. Comp. Neurol. (2009)"}},
  {id:"reward",name:"Dopamin Yolu",stage:"reward",pos:[18,8],say:["Dopamin nöronları ödülün kendisine değil, beklenenden iyi çıkmasına ateşleniyor. Beklenen ödül gelmezse susuyorlar.", "İstemek ile beğenmek ayrı devreler. İki yıldır bu Motor’dan bir cevap istiyorum; aldığım hiçbir şeyi beğenmedim. Devreyi şimdi tanıdım."],fact:{t:"Ödül öngörü hatası",d:"Dopamin nöronları beklenmeyen ödüle ateşlenir; öğrenmeyle yanıt, ödülü haber veren işarete kayar.",src:"Schultz, Dayan ve Montague, Science (1997)"}},
  {id:"dmn",name:"Varsayılan Mod",stage:"dmn",pos:[0,-24],say:["Görev bitince beynim susmuyor. Geçmişimi hatırlıyor, yarını kuruyor, başkalarının aklından geçeni tahmin ediyorum. Burada hep Lale’yi tahmin ediyorum.", "‘Ben’ tek bir adreste yaşamıyor. Ben, bu ağların sürekli yeniden anlattığı bir hikâyeyim; Lale de öyleydi, şimdi onun hikâyesini ben anlatıyorum."],fact:{t:"Varsayılan mod ağı",d:"Dinlenimde etkin olan ve hedefe yönelik görevlerde baskılanan tutarlı bir beyin ağı tanımlandı.",src:"Raichle vd., PNAS (2001)"}}],
 figures:[
  {id:"cajal",name:"Santiago Ramón y Cajal",role:"1852–1934 · nörobilimin kurucusu",hex:"#f3c870",pos:[14,-10],wander:3,look:{hair:0x7a7a7a,hairStyle:'short',beard:0x8a8a8a,skin:0xd9b39a,top:{style:'coat',color:'#2a2a2a',accent:'#f3c870',collar:'#dddddd',lapel:'#3a3a3a'},pants:0x1a1a1a},stage:"synapse",
   dialog:[{"who": "f", "t": "Golgi boyasıyla gördüğüm şey, birbirine değmeyen ayrı hücrelerdi. Beyin kesintisiz bir ağ değil, konuşan hücrelerden oluşan bir orman."},{"who": "a", "t": "Sinaptik aralığı sonradan 20 nanometre ölçtük. Hebb 1949’da ekledi: birlikte ateşlenen nöronlar birbirine bağlanır. Lale’yle otuz yıl birlikte ateşlendik."},{"who": "f", "t": "İnsanın kendi beyninin heykeltıraşı olabileceğine inandım. Keski, tekrardır."},{"who": "a", "t": "Yeni bir alışkanlığın otomatikleşmesi ortalama 66 gün sürüyor. İrade kas değil, mimari: çevreyi tasarla, beyin gerisini öğrenir.", "src": "Lally vd., Eur. J. Soc. Psychol. (2010)"}]},
  {id:"nil",name:"Dr. Nil Arslan",role:"nörolog · Lale’nin eski asistanı",hex:"#c9abff",pos:[-14,-12],wander:4,look:{hair:0x4a2a1a,hairStyle:'long',skin:0xd9b39a,top:{style:'coat',color:'#cdd1da',accent:'#c9abff',collar:'#2a3a5a'},pants:0x2a3a5a},stage:"theories",
   dialog:[{"who": "f", "t": "Lale son ayında bu soruyla uyuyamıyordu. Küresel Çalışma Alanı ‘ateşlenme’ diyor, IIT bütünleşik bilgi diyor; o ikisine de inanmıyordu."},{"who": "a", "t": "2025’teki Cogitate deneyleri iki kuramın da kilit öngörülerini sarstı. Henüz kazanan yok; Lale haklı çıktı, teselli değil.", "src": "Cogitate Consortium, Nature (2025)"},{"who": "f", "t": "Penrose ve Hameroff mikrotübüllerde kuantum çöküşü diyor. 2024’te sıçanlarda mikrotübül ilacı anesteziyi geciktirdi. Bir de şu: Lale kayıtlarını kendi kesti; ‘bazı yerler ona ait değil’ dedi."},{"who": "a", "t": "İlginç bulgu, ama kuantum bilinci kanıtlamıyor. Tegmark’ın hesabına göre sıcak beyinde süperpozisyon 10⁻¹³ saniyede dağılmalı. Spekülatif kalıyor. Kesilen yerler ise sis; oraya gireceğim."}]}],
 logs:[{id:"log",pos:[20,-20],lines:["Kayıt dört. Nil bana hipokampustaki zaman hücrelerini anlattı. Bir anıyı her çağırışta yeniden yazıyormuşuz.", "O yüzden bu kayıtları kesiyorum, Arel. Sana ait olmayan yerleri çıkarıyorum; kalanı sis. Beni hatırladıkça yeniden yazacaksın; en azından başlangıç noktası benim olsun."]}],
 glitches:[[-30,24],[30,-28]],
 question:{q:"Omurilikten ayak başparmağına ~1 m. Miyelinli aksonda sinyal ~100 m/s ise kaç ms sürer?",opts:["1 ms","10 ms","100 ms"],a:1,exp:"1 m ÷ 100 m/s = 0,01 s = 10 ms."},
 title:"Kesilen heceyi ara",arrive:"Kendi beynimin içi. 86 milyar hece; hangisi Lale’yi tutuyor?",glitchThought:"Bozulma beni kovalıyor. Hayır; ben ondan kaçıyorum. Sis, kendi beynimdeki son hafta.",
 insight:"Bilinç bir nesne değil, bir süreç olabilir: beynim dünyayı ve kendini her an tahmin edip düzeltiyor; ‘ben’ dediğim şey bu tahminlerin en tutarlı hikâyesi, ve her hikâye bir anlatıcıya muhtaç."},

{id:"anlam",name:"Anlam",sub:"Düşünürler agorası",hex:"#c9abff",loc:"zamanın dışındaki agora",spawn:[0,26],
 world:{ground:{seed:51,c1:"#3a3452",c2:"#4a4466",c3:"#5a5478",r:50,h:.3,ridge:1},atmo:{top:"#120c2a",hor:"#4e3e6e",sun:"#ffd8a0"},light:{sky:"#b0a0dc",ground:"#3a2c3c",hemi:.95,sun:"#ffd8a0",sunI:1.6,dir:[45,16,25]},fog:{c:"#120e22",n:42,f:160},rim:{color:"#ffd36b",i:.9},grade:{sat:1.1,vig:.58,grain:.025,con:1.08},dust:"#ffe6b0",
  sky:null,props:[{type:"pillar",n:18,min:14,max:40,solid:.7},{type:"tree",n:12,hex:"#6a4a9a",min:16,max:42,solid:.6},{type:"grass",n:26,hex:"#e6d8ff",min:5,max:40},{type:"crystal",n:6,hex:"#f3c870",min:30,max:42,s0:.5,s1:.9}]},
 points:[
  {id:"ucan",name:"Uçan Adam",pos:[-18,8],say:["İbn Sina’nın deneyi: bir insan havada, gözleri kapalı, hiçbir şey hissetmiyor. Yine de var olduğunu biliyor. Lale son günlerinde çoğu duyusunu kaybetti; ‘buradayım’ dedi.", "Beyin duyular kesilse de bir beden haritası üretmeye devam ediyor. Ama bu hikâyenin neden içeriden yaşandığını bin yıldır açıklayamadık."],fact:{t:"Uçan Adam",d:"İbn Sina'nın düşünce deneyi eş-Şifâ'nın nefs bölümünde yer alır.",src:"İbn Sina, Kitâbü'ş-Şifâ (11. yy)"}},
  {id:"sisifos",name:"Sisifos'un Kayası",pos:[16,-6],say:["Camus: anlam talebimiz dünyanın sessizliğine çarpar. Kaçış yok; başkaldırı var. Sisifos’u mutlu düşünmeliyiz. Bu Motor benim kayam.", "Termodinamik de aynı sessizliği söylüyor: entropi artacak, yıldızlar sönecek. Yine de dalgada yüzmekten keyif alan bir canlı da evrenin parçası; Rıza buna ‘ağ’ diyor."],fact:{t:"Sisifos Söyleni",d:"Camus absürdü ve ona karşı başkaldırıyı bu denemede işler.",src:"Camus, Le Mythe de Sisyphe (1942)"}}],
 figures:[
  {id:"ibnsina",name:"İbn Sina",role:"980–1037 · hekim ve filozof",hex:"#f3c870",pos:[-10,-16],wander:3,look:{hair:false,scarf:0xc8bca0,beard:0x2a1a12,skin:0xc9a080,top:{style:'coat',color:'#4a3a1a',accent:'#f3c870',collar:'#6a5a2a',lapel:'#5a4a2a'},pants:0x3a2a14},
   dialog:[{"who": "f", "t": "Benlik bedenle aynı şey değildir; Uçan Adam bunu gösterir. Sen ne diyorsun, geleceğin hekimi?"},{"who": "a", "t": "Beyinde tek bir benlik merkezi bulamadık. Benlik dağılmış bir süreç gibi. Ama süreç olmak gerçek olmamak demek değil; girdap da yalnızca sudur, yine de vardır."},{"who": "f", "t": "Bin yıl önce sorduğum soru hâlâ masada demek. Hekim olarak şunu da bilirim: hasta giderken soru kalır."},{"who": "a", "t": "Kız kardeşim nörologdu. Sorusunu bana bıraktı; onu tutmak mı, bırakmak mı, bilmiyorum."},{who:"c",t:"Motor'da duyuları kapalı bir bilinç kopyası uyanıyor. Ne yaparsın?",ch:[{t:"Duyularını aç.",res:"Kopya acıyı da tanır, ama artık yalnız değildir.",path:"kopru"},{t:"Saf düşünce olarak bırak.",res:"Huzurlu bir boşlukta yaşar ve neyi kaybettiğini hiç bilmez.",path:"sessizlik"}]}]},
  {id:"spinoza",name:"Spinoza",role:"1632–1677 · mercek parlatıcısı",hex:"#7fd6ff",pos:[12,14],wander:3,look:{hair:0x2a1a12,hairStyle:'long',skin:0xd9b39a,top:{style:'coat',color:'#1a1a2a',accent:'#7fd6ff',collar:'#cfcfcf',lapel:'#2a2a3a'},pants:0x1a1a2a},
   dialog:[{"who": "f", "t": "Tek bir töz vardır: Tanrı ya da Doğa. Özgürlük yasaları çiğnemek değil, onları anlamaktır."},{"who": "a", "t": "Fizik size büyük ölçüde hak veriyor; galaksiden nörona aynı yasalar. Kuantum bir rastlantı payı katıyor, ama rastlantı da özgürlük sayılmaz."},{"who": "f", "t": "Kederin nedenlerini anlayan, acının bir kısmını geri alır; ben böyle düşündüm."},{"who": "a", "t": "Nedenleri biliyorum: bir tümör, bir hafta, bir uçak bileti. Hâlâ keder duyuyorum. Demek ki anlamak yetmiyor; Lale de böyle yazmıştı."},{who:"c",t:"Motor bir insanın gelecekteki seçimlerini yüksek olasılıkla öngörebiliyor.",ch:[{t:"Öngörüyü ona göster.",res:"Kendi kalıplarını görür; kimi onları kırar, kimi kadere teslim olur.",path:"kopru"},{t:"Bilgiyi sakla.",res:"Seçimleri onun olarak kalır, bilgi yalnızca sende kalır.",path:"gozlemci"}]}]},
  {id:"beauvoir",name:"Simone de Beauvoir",role:"1908–1986 · filozof",hex:"#ff7cb9",pos:[-14,14],wander:3,look:{hair:0x1a1210,hairStyle:'bun',skin:0xd9b39a,top:{style:'jacket',color:'#3a1a2a',accent:'#ff7cb9',collar:'#2a1220'},pants:0x2a1a24},
   dialog:[{"who": "f", "t": "İnsan ne olacağı belli olarak doğmaz; koşullar içinde o hâle gelir. Kendi özgürlüğünü istemek başkalarınınkini de istemeyi gerektirir."},{"who": "a", "t": "Beyin de sosyal bir organ. Dil, empati, kimlik başkalarıyla kuruluyor. Hiçbir bilinç kendini tek başına inşa etmedi."},{"who": "f", "t": "O hâlde kardeşinin kim olduğu sorusu yalnızca onun değil; onu kuran herkesin. Sen dahil."},{"who": "a", "t": "Dört tanık, üç mürettebat, bir yankı. Belki cevap tek bir yerde değil, aramızda."},{who:"c",t:"Simülasyon Motoru'nun bilgisi ne olacak?",ch:[{t:"Herkese aç.",res:"Bilgi özgürleşir; kötüye kullanılma riski toplumla paylaşılır.",path:"kopru"},{t:"Motoru kapat, bilgiyi göm.",res:"Risk kalkar, ama başkalarının bu soruyla kendi yolunu bulma özgürlüğünü de almış olursun.",path:"sessizlik"}]}]}],
 logs:[{id:"log",pos:[-22,-18],lines:["Kayıt beş. Uçan Adam’ı bu gece düşündüm. Beden gittiğinde geriye kalan ‘ben’ miyim, yoksa yalnızca soru mu?", "Sema’ya son hafta seni uzak tutmasını söyledim. Kalibrasyonu bitirmen gerekiyordu; beni ölürken görmen değil. Kızgınsan hakkın var. Ama bu kararı ben verdim, sen değil."]}],

 title:"Kayayı kime bırakacağına karar ver",arrive:"Zamanın dışında bir agora. Burada kimse denklem istemiyor; cevap istiyorlar.",glitchThought:"Sütunların arasında sis; filozoflar oraya bakmıyor bile. Belki soru sormak sise girmektir.",

 points:[
  {id:"zirkon",name:"Jack Hills Zirkonu",stage:"hadean",pos:[-18,6],say:["4,4 milyar yaşında bir kristal. Oksijen izotopları sıvı suyla temas etmiş bir kabuktan söz ediyor. Okyanuslar erken gelmiş; taşlar bizden iyi hatırlıyor.", "Siyanobakteriler suyu parçalayıp oksijen saldı; 2,4 milyar yıl önce bir zehir nefese dönüştü. Hatice Nine’nin toprağı bu nefesle başladı."],fact:{t:"En eski kristal",d:"Jack Hills zirkonu ~4,404 milyar yaşındadır; Dünya'da bulunmuş en eski mineral.",src:"Wilde vd., Nature (2001)"}},
  {id:"theia",name:"Theia'nın İzi",stage:"theia",pos:[18,2],say:["Mars büyüklüğünde bir gezegen genç Dünya’ya eğik çarptı; erimiş kaya yörüngede disk oluşturdu. Ay o enkazdan doğdu.", "Bir yıkımın içinden bir eşlikçi. Kayıptan doğan şeyler de ışık verebilir mi, Lale? Ay her yıl biraz uzaklaşıyor ve hâlâ aydınlatıyor."],fact:{t:"Uzaklaşan Ay",d:"Apollo yansıtıcılarına yapılan lazer ölçümlerine göre Ay her yıl ~3,8 cm uzaklaşıyor.",src:"NASA, Lunar Laser Ranging"}},
  {id:"apophis",name:"13 Nisan 2029",stage:"future",pos:[0,-24],say:["Yaklaşık 340 metrelik Apophis, yüzeyden 32 bin kilometre uzaktan geçecek; yer eş zamanlı uydulardan daha yakın. Çarpma riski yok. Rıza torunlarıyla izleyecek.", "Vera Rubin gökyüzünün filmini çekiyor, Clipper 2030’da Jüpiter’de, Dragonfly 2034’te Titan’da. Bunlar plan; bazıları gecikecek. Lale’nin planı da gecikti, ama geldi."],fact:{t:"Apophis geçişi",d:"13 Nisan 2029'da Apophis Dünya'ya ~32.000 km yaklaşacak; Ay'dan ~12 kat daha yakın.",src:"NASA CNEOS"}}],
 figures:[
  {id:"elif",name:"Komutan Elif Aras",role:"ISS Ekspedisyon komutanı",hex:"#7fd6ff",pos:[12,14],wander:3,look:{armor:true,suit:'#e8e8f0'},stage:"iss",
   dialog:[{"who": "f", "t": "Saatte 28 bin kilometreyle sürekli düşüyoruz ama yere hiç ulaşmıyoruz. Her tur 92 dakika; günde 16 gün doğumu.", "src": "NASA ISS Facts"},{"who": "a", "t": "Beden itiraz ediyor olmalı. Kaan dizlerinin hâlâ hatırladığını söylüyor."},{"who": "f", "t": "Sıvılar yüze toplanıyor, kemik ayda yüzde bir eriyor. Scott Kelly 340 gün kaldı; değişimlerin çoğu dönüşten sonra normale döndü."},{"who": "a", "t": "Beden uyum sağlıyor, bedelini de hesaplıyor. Keder de öyle: geri dönüyorsun ama aynı değil."}]},
  {id:"yusuf",name:"Yusuf",role:"Hatice Nine'nin torunu · ziraat mühendisi",hex:"#93e3a0",pos:[-12,-14],wander:4,look:{hair:0x1a1210,hairStyle:'short',beard:true,skin:0xb98f72,top:{style:'overall',color:'#3a4a2a',accent:'#93e3a0',collar:'#2a3a1a'},pants:0x2a3a1a},stage:"marsbase",
   dialog:[{"who": "f", "t": "Mars’ta toprak var ama su yok, perklorat var, azot eksik. MOXIE 122 gram oksijen üretti; küçük bir köpeğin 10 saatte soluduğu kadar.", "src": "NASA JPL (2023)"},{"who": "a", "t": "Umut gerçek ama ölçek küçük. Orası bir ev değil, zorlu bir karakol."},{"who": "f", "t": "Ninem ‘toprağın kıymetini bilen biz olduk’ diyor. Konya’da obruklar açılıyor; damla sulamaya geçiyoruz. Ninemin cevizini ben sulayacağım."},{"who": "a", "t": "Mars’ı taklit etmeye çalıştıkça evimizin ne kadar ince ayarlı olduğunu ölçüyoruz. Evin de, kardeşin de yedeği yok."}]}],
 logs:[{id:"log",pos:[-20,20],lines:["Kayıt altı. Son kayıt. Motor’u sen kurmadın Arel; planı ben çizdim, sen bitirdin. Kayıtlar, geçitler, dört tanık, soru: hepsi benim el yazım.", "Yani belki Motor’un içindeki sen değilsin; benim seni hayal etmemsin. Ya da tersi. Çekirdek’te karar ver. Hangisi olursa olsun soru gerçek, ve artık senin."]}],

 title:"Boşluğu taşımayı öğren",arrive:"Genç Dünya. Dört buçuk milyar yıl önce kimse yoktu; yine de ev buydu.",glitchThought:"Son sis. İçinden Lale’nin sesi: ‘Çekirdek.’ Artık kaçmıyorum.",

core:{name:"Çekirdek",loc:"tüm zamanlar, tüm boyutlar",
 world:{ground:{seed:71,c1:"#4a3c1c",c2:"#5e4c24",c3:"#726030",r:34,h:.2,ridge:1},atmo:{top:"#060401",hor:"#2c2010",sun:"#ffe2a0"},light:{sky:"#d8b880",ground:"#241a0c",hemi:1,sun:"#fff4dc",sunI:1.4,dir:[0,22,-70]},fog:{c:"#0a0804",n:34,f:120},rim:{color:"#f3c870",i:1.1},grade:{sat:.95,vig:.62,grain:.03,con:1.1},dust:"#f3c870",
  sky:{world:"core",stage:"core",pos:[0,14,-80],scale:1.2,rot:[.5,0,0]},props:[{type:"shelf",n:26,hex:"#f3c870",min:9,max:28,s0:.8,s1:1.3},{type:"crystal",n:6,hex:"#f3c870",min:6,max:20,s0:.5,s1:.9}]},
 cine:["Bir yıldız. Uzakta. Motor bütün boyutları aynı noktaya katladı.", "Raflar anılardan, duvarlar zamandan; sis burada en ince.", "Altı kayıt dinlendi. Kesilen yerler burada birleşiyor.", "Lale bekliyor. Son söz onda değil; bende."],
 totem:{"q": "Lale’nin son kaydı doğruysa bu Motor’un içindeki sen değil, onun seni hayal edişi. Ne yaparsın?", "opts": [{"t": "Uyanmayı dene. Motor’dan çık.", "res": "Ekran kararır. Laboratuvar, soğuk kahve, çatlak tavan; ya da Motor’un en inandırıcı odası. Fark etmez: soruyu dışarı taşıdın, Lale’yi değil.", "close": "Tavandaki çatlağa bakıyor. Gerçek mi, en inandırıcı oda mı; artık sormuyor. Defteri açıyor ve yeni bir soru yazıyor."}, {"t": "Kal. Soruyu burada yaşa.", "res": "Yıldız dönmeye devam ediyor. Gerçek olup olmadığını bilmeden de anlam kurulabiliyor; Lale bunu biliyordu, sen şimdi öğrendin.", "close": "Yıldız hâlâ dönüyor. Arel kendi kendine ‘Kayıt yedi’ diyor ve konuşmaya başlıyor; dinleyen biri var mı, bilmeden."}]},
 finale:[{"who": "l", "t": "Geldin. Altısını da dinledin mi, yoksa sondan mı başladın?"}, {"who": "a", "t": "Hepsini. Beni uzak tuttun ve bunu söylemeyi Sema’ya bıraktın."}, {"who": "l", "t": "Ölürken görülmek istemedim; bir makine bitirilmek istedi. İkisi de bencilce. Özür dilemiyorum; açıklıyorum."}, {"who": "a", "t": "Sis senin kestiklerin. Oraya girince ne bulacağım, Lale?"}, {"who": "l", "t": "Beni değil. Beni ben yapan şeyin bir kısmını: sana bıraktığım boşluk. Doldurma; taşı."}, {"who": "a", "t": "Sorunu cevaplayamadım. Ama nereye gittiğini biliyorum: buraya, bana, dört yabancıya. Dağıldı; yok olmadı."}],
 synthesis:["Dürüst olayım. Evrenin neden var olduğunu bilmiyoruz. Bilincin maddeden nasıl doğduğunu bilmiyoruz. Motorum bu noktalarda hâlâ sis gösteriyor; sisi kapatmayı reddettim.", "Ama bildiklerimiz az değil. Yıldızlarda dövülen atomlar, en az bir gezegende kendini sorgulayan bir maddeye dönüştü. Benlik sabit bir öz değil, her hatırlayışta yeniden kurulan bir süreç; Lale bunu biliyordu ve kayıtlarını ona göre kesti.", "Evrenin yasalarında ‘anlam’ diye bir sabit yok. Anlam keşfedilmiyor, kuruluyor: Rıza ağına, Zeynep hastasının eline, Hatice Nine cevizine, Deniz ilk deneyine uzandığında evrene küçük bir söz ekleniyor. Dört soru bana ait değildi; cevapları da bana ait olmayacak.", "Lale, seni sen yapan şeyin nereye gittiğini hâlâ bilmiyorum. Ama dağıldığını biliyorum: bana, Sema’ya, Nil’e, tanımadığın dört insana. Yok olmadın; bölüştürüldün. Gerisini yaşayarak yazacağız."],
 endings:{"gozlemci": {"title": "Gözlemci", "text": "Arel Motor’u kapatmaz, kimseye de vermez. Sisi olduğu gibi bırakır ve içinde kalır. Galaksilerin doğuşunu, milyarlarca hayatın açılıp kapanışını izler; her şeyi görür, hiçbir şeye dokunmaz. Bakanlık elektriği keser; Kaan’ın jeneratörleri bir süre dayanır. Tanıklar evlerine döner, soruları yanlarında. Arel son sahnede Lale’nin yankısının yanına oturur. Konuşmazlar. Bilgisi kusursuzdur, yalnızlığı da. Soru cevaplanmamıştır; yalnızca korunmuştur."}, "kopru": {"title": "Köprü", "text": "Arel Motor’u insanlara açar; sis kırmızı, tahmin ayrı gösterilir. Bakanlık geri çekilir çünkü artık gizlenecek şey yoktur. Rıza torunuyla ağ örer ve Haliç için imza toplar. Deniz ilk deneyini kurar. Zeynep yoğun bakımda nörobilim anlatır. Hatice Nine’nin cevizini Yusuf sular. Her şey kusursuz gitmez; Motor bazen yanlış anlaşılır. Ama soru artık herkesindir ve Lale’nin defteri yeni sorularla dolmaya başlar. Arel yalnız değildir."}, "sessizlik": {"title": "Sessizlik", "text": "Arel Motor’u kapatır, verileri siler, Lale’nin kayıtlarını saklar ve Konya Ovası’na gider. Hatice Nine’yle damla sulama hattı döşer, yağmuru bekler. Bakanlık boş bir mağara bulur. Dört tanık aralarında yazışmaya devam eder; Arel yazmaz. Büyük soruyu çözmemiştir ama taşımayı öğrenmiştir. Belki anlam en çok adı konmadan yaşandığında oradadır. Belki de Arel yalnızca kaçmıştır. Oyun bu sorunun cevabını vermez."}}}
};

 yedi yıl. Sen hangi tarafta kaldın?", "Altyazı titriyor: ‘sonuçlardan birinde ben olmayaca—’"], "who": ["lale", "sema"]}, {"lines": ["MİRA (yankı): Dokuz kübit. Negatif enerji. Kapı açıldı; kim girdi, kim çıktı?", "KAAN (çarpık): GPS günde 38 mikrosaniye ileri. Sen kaç yıl geride kaldın, Arel?", "LALE: Dolanıktık. Beni ölçtüler. Sen hâlâ ölçülmedin; belki hiç ölçülmezsin."], "who": ["mira", "kaan", "lale"]}], "gezegen": [{"lines": ["LALE (çarpık): Leopar lekeleri. İz var, kanıt yok. Ben de bir izim; kanıtı sensin.", "ZEYNEP (yorgun yankı): Son nefeste bir şey gidiyor. Nereye? Nereye? Nereye?", "LALE: Soluk mavi noktada milyarlarca el. Birini saymıyorsun; neden?"], "who": ["lale", "zeynep"]}, {"lines": ["RIZA (çarpık): Enceladus su püskürtüyor, Haliç kokuyor. Hangi denize ağ atayım, evlat?", "HATİCE (yankı): Mars’ta toprak var, su yok. Hastane odasında su var, sen yoksun.", "LALE: Altı milyar kilometre. Voyager geri baktı. Sen bakmadın.", "Tozun içinde bir pencere beliriyor; ardında boş bir yatak."], "who": ["riza", "hatice", "lale"]}], "bilinc": [{"lines": ["LALE (üç kopya): Adın neydi? / Kardeşim. / Adın… neydi?", "SEMA (çarpık): Hafızası parça parça. Hangi parça, Arel? Hangi parça sendin?", "LALE: Her hatırlayışta beni yeniden yazıyorsun. Bu yazdığın ben miyim?", "Ekranda −70 milivolt; eşik aşılmıyor, aşılmıyor, aşılmıyor."], "who": ["lale", "sema"]}, {"lines": ["DENİZ (yankı): Belirlenmiş miyim, Arel abi? Sen de mi unutacaksın beni?", "MİRA (çarpık): Bozulmalar kayıtlarla aynı koordinatta. Sen de aynı koordinattasın.", "LALE: Dopamin beklenmeyene ateşlenir. Beni beklemiyordun; ateşlendin mi?"], "who": ["deniz", "mira", "lale"]}], "anlam": [{"lines": ["LALE (çarpık): Havada asılıyım, gözlerim kapalı. Hâlâ buradayım. Sen neredesin?", "RIZA (yankı): Deniz beni hatırlamayacak. Motor seni hatırlayacak mı, evlat?", "LALE: Kayayı it. Tepeye var. Kaya iner. Bu Motor senin kayan mı, benim mi?", "Sütunların gölgesi yanlış yöne düşüyor."], "who": ["lale", "riza"]}, {"lines": ["HATİCE (çarpık): Ceviz diktim, meyvesini görmeyeceğim. Sen ne diktin evladım, sis mi?", "ZEYNEP (yankı): Anlam iki insanın arasında kuruluyor. Odada bir kişi vardı.", "LALE: Spinoza: nedenleri anla, keder azalsın. Anladın mı? Azaldı mı?"], "who": ["hatice", "zeynep", "lale"]}], "yuva": [{"lines": ["LALE (çarpık): Zirkon 4,4 milyar yıl hatırlıyor. Sen iki yılı bile tam hatırlamıyorsun.", "KAAN (yankı): Yörüngede günde 16 gün doğumu. Burada hiç. Sayıyorum. Sayıyorum.", "LALE: Theia çarptı, Ay doğdu. Ben çarptım; ne doğdu, Arel?", "Deniz çekiliyor; kıyıda bir hastane yatağı kalıyor."], "who": ["lale", "kaan"]}, {"lines": ["MİRA (çarpık): Planı Lale çizdi. Sen bitirdin. Yoksa sen de plan mısın?", "SEMA (yankı): ‘Çekirdek’e varınca’ dedi. Vardın mı? Vardın mı?", "LALE: Ay her yıl uzaklaşıyor ve hâlâ aydınlatıyor. Ben de uzaklaşıyorum; ışık kaldı mı?"], "who": ["mira", "sema", "lale"]}]};
GAME.story={"coreHal": {"lines": ["Yedi yüz. Hepsi Lale’nin; hiçbiri Lale değil.", "KORO (çarpık): Beni ben yapan şey nereye gider? Nereye gider? Nereye?", "LALE: Altı parça topladın. Yedincisi yok; yedincisi sensin.", "MİRA / KAAN / SEMA (üst üste): Sis büyüyor / Üç gün / Nabzın yüksek", "Ekran kararıyor. Bir ses: ‘Kayıt yedi. Arel, dinliyor musun?’"], "who": ["lale", "mira", "kaan", "sema", "riza", "deniz", "zeynep", "hatice"]}, "record7": {"locked": "Kayıt Yedi kilitli: kesilmiş altı parça eksik, sis burada konuşmuyor.", "lines": ["Kayıt yedi. Bunu ben kaydetmedim, Arel; kestiklerimi sen birleştirdin. Demek ki bu ses senin de.", "Korktum. Sonucu biliyordum ve söylemedim. Seni istedim ve uzak tuttum. Bir sabah adını unuttum.", "Sana kızdım, kendime daha çok. Motor’u kendim için kurdum; geride bir Ay bırakmak istedim.", "Beni ben yapan şey bunlardı: korku, suskunluk, özlem, unutuş, öfke, inat. İyi yanlarımı zaten bırakmıştım.", "Hepsini kestim çünkü sende yalnızca iyi tarafım kalsın istedim. Yanlıştı; yarım bir insan hatırlanmaz.", "Şimdi tamamım, sende. Beni ben yapan şey buraya gitti, Arel: sana. Doldurma; taşı. Ve defteri kapatma."], "effect": "Kayıt Yedi’yi dinlediği için Arel, Lale’yi yalnızca iyi yanlarıyla değil, kestikleriyle birlikte hatırlar. Yankı artık yarım değildir; soru da."}, "radio": [{"stage": 0, "lines": ["Kovuk Tesisi, burası Bakanlık Koordinasyon. Teslim süresi 72 saat; sayım başlamıştır.", "Motor’un sis bölgelerinin tahminle doldurulması beklenmektedir. Rapor formatı ektedir.", "KAAN: Yetmiş iki saat. Sen gez, ben sayarım."]}, {"stage": 1, "lines": ["Kovuk Tesisi, 48 saat kaldı. Raporlarınızdaki ‘henüz hazır değil’ ifadesi kabul edilmemektedir.", "Sis oranı yüzde 31. Dolgu algoritması gönderilmiştir; uygulanması zorunludur.", "KAAN: Kırk sekiz saat. Mira algoritmayı okudu, ‘uydurma’ dedi; ben imzalamadım."]}, {"stage": 2, "lines": ["Kovuk Tesisi, 24 saat. Teslim ekibi yola çıkmıştır. Enerji hattı Bakanlık kontrolüne geçecektir.", "Personel listesi istenmektedir. Dış tanıkların tesisten derhal ayrılması gerekmektedir.", "KAAN: Yirmi dört saat. Jeneratörleri doldurdum; tanıklar kalıyor, listeye ben yazılırım."]}, {"stage": 3, "lines": ["Kovuk Tesisi, süre dolmuştur. Elektrik 60 dakika içinde kesilecektir. Motor’u teslim edin.", "Bu son uyarıdır. Dr. Vey, Çekirdek erişiminiz iptal edilmiştir.", "KAAN: Sıfır. Jeneratör dört saat verir; Çekirdek’e şimdi gir, gerisini ben konuşurum."]}], "crewSide": {"mira": ["Parçanın spektrumu kayıtlarla örtüşüyor; uydurma değil, gerçekten Lale’nin sesi.", "Her parça alındığında sis bir noktacık küçülüyor. Bunu raporlara yazdım bu kez."], "kaan": ["Sahadan çıkmışsın; nabzın 130. Otur, su iç, sonra dinle.", "Bozulma’yla yüz yüze geldin demek. Yörüngede buna ‘alarm’ derdik; sen ‘parça’ diyorsun."], "sema": ["O kesiği ben de dinlemiştim, Arel. Lale ‘sana ait değil’ dedi; ben ‘tam tersi’ dedim.", "Elini uzat. Titriyor; bu geçitten değil, kayıttan."], "riza": ["Ağa takılan şey hep balık olmaz evlat. Ama atılan ağ boş da dönmez.", "Ablanın sesi mi o? Hiç duymadım ama tanıdım. Deniz gibi konuşuyor, sakin ama derin."], "deniz": ["Parça mı buldun? Onu da Motor hesaplamış mıydı, yoksa gerçekten saklı mıydı?", "Kesilmiş bir kaydı birleştirmek… Lale Hoca bunu da planlamış, değil mi?"], "zeynep": ["Hastalar da son günlerde bazı şeyleri söylemez. Söylemedikleri onlarla gitmez; kalır.", "Yorgun görünüyorsun. Ama bu sefer başka bir yorgunluk; bir şey taşıyorsun."], "hatice": ["Topraktan bir şey çıkarmışsın evladım, yüzünden belli. Tohum mu, taş mı?", "Ablanın sesi deftere yazdığı gibi mi? Sakin, çocuk gibi. Otur, beraber dinleyelim."]}};GAME.people.arel={name:"Arel Vey",look:LK.arel};

ük frekans güvenliği: 25 Hz highpass master'da; sub osilatörler 30 Hz altına inmez (hit kaymasında 30 Hz sınır).", "Kullanıcı etkileşimi öncesi AudioContext suspended kalır; ilk tıklamada resume ve hub pad 4 sn fade-in."]};const WX={"baslangic": {"kind": "photon", "p": {"fogMul": 2.2, "lightMul": 0.6, "streakMul": 6, "flowMul": 2.5, "flowGlow": 0.25, "tint": "#ffb08a"}}, "kuantum": {"kind": "collapse", "p": {"shake": 1, "hideGlitch": true, "flowMul": 3, "flowGlow": 0.2}}, "gezegen": {"kind": "dust", "p": {"fogMul": 3, "lightMul": 0.7, "wind": 1, "tint": "#c8632a"}}, "bilinc": {"kind": "seizure", "p": {"pulse": 0.9, "shake": 0.3, "flowMul": 2, "tint": "#5a0a1e"}}, "anlam": {"kind": "eclipse", "p": {"lightMul": 0.22, "fogMul": 1.3, "tint": "#0a0612"}}, "yuva": {"kind": "meteor", "p": {"streakMul": 8, "aurora": true, "lightMul": 0.85}}},COMP={"baslangic": "kaan", "kuantum": "deniz", "gezegen": "riza", "bilinc": "zeynep", "anlam": "sema", "yuva": "hatice"};for(const r of GAME.realms){r.wx=WX[r.id];r.comp=COMP[r.id]}})();
;GAME.story2={"companion": {"baslangic": {"who": "kaan", "arrive": "İlk kez bir geçide seninle giriyorum. Mide bulantısı var mı? Yok mu? İyi; benimki var.", "firstPoint": "‘Bilmiyorum’ diyen profesör. ISS’te öyle birine rastlamadım; herkes bilirdi, kimse bilmezdi.", "afterFigure": ["Rahip, kozmolog, bir de genişleyen evren. ‘Neden’i sormuyormuş; ben de rapora yazmıyorum.", "Plakanın üstüne ‘VAR!’ yazmış. Biz de alarm paneline öyle yazardık: büyük harf, ünlem."], "zoneEdge": "Dur. Orası kırmızı; Mira’nın haritasında bile yok. Girersen ben dışarıda sayıyorum.", "zoneWait": "Arel, nefes al! Üç saniye içeri, üç saniye dışarı. Sesimi duyduğun sürece kaybolmadın.", "fragment": "Çıktın mı? Elinde ne var, kaset mi? Önce su iç, sonra dinle. Emir değil, tavsiye.", "caught": "Temas. Yörüngede buna ‘alarm’ derdik; sen ‘Bozulma’ diyorsun. Kalk, yeniden.", "hallucination": "Az önce beni duydun mu? Ben konuşmadım. ‘Üç gün’ diyen ben değildim; ben ‘iki’ demiştim.", "weather": "Foton fırtınası. Görüş sıfır; kaskın yok, benim de. Yere yakın dur, ışık geçene kadar.", "exit": "Geçit. Çıkmadan söyleyeyim: ilk sefer için fena değildi. Mide hariç.", "idle": ["Burada güneş doğmuyor Arel. Yörüngede 92 dakikada bir doğardı. Hangisini özledim, bilmiyorum.", "Şu kırmızı kristaller sağlam mı? Jeneratör için fikir alıyorum.", "Profesör, bir soru: Büyük Patlama’dan önce saat var mıydı? Yoksa ben sayamam."]}, "kuantum": {"who": "deniz", "arrive": "Vay be, buz ve su! Abi, kuantum ülkesi bu mu? Fotoğraf çeksem Motor kızar mı?", "firstPoint": "Dur dur dur. Elektron tek tek gidiyor ama desen yine çıkıyor? Sınavda sorsalar ‘imkânsız’ yazardım.", "afterFigure": ["‘It from bit’ dedi ya, soru sormak evreni kurmakmış. Yani ben soru sorunca evren biraz değişiyor mu?", "Dokuz kübit, solucan deliği ama solucan deliği değil. Kerem abi gibi ben de anlatabilir miyim bunu?"], "zoneEdge": "Abi o taraf çok karanlık. Mira abla ‘kırmızı bölge’ dedi. Gidiyorsun, değil mi? Tamam, buradayım.", "zoneWait": "Arel abi! Seni görüyorum, bulanık ama görüyorum. Gözlemci etkisi mi bu? Bakmayayım mı?", "fragment": "Buldun mu? Lale Hoca’nın sesi mi? Dinle dinle, ben uzağa giderim. Yani gitmem ama susarım.", "caught": "Abi! Bozulma seni yakaladı! Dalga fonksiyonu mu çöktü, sen mi? Neyse, kalk.", "hallucination": "Az önce ben konuştum mu? ‘Belirlenmiş miyim’ diye? Sormadım. Yani sordum ama şimdi değil.", "weather": "Çökme dalgası geliyor! Her şey tek bir yere çöküyor; abi, biz de çöker miyiz?", "exit": "Geçit açıldı. Abi, bir şey diyeceğim: Motor beni tahmin etti mi? Etmediyse ben kazandım.", "idle": ["Abi, Çoklu Dünyalar’da başka bir Deniz şu an burada değil mi? O da mı soru soruyor?", "Buzun altında su var, Europa gibi. Yürürken kırılır mı? Kırılırsa simülasyon mu kırılır?", "Olay ufkuna gidince saatim yavaşlar mı? Keşke sınav saatim de yavaşlasa."]}, "gezegen": {"who": "riza", "arrive": "Kızıl bir kıyı. Deniz yok ama kıyı var; kırk yıl sonra ilk kez ağsız geldim.", "firstPoint": "Leopar lekeleri mikrop artığı olabilirmiş, olmayabilirmiş. Balık da ağdan çıkana kadar belli olmaz evlat.", "afterFigure": ["Kamerayı Dünya’ya çevirtmiş adam. Ben de tekneden Karaköy’e bakardım; küçücük olurdu, yine evdi.", "Jüpiter uyduyu üç buçuk günde bir esnetiyormuş, ısı ondanmış. Gelgit bizde de var; balık ona göre gelir."], "zoneEdge": "Orası sisli evlat. Denizde sis varsa ağ atılmaz, beklenir. Sen bekleyemeyeceksin, biliyorum.", "zoneWait": "Arel! Sesim geliyor mu? Ben kıyıdayım, bir yere gitmem. Ağ bekler gibi bekliyorum.", "fragment": "Çıktın. Elinde ne var, ablanın sesi mi? Otur, dinle; ben öbür tarafa bakarım, kızıl tarafa.", "caught": "Düştün mü evlat? Dalga da öyle yapar; ayağını kaydırır, sonra bırakır. Kalk, kıyıya gel.", "hallucination": "Az önce beni duydun mu? ‘Hangi denize ağ atayım’ demişim. Demedim. Ama sorardım, doğru.", "weather": "Toz geliyor! Denizde buna sis deriz, burada kızıl. Sırtını rüzgâra ver, ben yanındayım.", "exit": "Geçit açıldı. Bu kıyıda balık yok evlat, ama ben yine de bakacaktım. Alışkanlık.", "idle": ["Bu taşlar sıcak mı soğuk mu evlat? Elini sürdün mü hiç, yoksa hep ölçüyor musun?", "Soluk Mavi Nokta bizim Dünya mı? Haliç de o noktanın içindeyse kirletmek daha ayıp.", "Profesör, Mars’ta eskiden deniz varmış. Balık da var mıydı?"]}, "bilinc": {"who": "zeynep", "arrive": "Burası senin beynin mi? Yoğun bakımda MR’lara bakarım; içinde yürümek başka.", "firstPoint": "−70 milivolt, eşik, hepsi ya da hiç. Monitörde her gün görüyorum; nöronun kendisini ilk kez.", "afterFigure": ["Hücreler birbirine değmiyormuş, konuşuyormuş. Servisteki gibi: kimse değmez, herkes konuşur.", "Nil Hanım yorgun görünüyordu. Lale’nin asistanıymış; en son kimin yanında kalmış, belli."], "zoneEdge": "Sis orası. Hipokampus mu dedin? Girersen seni adınla çağıracağım. Unutursan hatırlatırım.", "zoneWait": "Arel. Arel Vey. Adını söylüyorum ki içeride kaybolmasın. Buradayım, çıkışta.", "fragment": "Çıktın. Nefes al. Elinde ne var, bir ses mi? Hastalar da son günlerde bir şeyler saklar; bu onlardan.", "caught": "Yakalandın. Nöbette böyle düşenleri gördüm; kalkarlar. Elimi tut, kalk.", "hallucination": "Az önce duyduğun ben değildim. ‘Nereye’ diye üç kez sormuşum; bir kez sorarım, o da sessizce.", "weather": "Nöbet! Her şey aynı anda ateşliyor. Yere yat, başını koru; geçer, hep geçer.", "exit": "Geçit. Yorgunsun ama bu başka bir yorgunluk; nöbet sonrası gibi. Bir şey taşıyorsun, belli.", "idle": ["Burada hiç uyuyor musun Arel? Beyin dinlenince susmuyormuş; benimki nöbette de susmuyor.", "Dopamin beklenmeyene ateşleniyormuş. Hastam gözünü açınca işte o. Hiç alışmıyorum.", "Lale’nin hangi kaydını dinledin bugün? Sesi nasıl? Sakin mi?"]}, "anlam": {"who": "sema", "arrive": "Agora. Lale burayı anlatırken gülüyordu: ‘Filozoflar denklem istemez, Arel’e iyi gelir’ dedi.", "firstPoint": "Uçan Adam. Lale bunu bana nöbette anlattı; sen şimdi söylüyorsun. Aynı cümle, iki ağız.", "afterFigure": ["Hekim filozof. ‘Hasta giderken soru kalır’ dedi; bin yıldır serviste aynı cümle dolaşıyor.", "Nedenleri anlamak kederi azaltır demiş. Ben nedenleri biliyordum Arel; azalmadı. Sana da söylüyorum.", "Kardeşinin kim olduğu onu kuranların sorusu, dedi. Ben de kuranlardanım; son haftayı ben tuttum."], "zoneEdge": "Sütunların ardı. Lale’nin ‘kızdım’ dediği yer orası olmalı. Girmezsen anlarım; girersen de.", "zoneWait": "Arel, buradayım. Lale’nin sözünü şimdi söylüyorum: sana kızdı, kendine daha çok. Çık, konuşuruz.", "fragment": "Çıktın. Elin titriyor; geçitten değil, kayıttan. Ver, beraber dinleyelim. Hayır; önce sen.", "caught": "Yakalandın. Nabzın yüksek. Otur. Hayır, oturamazsın; kalk o hâlde, ama yavaş.", "hallucination": "Az önce ‘nabzın yok’ diyen ben değildim. Nabzın var; saydım. Yüksek ama var.", "weather": "Gölge tutulması. Işık yön değiştiriyor; göz kararır, baş döner. Elimi tut, geçene kadar.", "exit": "Geçit. Lale ‘Çekirdek’e varınca’ demişti; yaklaştın. Söylemem gerekeni söyledim.", "idle": ["Hiç uyuyor musun Arel? Anestezide uyutmak kolay; uyandırmak zor.", "Spinoza mercek parlatıyormuş. Lale de MR’larını kendi okurdu; ikisi de kendine bakmış.", "Bana kızgın mısın? Seni uzak tuttum. Lale’nin kararıydı ama el benimdi."]}, "yuva": {"who": "hatice", "arrive": "Toprak var, ağaç var, su var. Evladım, burası benim ova gibi; yalnız daha genç.", "firstPoint": "Dört milyar yaşında bir taş suyu hatırlıyormuş. Benim ovadaki taşlar da yağmuru hatırlasa keşke.", "afterFigure": ["Kadın komutan günde on altı gün doğumu görüyormuş. Ben seksen iki yıldır günde bir tane; yeter.", "Yusuf burada! Benim torunum, Motor’un içinde. Cevizi sulayacakmış; duydun mu evladım?"], "zoneEdge": "Orası karanlık evladım. Ablanın son kesiği orada dedin. Git; ben beklerim, beklemeyi bilirim.", "zoneWait": "Arel evladım! Buradayım, ağacın dibinde. Sis olsun, toz olsun; ninen bir yere gitmez.", "fragment": "Çıktın mı evladım? Yüzün değişmiş. Ablanın sesi mi o? Otur yanıma, beraber dinleyelim.", "caught": "Düştün mü yavrum? Toprağa düşen kalkar; ben seksen iki yıldır kalkıyorum. Gel, elimi tut.", "hallucination": "Az önce ‘ne diktin, sis mi’ demişim. Demedim evladım. Sen soru ekmişsin; o da biter.", "weather": "Gök taş yağdırıyor, kuzeyde de renkli ışık! Ağacın altına gel evladım; yağmur gibi bu, geçer.", "exit": "Geçit. Son boyut buymuş. Bir avuç toprak aldım, cebime koydum; ablana götürürüm.", "idle": ["Bu ağaçlar meyve verir mi evladım? Vermezse de olur, gölge verir.", "Ay her yıl uzaklaşıyormuş; benim de gözüm azaldı. Aynı şey mi?", "Ablan bir yaz köye geldi, tohum ekti. Sen hiç ekmedin dedin. Burada ek; toprak genç."]}}, "companionArel": {"baslangic": ["Saat yoktu Kaan; zaman o patlamayla başladı. Sayman gerekmez.", "Mideni boş ver; evren de ilk üç dakikada bulantı gibiydi. Sonra ışık geldi."], "kuantum": ["Başka bir Deniz olsa da soru senin; Everett bile bunu paylaştırmadı.", "Saatin yavaşlar ama sınav da seninle yavaşlar Deniz. Görelilik adildir."], "gezegen": ["Balık yok Rıza; belki mikrop, belki o da yok. Leopar lekeleri daha konuşmadı.", "Taşlara elimi sürmedim, hep ölçtüm. Bugün ilk kez tutuyorum; sıcak."], "bilinc": ["Pek uyumuyorum Zeynep. Varsayılan mod ağı Lale’yi tahmin ediyor; kapatamıyorum.", "Sesi sakin. Kestiği yerlerde değil; orada ses yok, sis var."], "anlam": ["Sana kızmıyorum Sema. Nedenleri biliyorum; Spinoza haklıymış, keder yine de kalıyor.", "Uyumuyorum. Beynim gece Lale’yi tahmin ediyor, gündüz Motor’u. Bazen anestezi isterdim."], "yuva": ["Meyve vermez nine; bu ağaçlar Motor’un kopyası. Gölgesi gerçek ama.", "Aynı şey değil ama benzer: ikisi de uzaklaşırken hâlâ aydınlatıyor."]}, "quests": [{"id": "q_mira", "giver": "mira", "title": "Altı Ondalık", "ask": "Motor’un CMB kopyasında 2,73 K yazıyor; yuvarlama mı, ölçüm mü bilmiyorum. İlk Işık’ta gerçek değer ve hata payı ne, bak gel.", "hint": "Başlangıç boyutu, İlk Işık yankı noktası; sıcaklığın ondalıklarına ve ± değerine bak.", "realm": "baslangic", "target": "cmb", "found": "2,7255 ± 0,0006 K. Motor altı ondalığı ve hata payını tutmuş; uydurmamış.", "deliver": ["2,7255, artı eksi 0,0006. Hata payını da kopyalamış; uydursaydı yuvarlardı, uyduranlar hep yuvarlar.", "Bunu rapora yazıyorum. Bakanlık tahmin istiyor; ben ölçüm veriyorum.", "Sis haritasında bir nokta daha maviye döndü. Teşekkürler."], "rewardText": "Sis haritası güncellendi: kırmızı bölgeler daha net.", "unlock": 5, "reward": {"kind": "look", "k": "gloves", "v": "#2a3a4a"}}, {"id": "q_kaan", "giver": "kaan", "title": "Dizlerin Sorusu", "ask": "ISS’ten dönünce kemiğin geri gelip gelmediğini kimse söylemedi. Yuva’da Komutan Elif var; Kelly’nin 340 günü sonrası ne oldu, sor.", "hint": "Yuva boyutu, Komutan Elif Aras; dönüş sonrası toparlanmayı sor.", "realm": "yuva", "target": "f:elif", "found": "Değişimlerin çoğu dönüşten sonra normale dönmüş. Kaan’ın dizlerine götürülecek haber.", "deliver": ["Çoğu normale dönmüş. ‘Çoğu’ kelimesine dizlerim takıldı ama kabul.", "Yörüngede ‘alışırsın’ dediler; alıştım. Dönmeye alışamadım, Elif de alışamayacak.", "Sağ ol. Jeneratöre bir gün daha ekledim; sayıyorum."], "rewardText": "Jeneratör yakıtı +1 gün: sayaç biraz nefes aldı.", "unlock": 3, "reward": {"kind": "look", "k": "badge", "v": "#7fd6ff"}}, {"id": "q_sema", "giver": "sema", "title": "Mikrotübül Notu", "ask": "Lale son ayında mikrotübül çalışmasını merak ediyordu; ben anestezide bunu her gün görüyorum. Nil’e sor: 2024’te sıçanlarda ilaç anesteziyi gerçekten geciktirdi mi?", "hint": "Bilinç boyutu, Dr. Nil Arslan; mikrotübül ve anestezi bulgusunu sor.", "realm": "bilinc", "target": "f:nil", "found": "Geciktirmiş; Nil kaynağıyla söylüyor. Kuantum bilinç kanıtı değil; Sema bunu da duymak ister.", "deliver": ["Geciktirmiş demek. İlginç; ama ben bilinci her gün kapatıyorum, nereye gittiğini hâlâ bilmiyorum.", "Lale buna gülerdi; ‘mikrotübül’ derken bile ‘kanıt değil’ diye eklerdi.", "Teşekkür ederim Arel. Nabzın bu kez normal."], "rewardText": "Sema’nın defterine bir not: anestezi ve bilinç.", "unlock": 4, "reward": {"kind": "integ"}}, {"id": "q_riza", "giver": "riza", "title": "Kaya mı Ağ mı", "ask": "Kahvede biri ‘Sisifos’ dedi; kayayı boşuna itiyormuş. Benim ağ da boşuna mı evlat? Filozoflara sor, bana getir.", "hint": "Anlam boyutu, Sisifos’un Kayası; Camus’nün ne dediğine bak.", "realm": "anlam", "target": "sisifos", "found": "Camus: Sisifos’u mutlu düşünmeliyiz. Rıza’nın ağı boşuna değil; her sabah yeniden örülen bir cevap.", "deliver": ["Mutlu mu düşünelim? Kırk yıl ağ attım, deniz unuttu; ben unutmadım. Demek kaya benim değil, ağ benim.", "Kahvedekine söyleyeceğim: Fransız da aynısını demiş, biz balıkçılar önce dedik.", "Sağ ol evlat. Boş ağ da dönmez, demiştim ya."], "rewardText": "Rıza’dan bir düğüm: ağ ilmeği, cebinde taşınır.", "unlock": 0, "reward": {"kind": "page"}}, {"id": "q_deniz", "giver": "deniz", "title": "Bahis: Bir Piksel", "ask": "Hocamla bahse girdim: Soluk Mavi Nokta’da Dünya bir piksel mi, daha az mı? Gezegenler’de fotoğrafın yanında yazıyormuş, bak gel abi.", "hint": "Gezegenler boyutu, Soluk Mavi Nokta yankı noktası; piksel değerine bak.", "realm": "gezegen", "target": "dot", "found": "0,12 piksel. Deniz bahsi kazandı, hocası kaybetti. Lale bunu duvarına asmıştı.", "deliver": ["0,12! Bir pikselin altında! Hocaya yarın söyleyeceğim, ödevden puan kırsa da değer.", "Dur bir saniye. Altı milyar kilometreden 0,12 piksel… O kadar küçüğüz ve ben sınav diye uyuyamıyorum.", "Lale Hoca bunu duvarına asmış, değil mi? Ben kilit ekranıma koyacağım."], "rewardText": "Deniz’in kilit ekranı: Soluk Mavi Nokta.", "unlock": 0, "reward": {"kind": "fuel", "v": 4}}, {"id": "q_zeynep", "giver": "zeynep", "title": "Giden Şeyin İzi", "ask": "Hastalar son nefesini verirken bir şey gidiyor; fizik buna ne diyor? Bilgi yok olur mu, bana bir hesap getir Arel.", "hint": "Kuantum boyutu, Simülasyon Kafesi; Landauer sınırına bak.", "realm": "kuantum", "target": "lattice", "found": "Landauer: tek bir biti silmek bile ısı bırakır. Zeynep’e söylerim: hiçbir şey iz bırakmadan gitmiyor.", "deliver": ["Bir biti silmek bile ısı bırakıyormuş. Demek giden şey iz bırakıyor; odada kalan sıcaklık belki ondan.", "Bunu hasta yakınlarına söyleyemem ama kendime söyleyebilirim. Nöbetler biraz hafifler.", "Sağ ol Arel. Sen de bir şey sildin mi, iz bıraktı mı?"], "rewardText": "Zeynep’ten bir nöbet defteri sayfası: ‘kT ln2’.", "unlock": 1, "reward": {"kind": "integ"}}, {"id": "q_hatice", "giver": "hatice", "title": "Ekmeğin Yaşı", "ask": "Yusuf diyor ki unun karbonu yıldızlardan gelmiş. Doğru mu evladım, ilk yıldız ne zaman yandı? Bak gel, tandırı ona göre yakarım.", "hint": "Başlangıç boyutu, Karanlık Çağın Sonu; ilk yıldızların zamanına bak.", "realm": "baslangic", "target": "stars", "found": "Büyük Patlama’dan 300 milyon yıl sonra ilk yıldızlar. Hatice Nine’nin tandırı oradan başlıyor.", "deliver": ["Üç yüz milyon yıl mı? Benim buğday dört ayda biter. Yıldız sabırlıymış.", "Demek ekmek yıldızdan. Ablan deftere böyle yazmıştı, inanmamıştım; şimdi inandım.", "Al, bu ekmeği yanına koy evladım. Yıldız tozu, sıcak."], "rewardText": "Hatice Nine’nin ekmeği: sıcak, 13,8 milyar yaşında.", "unlock": 2, "reward": {"kind": "look", "k": "scarf", "v": "#b8412e"}}], "weather": {"baslangic": {"name": "Foton Fırtınası", "start": "Foton fırtınası: ilk ışık saçılıyor, görüş düşük", "arel": "380 bin yıl önce ışık böyle hapisti: her elektrona çarpıp duruyordu. Şimdi ben çarpıyorum.", "end": "Fırtına dindi; ışık serbest kaldı."}, "kuantum": {"name": "Çökme Dalgası", "start": "Çökme dalgası: dalga fonksiyonları dağılıyor, dur", "arel": "Dekoherans. Ortam her şeyi ölçüyor; Tegmark 10⁻¹³ saniye demişti, burada biraz uzun sürüyor.", "end": "Dalga geçti; süperpozisyon geri geldi."}, "gezegen": {"name": "Toz Fırtınası", "start": "Toz fırtınası: Jezero kızıla kesti, görüş 10 metre", "arel": "2018’deki küresel toz fırtınası Opportunity’yi susturdu. Motor onu da kopyalamış; ben susmam.", "end": "Toz çöktü; kıyı yeniden görünüyor."}, "bilinc": {"name": "Nöbet", "start": "Nöbet: nöronlar senkron ateşliyor, zemin titriyor", "arel": "Eşik kalktı; 86 milyar hece aynı anda bağırıyor. Hepsi ya da hiç; şimdi hepsi.", "end": "Nöbet geçti; ritim −70 milivolta döndü."}, "anlam": {"name": "Gölge Tutulması", "start": "Gölge tutulması: gölgeler yön değiştiriyor", "arel": "Gölgeler yanlış yöne düşüyor. Agora zamanın dışında; güneşi de ödünç, gölgesi de.", "end": "Tutulma bitti; gölgeler yerine döndü."}, "yuva": {"name": "Meteor Yağmuru", "start": "Meteor yağmuru: gök yanıyor, kuzeyde aurora", "arel": "Geç Ağır Bombardıman; genç Dünya’ya böyle yağdı. Aurora: güneş rüzgârı, manyetik kalkan tutuyor.", "end": "Yağmur seyreldi; aurora sönüyor."}}, "minigames": {"esik": {"title": "Eşik", "intro": "Nöronun zarı −70 milivoltta; uyarımları zamanla, eşik −55 milivolt. Çok yüklersen aşırı uyarım olur, hücre susar; hata sayılır.", "win": "Eşik aşıldı; sodyum içeri, zar pozitife fırladı. Hepsi ya da hiç; bu kez hepsi.", "fail": ["Çok zayıf: toplam eşiğe varmadı, zar −70’e geri süzüldü.", "Aşırı uyarım: kanallar kilitlendi, nöron sustu.", "Zamanlama yanlış: uyarımlar birbirini beklemedi, toplam dağıldı."]}, "yorunge": {"title": "Yörünge Yakalama", "intro": "Clipper Jüpiter’e yaklaşıyor; fren yakışını doğru anda ver. Perijüpiter 1,0–1,4 RJ arasında kalmalı: daha alçak atmosfer, daha yüksek kaçış.", "win": "Yakalandı: perijüpiter aralıkta, Europa geçişleri başlayabilir.", "fail": ["Çarpışma: perijüpiter 1,0 RJ’nin altına indi, Clipper atmosfere girdi.", "Kaçış: fren yetmedi, Clipper hiperbolik kaldı ve Jüpiter’i geçip gitti.", "Yörünge çok yüksek: yakış zayıf, 49 Europa geçişi için yetersiz."]}}};
;GAME.story3={"epilogue": {"gozlemci": {"mira": ["Sisi olduğu gibi bıraktın; Motor hâlâ dürüst. Raporu kapattım, kimse okumayacak.", "Geçit sıcaklığı normal. Sen içeride kaldın; ben dışarıda ölçmeye devam ediyorum."], "kaan": ["Jeneratör dört gün verdi, sonra üç. Sayıyorum; alışkanlık, emir değil.", "Yörüngede de izlerdik, dokunmazdık. Orada hiç değilse 92 dakikada bir güneş doğardı."], "sema": ["Nabzın düşmüş, fazla düşmüş. İzlemek de yorar Arel; bunu serviste öğrendim.", "Kayıtları tuttun, ben Lale’nin sözünü tuttum. İkimiz de bırakmış sayılmayız."], "riza": ["Ağ atmayan balıkçı gördüm evlat; kıyıda oturur, denize bakar. Sen de öyle bakıyorsun.", "Gidiyorum. Haliç beni bekler, Motor seni bekler. Hangisi daha sabırlı, bilmem."], "deniz": ["Abi, Motor senin kalacağını tahmin etti mi? Ettiyse bahsi ben kaybettim.", "Soruyu yanımda götürüyorum. Sınavda çıkmaz ama ben çıkarırım."], "zeynep": ["Yoğun bakımda da böyle bakanlar var; her şeyi görür, elini uzatmaz. Elini uzat Arel.", "Nöbete dönüyorum. Giden şeyin nereye gittiğini bilmiyorum ama bir yere gidiyor."], "hatice": ["İzlemek de iştir demiştim evladım; ama tarla izlenmekle sulanmaz.", "Rafa bir avuç toprak bıraktım. Sisin içinde bir gün ekersin belki."], "lale": ["Yanıma oturdun; konuşmuyoruz. Dolanıklık böyle bir şey: ölçülmeden, sessiz.", "Her şeyi görüyorsun. Beni ben yapan şey de buradaydı; göremedin, çünkü bakmak dokunmak değil."]}, "kopru": {"mira": ["Sis kırmızı, tahmin mavi; ekranda ayrı duruyor. Bakanlık itiraz edemedi, saklı bir şey yok.", "Dün bir öğrenci CMB için ‘yuvarlama mı’ diye sordu. 2,7255 dedim; hata payıyla."], "kaan": ["Önce telsiz, sonra komuta. Oldu. Bakanlık liste istedi, ben sayımı bıraktım.", "Herkes giriyor; mide bulantısı tarifesini kapıya astım. Emir değil, tavsiye."], "sema": ["Lale’nin yankısını herkes dinliyor. Kayıtlar yalan söyler demiştim; kalabalıkta daha az söylüyor.", "Nabzın normal Arel. İlk kez geçitten değil, insanlardan yoruluyorsun."], "riza": ["Torunla ağ ördük, imzaları da topladım. Haliç’e ağ atılır mı, göreceğiz.", "Kahvede ‘Motor’u gördüm’ diyorum, inanmıyorlar. Balığa da inanmazlardı."], "deniz": ["İlk deneyimi kurdum abi: çift yarık, lazer, ev yapımı. Desen çıktı; annem ağladı.", "Motor beni tahmin edemedi. Ya da etti ama ben yine de yaptım; ikisi de olur."], "zeynep": ["Yoğun bakımda nöron anlattım: −70 milivolt, eşik. Hastam gülümsedi, ilk kez.", "Giden şeyin iz bıraktığını yakınlara söyledim. Söyleyemem demiştim; söyledim."], "hatice": ["Yusuf cevizi suluyor, damla hattı döşendi. Yağmur gelmedi ama su geldi.", "Defter doluyor evladım. Ablan dört soru yazmıştı; şimdi kırk var."], "lale": ["Kapıyı açtın. Beni görenler ‘o değil’ diyor; haklılar. Soru benim, ses benim, cevap onların.", "Defter yeni sorularla doluyor; hepsini okuyamıyorum. İyi; tam olarak istediğim buydu."]}, "sessizlik": {"mira": ["Motor’u kapattın; sis de gitti, ölçüm de. Son spektrumu sakladım, kimseye göstermedim.", "Bakanlık boş bir mağara buldu. Rapora ‘Motor hiç çalışmadı’ yazdım; ilk yalanım, sonuncusu da."], "kaan": ["Jeneratörleri boşalttım. Sayacak bir şey kalmadı; dizlerim hâlâ sayıyor.", "Konya’ya gidiyormuşsun. Orada güneş günde bir doğar; bana az, sana yeter."], "sema": ["Bırakmak da bir cevap demiştim. Altısını da dinledin, sonra bıraktın; sırası doğru.", "Kayıtları sakla. Bir gün dinlemek istersen yanında olurum; bu kez uzak tutmam."], "riza": ["Bu ağı bırakmak değil evlat, ağı katlamak. Fırtınada biz de katlarız; deniz kaçmaz.", "Dördümüz mektuplaşıyoruz. Sen yazmıyorsun; olsun, toprak da yazmaz."], "deniz": ["Motor kapandı, soru kapanmadı abi. Zeynep ablaya yazdım, Rıza amca cevapladı.", "Konya’da internet var mı? Yoksa mektup yazarım, eski usul."], "zeynep": ["Son nefesinde orada değildin; bu kez kapatırken oradaydın. Fark budur.", "Dördümüz yazışıyoruz, sen yazmıyorsun. Nöbette susanları tanırım; bir şey taşırlar."], "hatice": ["Gel evladım. Damla hattı döşenecek, elini toprağa sokacaksın; bir gün dedim ya.", "Yağmur gelmedi. Bekleriz; ben seksen iki yıldır bekliyorum, sen daha yenisin."], "lale": ["Beni kapattın; kızmadım. Theia da çarptı ve gitti; Ay kaldı. Bak, hâlâ aydınlatıyor.", "Konya’ya git. Tohum ek; ben ekerdim, sen izlerdin. Şimdi sıra sende; taşımak budur."]}}, "ngPlus": {"intro": ["Motor yeniden hesaplıyor. Aynı kayıtlar, aynı geçitler; sayılar başka yere düşüyor.", "Sis yer değiştirdi. Bildiğim yerler kırmızı, kırmızı bildiğim yerler açık.", "Bozulmalar daha cesur; artık kenarda beklemiyor, geçidin ağzında duruyor.", "Lale ‘sırayla konuşuruz’ demişti. Sıra bende; bu kez farklı bakacağım."], "arrive": {"baslangic": "İlk ışık yine 2,7 kelvin; soğumuş ama ikinci kez bakıyorum ve ilk kez üşüyorum.", "kuantum": "Çift yarığa dedektör koymadan bakmayı deneyeceğim; desen bozulursa bakan bendim.", "gezegen": "Jezero’nun tozu aynı, kraterin ortasındaki oda yer değiştirmiş; bu kez el sallayacağım.", "bilinc": "Kendi beynimde ikinci tur: her hatırlayış yeniden yazıyor, demek ki bu da başka bir Lale.", "anlam": "Agora boş değil; sütunların ardında gölgem bir adım önden gidiyor, kaya daha hafif.", "yuva": "Genç Dünya, aynı kıyı; zirkon beni hatırlamıyor ama ben kıyının nerede kırıldığını biliyorum."}, "lale": ["Geldin yine. Hatırlıyorum Arel; Motor unutuyor, ben unutmuyorum. Garip, değil mi?", "Altı parçayı topladın, kesikleri dinledin. Bu kez farklı bak: kestiklerime değil, kesmediklerime.", "Sis yer değiştirdi çünkü sen değiştin. Bir yer daha var: tanıdan önceki sabah. Onu kesmedim, sakladım."], "hidden7": {"hint": "Yedinci parça kesilmiş değil, saklanmış: sisin bittiği yerde, Lale’nin kesmediği tek sabahı ara.", "lines": ["Kayıt sıfır. Tanıdan önceki sabah; henüz hiçbir şey bilmiyorum ve bu, bilmediğim son sabah.", "Çay demledim, Haliç’e baktım, sana ‘kalibrasyon nasıl’ diye yazdım; cevap vermedin, önemli değildi.", "Bunu kesmedim, sakladım: sende yalnızca iyi tarafım değil, sıradan bir sabahım da kalsın diye."]}, "endingAdd": "İkinci turda Arel sisin yer değiştirdiğini gördü; Motor değil, bakan değişmişti. Kayıt Sıfır’ı dinlediyse bir sabah daha taşıyor: tanıdan önceki, sıradan, kesilmemiş."}, "posters": {"gozlemci": {"title": "Sisin İçinde Kalan", "tagline": "Her şeyi gördü, hiçbir şeye dokunmadı.", "quote": "Bakmak dokunmak değil, Arel; dolanıklık sessiz olur."}, "kopru": {"title": "Herkesin Sorusu", "tagline": "Sis kırmızı, tahmin ayrı; kapı herkese açık.", "quote": "Kapıyı açtın. Soru benim, ses benim, cevap onların."}, "sessizlik": {"title": "Konya’da Yağmur", "tagline": "Motor sustu, soru taşındı; toprak bekliyor.", "quote": "Theia çarptı ve gitti; Ay kaldı, hâlâ aydınlatıyor."}}, "photoMode": ["Voyager da geri baktı; altı milyar kilometreden 0,12 piksel. Ben bir kareden bakıyorum.", "Her kare bir dedektör; bakınca desen bozulur. Yine de çekiyorum.", "Lale duvarına bir nokta asmıştı. Ben de bir kare asacağım; sisli olsun, olsun."], "map": {"title": "Veri Haritası", "intro": "Ölçülen mavi, bilinmeyen kırmızı; Motor uydurmaz, sis gösterir.", "labels": {"facts": "Ölçülenler", "path": "İzlenen Yol", "integrity": "Motor Bütünlüğü", "fragments": "Kesik Parçalar", "time": "Geçen Süre"}}};

;GAME.story4={"achievements": [{"id": "first_fact", "name": "İlk Ölçüm", "desc": "İlk yankı noktasını incele; bir gerçek sisten çıkıp maviye dönsün.", "flavor": "Motor: Bir nokta ölçüldü. Sis bir piksel geri çekildi; fazlası yok."}, {"id": "all_facts_realm", "name": "Bir Boyut Mavi", "desc": "Bir boyuttaki tüm yankı noktalarını incele.", "flavor": "Arel: Bu boyutta sis kalmadı. Bilinmeyen kalmadı demek değil; ölçülen bitti."}, {"id": "all_facts", "name": "Ölçülenler Tamam", "desc": "Altı boyuttaki tüm yankı noktalarını incele.", "flavor": "Motor: Tüm ölçümler kayıtlı. Kalan kırmızı, bilmediğim yerdir; doldurmam."}, {"id": "six_logs", "name": "Altı Kayıt", "desc": "Lale’nin altı kaydını da sonuna kadar dinle.", "flavor": "Lale: Altısını dinledin. Kestiklerim hariç; onları Motor değil, sen bulacaksın."}, {"id": "first_frag", "name": "İlk Kesik", "desc": "Kırmızı bölgeden ilk kesik kayıt parçasını çıkar.", "flavor": "Lale: Bunu kesmiştim. Elinde durduğuna göre kesik değilmiş; saklıymış."}, {"id": "six_frags", "name": "Yedinci Ses", "desc": "Altı kesik parçayı da topla; Kayıt Yedi’nin kilidi açılsın.", "flavor": "Lale: Altısı da sende. Yedincisini ben kaydetmedim; sen birleştirdin."}, {"id": "record7", "name": "Kayıt Yedi", "desc": "Kayıt Yedi’yi kesmeden, sonuna kadar dinle.", "flavor": "Arel: Yarım bir insan hatırlanmaz. Artık yarım değil; ağır, ama tam."}, {"id": "record0", "name": "Sıradan Bir Sabah", "desc": "İkinci Tur’da Kayıt Sıfır’ı bul ve dinle.", "flavor": "Lale: Çay demledim, Haliç’e baktım. Bu kadarı; bunu da taşı, hafiftir."}, {"id": "no_hit_realm", "name": "Temassız Geçiş", "desc": "Bir boyutu Bozulma’ya hiç yakalanmadan tamamla.", "flavor": "Motor: Temas sıfır. Bozulma kayıtlarla aynı koordinatta kaldı; sen kalmadın."}, {"id": "survivor", "name": "Fırtınadan Çıkan", "desc": "Sis Fırtınası’nda süre dolmadan Lale’ye ulaş.", "flavor": "Lale: Geldin. Sis dağılmadı, sen de dağılmadın; ikisi de yeter."}, {"id": "caught5", "name": "Beş Temas", "desc": "Bozulma’ya beş kez yakalan ve her seferinde kalk.", "flavor": "Arel: Beş kez düştüm. Kaan düşüşleri sayıyor; ben kalkışları."}, {"id": "lantern10", "name": "Fener Taşıyan", "desc": "Sis Feneri’ni on kez yak.", "flavor": "Motor: Fener on kez yandı. Sis incelmedi; görüş değişti. Fark budur."}, {"id": "photo5", "name": "Beş Kare", "desc": "Fotoğraf modunda beş kare kaydet.", "flavor": "Arel: Voyager bir kare çekti, ben beş. Hiçbirinde 0,12 pikselden büyük değiliz."}, {"id": "quests_all", "name": "Yedi Tanık", "desc": "Yedi tanığın görevini de cevapla ve teslim et.", "flavor": "Lale: Soruları onlar yazdı, cevapları sen taşıdın. Defter böyle dolacaktı."}, {"id": "mini_both", "name": "Eşik ve Yörünge", "desc": "Eşik ve Yörünge Yakalama oyunlarının ikisini de kazan.", "flavor": "Motor: Nöron ateşledi, Clipper yakalandı. İki sistem, iki eşik, aynı el."}, {"id": "weather3", "name": "Üç Hava", "desc": "Üç farklı hava olayını başından sonuna atlat.", "flavor": "Arel: Foton, toz, nöbet. Motor havayı uydurmuyor; sabrı ben uyduruyorum."}, {"id": "halluc3", "name": "Bozuk Sesler", "desc": "Üç halüsinasyonu kaçmadan sonuna kadar dinle.", "flavor": "Lale: Duyduğun ben değildim. Ama sorular benimdi; onları sen eğmişsin."}, {"id": "tour2", "name": "İkinci Tur", "desc": "Çekirdek’e ikinci kez var; oyunu iki kez bitir.", "flavor": "Motor: Aynı kayıtlar, aynı yasalar. Sis yer değiştirdi; değişken sendin."}, {"id": "ending_each", "name": "Üç Kapı", "desc": "Gözlemci, Köprü ve Sessizlik sonlarının üçünü de gör.", "flavor": "Lale: Üç kez seçtin, üçünde de kızmadım. Soru aynı kaldı; taşıyan değişti."}, {"id": "fast_insight", "name": "Hızlı Sezgi", "desc": "Bir boyutun sezgisine on dakikadan kısa sürede ulaş.", "flavor": "Arel: On dakikada bir sezgi. Lale soruyu iki yılda bıraktı; hızlı olan ben değilim."}], "storm": {"start": ["MOTOR: Sis Fırtınası. Yankı bağlantısı zayıflıyor; süre başladı, ölçüm durdu.", "MİRA (telsiz): Spektrum kırmızıya kayıyor, haritadaki yolun siliniyor. Pusulaya değil, sese g
