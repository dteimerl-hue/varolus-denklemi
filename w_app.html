 async init(){if(this.ready)return;this.ready=true;try{if(!window.claude||!window.claude.use){this.local=true;TRACE.init();return}this.r=await window.claude.use('room');if(!this.r){this.local=true;TRACE.init();return}this.r.onPeers(ch=>this.onPeers(ch),()=>{this.r=null})}catch(e){this.r=null}},
 onPeers(ch){const P=(GAME.story4||{}).presence||{};const others=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.realm==='hub');

function drawMI(){const c=$('#mi');if(!c)return;const d=Math.min(2,devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);const L=28,B=h-18,Tw=w-L-10,X=t=>L+t/5*Tw,Y=v=>B-v*(B-10);
